conclude:
  may:
  - 'forced selling (long side) or forced buying (short side) was published for this coin in this window: at least this many dollars'
  - how big it was against this coin's own last 14 days (its percentage over a rolling window; the percentages are checked later)
  - when and on which coins liquidations clustered; the market total over the roster coins seen (coverage says how many)
  never:
  - 'the total amount liquidated on Binance: Binance publishes one print per coin per second and a busy second loses the rest'
  - 'that nothing was liquidated when the value is EMPTY: empty = the coin could not be seen (no file, trades gap, thin feed, bad row); only 0 means seen and none'
  - 'that coin A had more liquidations than coin B by comparing dollars across coins: read each against its own history'
  - an exact dollar amount inside a burst or crash second
  - 'that the market total is all of Binance: it is the roster coins seen, and BTC and ETH are 63.5 to 68.9% of its long dollars'
  - 'that a 5 s or 30 s value holds every print of its window: prints received after the window ended may be lost'

# MEANING_A1_V4.yaml: the meaning register of A1 liquidations, EDITION 4 (= edition 3 cb7e3b727252c3de + conclude, the owner 15:0x Berlin; + the bad-row limit). Edition 3 header follows:
# EDITION 3 (EDGE1, 2026-10-18, closed with the owner 14:5x Berlin).
# = MEANING_A1_V2 (39e18ecfdeb3d662, kept) with: the 8 edge cases "not yet seen" now seen (job 15811); how to read its size (its
# percentage against the coin's own 14 days: the owner, "we use this liquidation is in the top 1% for this coin over the past 14 days");
# every known limit written with its effect on decisions (none: the same in the history the percentage reads, and in live); EDGE2's
# Coinalyze and late-print facts (jobs 15739, 15740); the module sha16s in tools; S07 moved to BASIC_A1_V1 (BED, BR4 = WP4).
# The rule that closed it (WORKING_SESSION_V12 part 3): a card closes when its values equal their source, what the number means is known
# with the direction of its error, and the lab has its reading rules; every other detail is a written limit.
# ONE SOURCE OF TRUTH; rawcheck/meaning_register.py (edition 4) writes .flat.jsonl, .agent.jsonl and .md from it.
group: A1
name: liq_dollars
summary: US dollars of liquidations Binance published for one coin (or the 52 roster coins) in a window ending at e, valued at each order's limit price. Long = longs forced out (forced
  selling); short = shorts forced out (forced buying).
read_as: 'AT LEAST. Binance publishes only the last liquidation per coin per second; a busy second loses the rest. Never the full amount. Read its SIZE as its percentage against the
  coin''s own last 14 days (the percentages, pct_rule_v2, which replaced the fifths): top 1% = among the coin''s biggest minutes of the last 14 days. Never a fixed dollar line. Every
  limit below is the same in that history (and in live, which reads the same Binance feed), so the rank, and the decisions read from it, should not change (REASONING, not measured; the
  percentages of every metric over rolling windows are checked later, at the our-rules level: the owner 14:5x Berlin).'
where:
  card: testbed/value_audit/registers/CARD_A1_V5.md
  settings_register: testbed/value_audit/registers/SETTINGS_A1_V4.tsv
  source_spec: testbed/value_audit/registers/SOURCE_SPEC_liquidations_V3.md
  producer: prod_A1_v3.py with prod_reader_liquidations_v6.py and prod_reader_trades_v1.py (testbed/value_audit/code/L0_v4*/value_audit/code/)
  year_output: <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/A1.parquet
  year_output_columns: name (the setting, e.g. S08 or S12.coverage), coin (roster coin, or MARKET), as_of_us (e), value_kind (0 empty, 1 float, 2 int, else text), value_f64, value_txt,
    known_at_us, stale, empty_reason, flags
  read_it_with: team/LAB/code/rawcheck/ours.py at(D, 'A1', settings, coins, moments)
source:
  vendor: Tardis.dev, exchange binance-futures (Binance USDT-margined perpetuals)
  exchange_stream: Binance forceOrder, the liquidation order snapshot stream
  files: <ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/liquidations_<COIN>USDT_<YYYY-MM-DD>.csv.gz, and ..._<COIN>USDC_... when the coin has a USDC contract
  also_reads: trades_<COIN>USDT_<YYYY-MM-DD>.csv.gz, only to decide whether the coin is seen (rule 5)
  columns: exchange, symbol, timestamp, local_timestamp, id, side, price, amount
  fields:
    row: 'one liquidation order, FILLED; at most one per coin per second, the last in that second [proof: Binance docs B1; SOURCE_SPEC F2]'
    side: 'sell = a long was liquidated; buy = a short was liquidated [proof: Tardis docs T1; SOURCE_SPEC: 0 rows of any other side in BTC''s year]'
    amount: 'the quantity that FILLED (Binance z), all of it, over the order''s 1 to 3 ms of fills [proof: jobs 15775, 15776, 6 of 6 equal the same-side fills]'
    price: 'the order''s LIMIT price (Binance p, the worst allowed), not the fill price (ap) [proof: job 15775, 6 of 6 beyond every fill; card source line]'
    timestamp: 'exchange time of the order''s last fill, microseconds; a big order starts 1 to 2 ms before [proof: job 15776]'
    local_timestamp: 'when Tardis received the row, microseconds [proof: Tardis docs T1; SOURCE_SPEC columns]'
  latency: 'OPEN, decisions unchanged: SOURCE_SPEC F4 measured median 1.01 s, p99 2.8 s, max 5.1 s after the stamp (BTC year); job 15775 saw 6 to 20 ms on the 6 largest of 8 Mar; not
    measured on one whole day'
  silence: 'normal: the median day''s longest silence is 39 min, the longest 1 h 47 min (SOURCE_SPEC F3); silence cannot tell quiet from dead, so outages are read from trades'
reading_rules:
- 'window: rows stamped after e - W and up to e, and received by e (card rule 1); no look-ahead'
- 'dollars: price x amount per row, summed exactly, rounded once to the whole dollar, half up (rule 2)'
- 'side: sell rows to the long settings, buy rows to the short settings (rule 3)'
- 'seen: the coin''s USDT file exists for every day the window touches, it has a USDT trade in [e - 60 s, e] received by e, it is not thin, and it has no bad row (rule 5)'
- 'contracts: USDT and USDC summed; a USDC file expected and missing leaves USDT alone, flagged USDC_MISSING (rule 6)'
- 'market: the sum over the roster coins seen, with coverage = how many were seen (rules 8, 14); the roster is the week''s 52 coins'
- a row received after its minute ended counts in no earlier window (rule 11)
- a window crossing 00:00 reads the files of D-1 (rule 13)
values:
  units: US dollars, whole
  zero: the coin was seen and no liquidation of that side was published
  empty: the coin was not seen; empty_reason says why (NO_ROSTER, NO_FILE, TRADES_HOLE, THIN_FEED, BAD_INPUT, ALL_COINS_EMPTY). Never read empty as 0
  stale: '1 when the coin''s trades went quiet or thin, or the whole liquidation stream has been silent over 960 s at e (rule 16): then a 0 may be a dead feed'
  flags: USDC_MISSING, DUPLICATE_ROW, NO_RATE_BASE, BAD_INPUT
interpret:
  do:
  - read a value as "at least this much was force-closed"
  - read its size as its percentage against the coin's own rolling 14 days, never as dollars against another coin
  - trust per-order sizes; treat a burst minute's total as a floor
  - check stale and empty_reason before reading a 0
  dont:
  - read it as the full amount liquidated
  - use one dollar threshold for every coin
  - read empty as 0
  - read the market total as all of Binance; it is the 52 roster coins, and 63.5 to 68.9% of its long dollars are BTC and ETH (card)
biases:
- what: one row per coin per second
  direction: LOW
  size: unknown; larger in bursts; decisions unchanged (reasoning, see read_as)
  proof: Binance docs B1
- what: limit price, long liquidations
  direction: LOW
  size: 0.5 to 1.7% of the dollars (6 cases, 8 Mar); decisions unchanged (reasoning, see read_as)
  proof: job 15775
- what: limit price, short liquidations
  direction: HIGH (expected)
  size: NOT_TESTED; decisions unchanged (reasoning, see read_as)
  proof: reasoning only
- what: rows received after their minute
  direction: LOW
  size: 0.16 to 0.83% of long dollars a day; decisions unchanged (reasoning, see read_as)
  proof: card, limits
- what: prints received after a 5 s or 30 s window ended are lost to that window (rules 1, 11)
  direction: LOW
  size: 'BTC 10 Oct 2025: S01 day total 225.16 M against S08 226.79 M (0.7% less); cause not proven (EDGE2''s opinion); decisions unchanged (reasoning, see read_as)'
  proof: EDGE2 jobs 15739, 15740 (HANDOVER_EDGE2_V5 section C)
- what: 'thin feed: a coin trading under 1% of its usual minute is empty THIN_FEED until 5 minutes in a row at 20% (card rule 5, R8)'
  direction: EMPTY, never a wrong number
  size: 'DASH 24 Sep 2025: 85 minute ends empty while it traded; 89 THIN_FEED coin-minutes that day, none on 8 Mar 2026; decisions unchanged: an empty minute is skipped'
  proof: job 15811 (meaning_a1_open, meaning_a1_cover)
- what: daily totals against Coinalyze
  direction: ours HIGHER on crash days
  size: '179 days, median gap 1.5% (S08) and 1.9% (S09); every coin-day off by over 50% has ours larger; 10 Oct 2025 about 2.8 x; who is right is not known; decisions unchanged: it concerns
    Coinalyze''s record, not our reading of Binance''s'
  proof: EDGE2 jobs 15739, 15740
- what: a bad row (side not buy or sell; price or amount missing, not a number, or not above 0; no stamp) takes its coin out, BAD_INPUT (rule 4)
  direction: EMPTY, never a wrong number
  size: not checked against an outside record; no BAD_INPUT row on 24 Sep 2025 or 8 Mar 2026 (job 15811); decisions unchanged (reasoning, see read_as)
  proof: card rule 4; job 15811 (empties by reason)
external_checks:
- what: the definition of a row (one per second, fields p, ap, q, z, T)
  where: Binance docs B1
  status: VERIFIED
- what: side, price and amount columns
  where: Tardis docs T1
  status: VERIFIED
- what: a single liquidation's amount and price
  where: the same-side fills in Tardis trades (rawcheck/meaning_liq.py); Binance aggTrades at data.binance.vision for an outside copy
  status: 'VERIFIED on Tardis trades (6 cases, jobs 15775, 15776); aggTrades NOT_RUN, not needed: the same-side fills prove amount and price'
- what: daily totals per coin (tests Tardis's recording, not ours)
  where: 'Coinalyze liquidation history API (key: <DEV>/edge1_cloudkit/secrets/coinalyze.key, never printed)'
  status: 'RUN (EDGE2 jobs 15739, 15740): median gap 1.5 to 1.9%, ours larger on crash days (see biases); decisions unchanged'

group: D4
name: order flow at the first 10 levels of the book (formula, Xu, Gould and Howison, summed with equal weights, in dollars)
summary: 'The order flow at the first 10 levels of each side of the book of one coin over a window W ending at e: at every level by index,
  the dollars that came to or left it, signed by the side they help (as D1 at the top), summed over the 10 levels with equal weights and over
  every change of the book in the window. S01 to S05: the net over the gross, a share from -1 to 1; S06 to S10: the gross in whole dollars;
  S11: the gross flow''s pace, the last 5 s against the last 60 s; S12: the median roster coin''s 30 s share, with its coverage.
  Xu, Gould and Howison keep one OFI per level (a vector, in contracts) and weigh the levels by fit; D4 sums them with equal weights.'
read_as: 'Which side the book of the coin, deeper than its top, is being bought or sold into, and how busy it is. It follows the mid over
  the same window more closely than D1 (corr 0.53 to 0.63 pooled against D1''s 0.37 to 0.59; J15940 price). S12, the median coin''s share, follows the
  median coin''s 30 s return (corr 0.7263 and 0.8589, J15984): it is a market flow, not a depth imbalance.'
conclude:
  may:
  - 'whether the first 10 levels of the coin''s book were bought into (plus) or sold into (minus) over the window, as a share of its gross'
  - 'that the share moved with the mid over the same window (corr 0.53 to 0.63 pooled, 0.62 to 0.76 at the median coin; J15940)'
  - 'how busy the coin''s book was (S06 to S10) against its own history, and whether that flow sped up in the last 5 s (S11)'
  - 'whether the typical coin''s book was bought or sold into over the last 30 s (S12), with the coins counted beside'
  never:
  - 'S01 to S05 as Xu, Gould and Howison''s multi-level OFI: they sum the levels with equal weights in dollars and divide by the gross; the paper keeps a vector per level (could_build D4.CB1)'
  - 'S12 as a book (depth) imbalance: it is a flow share over 30 s; the resting bid against ask depth is could_build D4.CB3'
  - 'S11 as an acceleration: it is a pace ratio, 0 to 12'
  - 'S06 to S10 as trading: a fill of the best level shifts every level''s index and counts at all 10; churn counts; only the same coin''s history compares'
  - 'a value from an EMPTY one, or 0'
  - 'a copy (.seen_at_e_off) as a metric of its own: it is the year''s cross-check of the same metric'

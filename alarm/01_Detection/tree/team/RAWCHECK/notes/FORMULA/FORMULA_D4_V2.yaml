  empty: 'NO_ROSTER, NO_FILE, BOOK_HOLE, BAD_INPUT, NO_LEVELS, NO_FLOW (S11), ALL_COINS_EMPTY (S12); value_kind 0; never read empty as 0 (no empty on 8 Mar 2026 and 24 Sep 2025: J15925, J15984 schema)'

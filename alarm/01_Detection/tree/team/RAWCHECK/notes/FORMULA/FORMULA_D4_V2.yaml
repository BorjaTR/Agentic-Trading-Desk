reading_rules:
- 'an event = a row with the row before it in file order; at each level m = 0 to 9 by index, b_m and a_m as D1 rule 2 at that level (an empty bid at price 0, an empty ask at an infinite price, 0 dollars); net = the sum of b_m + a_m over the 10 levels, gross = the sum of |b_m| + |a_m| (CARD_D4_V7 rule 2)'
- 'windows, rounding, BOOK_HOLE with the 15 s gap, BAD_INPUT, NO_FILE (D-1 when e - W - 15 s is before 00:00), NO_LEVELS for a one-sided book (edition 7): as D1 (rules 3 to 9)'
- 'S11 = 12 x the 5 s gross over the 60 s gross, 4 decimals; NO_FLOW when the 60 s gross is 0 (rule 10)'
- 'S12 = the median of the roster coins'' exact 30 s shares (the mean of the two middle ones), 6 decimals; ALL_COINS_EMPTY or the coins'' common reason when no coin has a value; flags BAD_INPUT:<coin> and the counted coins'' DUPLICATE_ROW (rule 11)'
- 'the year also writes 11 copies .seen_at_e_off (the book seen at e only) as its own cross-check: ACCEPTED (the owner''s copies rule): equal to the metric at 100% of rows on both days (J15849 TWINS_20260308 a9bc9402dcda74b9, TWINS_20250924 0ea4c5c8804a3576); not separate metrics'

  year_output_columns: name, coin, as_of_us (e), value_kind (0 empty, 1 float, 2 int, 4 decimal with value_f64 and its text), value_f64, value_txt, known_at_us, stale, empty_reason, flags
  read_it_with: team/LAB/code/rawcheck/ours.py at(D, 'D1', settings, coins, moments)
source:
  vendor: Tardis.dev, binance-futures (CSV files)
  exchange_stream: 'book_ticker: Binance USD-M futures bookTicker channel, one message on every change of the best bid or ask price or amount (SOURCE_SPEC_book_ticker_V2 Q-B1, Q-T2)'
  files: <ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/book_ticker_<SYMBOL>_<YYYY-MM-DD>.csv.gz (read by exact path)
  columns: exchange, symbol, timestamp, local_timestamp, ask_amount, ask_price, bid_price, bid_amount
  fields:
    bid_price, ask_price: 'the best bid and ask in USDT [proof: SOURCE_SPEC_book_ticker_V2 Q-T2; raw D2 S01 LIMITS, MEANING_D2D3_V2]'
    bid_amount, ask_amount: 'the amount at the best bid and ask in the coin; its dollars are price x amount [proof: SOURCE_SPEC_book_ticker_V2 Q-T2; recomputed exactly, D1_STAMPS_V1]'
    timestamp: 'the message''s event time, microseconds [proof: SOURCE_SPEC_book_ticker_V2 Q-N1]'
    local_timestamp: 'the arrival at Tardis, microseconds; the file is in arrival order [proof: SOURCE_SPEC_book_ticker_V2 Q-T2, F4]'
  latency: 'an event is known at the later arrival of its two rows (CARD_D1_V4 rule 2); known_at = the latest arrival in the window (rule 10)'
reading_rules:
- 'an event = a book_ticker row with the row before it in file order: b = [Pb_n >= Pb_n-1] Pb_n qb_n - [Pb_n <= Pb_n-1] Pb_n-1 qb_n-1, a = [Pa_n >= Pa_n-1] Pa_n-1 qa_n-1 - [Pa_n <= Pa_n-1] Pa_n qa_n, in dollars; net = b + a, gross = |b| + |a| (CARD_D1_V4 rule 2)'
- 'the window of W ending at e: the events stamped after e - W and up to e, and received by e (rule 3)'
- 'S06 to S10 = the gross sum rounded once to the whole dollar, half up; S01 to S05 = the net sum over the gross sum rounded once to 6 decimals, half up, a tie away from 0; 0.000000 when the gross is 0 (rules 4, 5)'
- 'empty BOOK_HOLE (stale) unless a row stamped in the last 30 s was received at every moment of [e - W, e]; BAD_INPUT when an event of the window has a bad row; NO_FILE when a needed file is missing (D-1 when e - W - 30 s is before 00:00); the first failing in that order, then NO_LEVELS; a window with no event is 0 only when the row in force before it is good (rules 6 to 9, 18)'
- 'COPIES: the year writes 10 .seen_at_e_off (the book seen at e only), the same metric: ACCEPTED as its cross-check (the owner''s copies rule): equal to the metric at 100% of rows on both days, no book hole there (J15849 TWINS_20260308 a9bc9402dcda74b9, TWINS_20250924 0ea4c5c8804a3576)'
- 'BESIDE, ANOTHER METRIC (EDGE1 15:33:13Z, the owner rules): the 10 .quotes_off are the same rules on the Tardis quotes stream (CARD_D1_V4 rule 15): recomputed exactly at 200 of 200 named points (BTC, CRV, PEPE, XMR x 00:03, 02:10, 04:00, the busiest and calmest minute, 8 Mar 2026; J15985, formula_d1 ed3 bc64d30fd6fa106d); equal to the main at 0 to 32% of rows, corr 0.90 to 0.95 (shares), 0.84 to 0.98 (grosses), |gap| median 0.025 to 0.061 share points (J15849): another stream of the top, not a second source of the same number; no meaning work on them until the owner rules'
values:
  units: 'S01 to S05: a share from -1 to 1, 6 decimals; S06 to S10: whole dollars'
  empty: 'NO_ROSTER, NO_FILE, BOOK_HOLE, BAD_INPUT, NO_LEVELS; value_kind 0; never read empty as 0 (no empty on 8 Mar 2026: J15910 schema)'
  stale: with BOOK_HOLE
  flags: DUPLICATE_ROW:<coin>
interpret:
  do:
  - read S01 to S05 as the share of the top's dollar flow that helped the buyers (plus) or the sellers (minus), with its gross beside
  - read S06 to S10 against the same coin's own history
  dont:
  - read the share as the paper's OFI magnitude
  - compare grosses across coins
biases:
- what: equal amounts added on both sides are priced at the bid and at the ask
  direction: the share leans to the sellers (minus) when both sides grow alike
  size: '-(ask - bid) / (ask + bid): half the relative spread (CARD_D1_V4 E16: -0.004975 for 100 / 101)'
  proof: test_meaning_ofi 77fdbc92983d39d3 t_step4_cks_vs_d1
- what: the share divides by the gross; quote churn inflates the gross
  direction: towards 0 on churning coins, against the paper's depth-normalised OFI
  size: 'not measured beyond step 3''s points (the smart check, section 0c item 5)'
  proof: CARD_D1_V4 rule 5; J15910 (the 134.39 dollar flips of BTC 02:10)

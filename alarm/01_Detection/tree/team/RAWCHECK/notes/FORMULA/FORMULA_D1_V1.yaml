# job files (numbers from files). Edit 2 (METRIC_AUDIT review E2, 15:31:18Z): the whole-file sign count beside the 75 points. Edit 3
# (EDGE1 15:33:13Z): .quotes_off another metric beside, recomputed at named points (J15985). Computation J15911 to J15913 (formula_d1 ed1 e031d2c101fa8be8); step 4 meaning_ofi ef48d2534299c9e8 (tests 77fdbc92983d39d3), J15940.
group: D1
name: order flow at the top of the book (formula, Cont, Kukanov and Stoikov 2014, priced in dollars)
summary: 'The order flow at the best bid and ask of one coin over a window W ending at e (1, 5, 30, 60, 120 s): every change of the top
  signed by the side it helps (bids added or asks taken away help the buyers), in dollars at each level''s own price, summed over the window.
  S01 to S05: the net over the gross, a share from -1 to 1 (renamed from "ofi"); S06 to S10: the gross in whole dollars. The flows are Cont,
  Kukanov and Stoikov''s e_n priced in dollars; the paper sums e_n in contracts and does not divide it.'
read_as: 'Which side the top of the coin''s book is being bought or sold into, and how busy it is. The share has the sign of the paper''s
  OFI at 75 of 75 of step 3''s points (J15940) and moves with the mid over the same window: corr 0.37 to 0.59 pooled over every coin-minute
  of 2 days, 0.41 to 0.73 at the median coin (J15940 price). It is a share, not the paper''s magnitude: the paper''s depth-normalised form is could_build D1.CB1.'
conclude:
  may:
  - 'whether the top of the coin''s book was bought into (plus) or sold into (minus) over the window, and how one-sided, as a share of its gross (the paper''s sign at 75 of 75 points)'
  - 'that the share moved with the mid over the same window (corr 0.37 to 0.59 pooled, J15940)'
  - 'how busy the coin''s top was over the window (S06 to S10), against the same coin''s own history'
  never:
  - 'S01 to S05 as the paper''s OFI or in a price-impact regression with the paper''s slope: they are divided by the gross flow, not the depth; the paper''s form is could_build D1.CB1'
  - 'a share near 0 as balanced on a wide-tick coin: equal adds on both sides give -(ask - bid) / (ask + bid), half the relative spread (E16)'
  - 'S06 to S10 compared across coins as more trading: the gross counts every dollar added to or taken from the best quotes, quote churn included, and scales with the coin''s price and book'
  - 'a 1 s or 5 s share of plus or minus 1 as a strong signal: such windows hold a handful of events (BTC 8 Mar 2026 02:10: 6 in 1 s, 74 in 5 s; J15910)'
  - 'a value from an EMPTY one, or 0'
  - 'a .seen_at_e_off copy as a metric of its own: it is the year''s cross-check of the same metric'
  - 'a .quotes_off twin as the same metric: it is the same rule on another stream (equal to the main at 0 to 32% of rows); another metric beside, the owner rules it'
where:
  card: testbed/value_audit/code/L0_y52f12/value_audit/registers/CARD_D1_V4.md (dfdc22a7a7e6883c)
  settings_register: testbed/value_audit/code/L0_y52f12/value_audit/registers/SETTINGS_D1_V2.tsv (299597cafc3fe2b7)

- what: the paper's OFI (Cont, Kukanov and Stoikov 2014) coded apart from the producer, on the planted cases and at step 3's points
  where: rawcheck/meaning_ofi.py cks() (tests t_step4_cks_vs_d1) and OFI_NAME_20260308.tsv 0013bfff559278f7 (J15940)
  status: 'SAME SIGN, ANOTHER UNIT: 75 of 75 points (the whole file (BTC, ETH, CRV, every minute end x 5 windows): the same sign at 21509 of 21512, the others at |share| 0.000005 or less); the share is the paper''s flow in dollars over the gross'
- what: the mid move over the same window (the year's C1 S01 5 s, S02 30 s, S25 60 s, S03 120 s), every coin-minute of 8 Mar 2026 and 24 Sep 2025 (year store only)
  where: rawcheck/meaning_ofi.py price (J15940, 6 s a day)
  status: 'MOVES WITH IT: corr 0.37 to 0.59 pooled (20250924 73287, 20260308 74724 coin-minutes), 0.41 to 0.73 at the median coin'

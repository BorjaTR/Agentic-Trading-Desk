group: D5
name: liquidity latch, our rule S01 (set when the median spread z or the top-dollars thin z reaches 3, released after 30 minutes with both under 1)
summary: >-
  Stepped over the minute ends from 00:00 of D-1 to e (then e at a fire): set when released and D2 S05 >= 3 or D3 S17 >= 3; calm when both
  have values and both are under 1; released when set and the calm run that reaches the step is 30 minutes long (31 calm minute ends); the
  value 1 when set, 0 when released and both inputs have values, else empty with S05's reason first (CARD_D5_V6 rules 2 to 7).
read_as: >-
  The year writes the latch exactly (2,880 of 2,880 minute ends, replayed on the year's own S05 and S17 of D-1 and D, RULE_D5_STAMPS_V1,
  J16001). But it is on nearly all the time: 1 at 1,440 of 1,440 minutes of 8 Mar 2026 (never released) and 1,379 of 1,440 of 24 Sep 2025
  (released only 17:15 to 17:45 and 19:48 to 20:17). What breaks the calm: on 24 Sep 2025 the spread leg (S05 under 1 at 76.04% of minutes, S17 at 92.43%), on 8 Mar 2026 both legs (S05
  under 1 at 57.71%, S17 at 65.62%); S05 is a z of a one-step spread whose MAD is about 1% of the median (OUR_RULE_D2_V1). The calm (both
  under 1) covers 70.49% and 39.44% of minutes but its longest run is 50 and 18 minute ends (J16003), so the replay released it 2 and 0
  times in D (J16001). Its four
  readers therefore see a near-constant 1: CHAIN_forced_LONG_ride skips on it, the two quiet chains enter on it, AIR-POCKET's 'or' is true.

conclude:
  may:
    - "whether the latch was set at e by the card's rules (S01: the year's value equals our replay at 2,880 of 2,880 minute ends of 8 Mar 2026 and 24 Sep 2025; RULE_D5_STAMPS_V1, J16001)"
    - "a release as a rare calm half hour of the median spread and top dollars both: 2 releases on 24 Sep 2025, none on 8 Mar 2026 (J16001)"
  never:
    - "S01 = 1 as a rare stress of the book: 1 at 100% (8 Mar 2026) and 95.76% (24 Sep 2025) of minutes (J16001)"
    - "S01 = 1 as a liquidation event: it reads the spread (D2 S05) and the top dollars (D3 S17), no liquidations (CARD_D5_V6 rule 1); two chains' words say 'no liquidation latch' while their rule enters on 1"
    - "S01 = 1 as set by thin books: S17 is 3 or more at 0.07% and 0.14% of minutes; what keeps the calm from lasting 30 minutes is S05 at 1 or more (23.96%, 42.29% of minutes) and, on 8 Mar 2026, S17 at 1 or more (34.38%) too (J16003)"


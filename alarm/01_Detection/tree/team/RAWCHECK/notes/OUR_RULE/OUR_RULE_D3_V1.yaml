group: D3
name: deeper book, our rules (the walls of the 25 levels; the median coin's top dollars as a robust z against its last 24 hours)
summary: >-
  From the book_snapshot_25 row in force at e (seen within 15 s): a side's wall is its level of the most dollars among the 25, the nearest to
  the mid among equals; S09, S10 its distance from the mid in bps; S11, S12 its dollars over the median dollars of the side's filled levels;
  S13, S14 the change of the side's wall dollars over 60 s, (W(e) - W(e - 60 s)) / W(e - 60 s), the wall of each moment (CARD_D3_V4 rules
  10, 11). S17 = -(x - med) / (1.4826 x MAD) of D3 S16 (the median roster coin's top-of-book dollars) against the minute ends of the last
  24 h, + = thinner (rule 14).
read_as: >-
  The year writes all seven exactly: the walls 1,790 of 1,790 each from the Tardis rows (7 coins, every minute end 00:02 to 03:00 of 8 Mar
  2026 and 24 Sep 2025) and at every coin-minute of both days against BED's book base; S17 18 of 18 at named minute ends (17 distinct: on 24 Sep 2025 the largest and 'at 3 from above' are both 02:51; J16001). The 25
  levels end close to the mid: for BTC and ETH the wall is level 0 (the top) at 87.15% to 94.97% of minutes a side, so their S09, S10 are
  half the spread (0.0044 to 0.0120 bps) and S11, S12 run into the thousands (BTC 13,121, ETH 33,058); for AVAX and HYPE it is level 24, the
  snapshot's edge, at 10.06% to 13.97% of minutes a side on 8 Mar 2026: the wall may be further out than the 25 levels show. S17 is a sound
  z (its MAD 10.96% and 12.80% of the median over the day, 12.51% and 12.77% at the 2 and 1 minutes with z 3 to 3.5, where the top dollars
  are about 58% under their 24 h median; 3 or more at 0.14% and 0.07% of minutes), but it
  reads the TOP of the book only (S16, renamed in BASIC_D3_V1 from 'depth'): its name depth_thin_z is renamed by RULING 3.

conclude:
  may:
    - "how far from the mid each side's biggest resting level of the 25 sits (S09, S10, bps) and how much bigger than the side's median level it is (S11, S12) (RULE_D3_STAMPS_V1, J16001)"
    - "how much the dollars of a side's biggest level changed over the last minute (S13, S14), the wall of each moment"
    - "how thin the median coin's top of book is against its own last 24 hours (S17: 3.1220 at 11:43 of 8 Mar 2026, the top dollars 6,811.55 against 13,594.68 at 10:06, the minute nearest S17 0; J16001)"
  never:
    - "S09, S10 of BTC or ETH as a wall away from the top: their wall is level 0 at 87.15% to 94.97% of minutes a side (00:02 to 03:00 of 8 Mar 2026, 24 Sep 2025, J16001), S09 = half the spread"
    - "S09, S10 at the 25th level as the wall's place: AVAX and HYPE have it at level 24, the snapshot's edge, at 10.06% to 13.97% of minutes a side on 8 Mar 2026 (J16001); the true wall may be further"
    - "S13, S14 as one wall growing or shrinking: the wall at e may be another level than at e - 60 s (CARD_D3_V4 E35: a wall moves; how often not measured)"
    - "S17 as the depth of the book: it is the median coin's level-0 dollars (D3 S16, BASIC_D3_V1)"


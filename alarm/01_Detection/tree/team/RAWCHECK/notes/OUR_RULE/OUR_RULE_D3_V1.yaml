  exchange_stream: "depth (diff updates) as Tardis rebuilds it into 25-level snapshots; S17 reads D3 S16's minute values"
  files: "<ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/book_snapshot_25_<SYM>_<YYYY-MM-DD>.csv.gz of D (and D-1 when e - 75 s is before 00:00); for S17's check, BED's book base MARKET.parquet D3 S16_exact"
  columns: "exchange, symbol, timestamp, local_timestamp, asks[0..24].price, asks[0..24].amount, bids[0..24].price, bids[0..24].amount"
  fields:
    wall: "a side's level of the most dollars (price x amount) among its filled levels, the nearest to the mid among equals; S09 = (mid - Pb_wall) / mid x 10,000, S10 = (Pa_wall - mid) / mid x 10,000; S11, S12 = the wall's dollars over the median of the side's filled levels' dollars [proof: CARD_D3_V4 rule 10, O6 A; planted E27, E31 to E33, E35 in tests/test_rule_book.py; mutants wall_far, wall_mean; RULE_D3_STAMPS_V1]"
    trend: "S13, S14 = (W(e) - W(e - 60 s)) / W(e - 60 s), W the side's wall dollars of the row in force at that moment; empty with e's reason, else e - 60 s's [proof: rule 11, O7 A; planted E34 to E36, B3; mutants s13_lag_30, trend_over_now]"
    S17: "-(x - med) / (1.4826 x MAD) of the exact S16 at e and at the minute ends after e - 24 h and before e; THIN_HISTORY under 720, FLAT_HISTORY at MAD 0 [proof: rule 14; planted E42 to E48; mutant s17_sign]"
  latency: "the row in force at e (received by e); known_at = its arrival (CARD_D3_V4 rule 15); not checked here"
  silence: "a coin not seen within 15 s: BOOK_HOLE, stale; none at the checked coin-minutes (J16001: every coin-minute against the book base MATCH, empty reasons none)"

reading_rules:
  - "the 25 levels of a liquid coin span a few bps: a wall is the biggest level INSIDE the snapshot, not on the whole book"
  - "for BTC and ETH the top level is the wall most minutes: S09, S10 equal half the spread and S11, S12 compare the top with thin deeper levels"
  - "S13, S14 compare the biggest level now with the biggest level a minute ago, wherever each sits"
  - "S17 + = thinner: it is minus the z of the median coin's level-0 dollars; the year also writes S17.coverage and S17.quotes_off (not checked in this card, the owner's copies rule)"

values:
  units: "S09, S10: bps from the mid; S11, S12: a ratio (1 = the wall is the median level); S13, S14: a fraction (0.5 = the wall's dollars up 50% in a minute); S17: a robust z, + = thinner"
  zero: "S13, S14 0: the biggest level's dollars unchanged over the minute; S17 0: the median top dollars at their 24 h median"
  empty: "NO_FILE, BOOK_HOLE, BAD_INPUT, NO_LEVELS (the walls); S16's reasons, THIN_HISTORY, FLAT_HISTORY (S17); value_kind 0. Never read empty as 0"
  stale: "true when empty BOOK_HOLE (CARD_D3_V4 rule 15)"
  flags: "S16's BAD_INPUT:<coin> for S17"

interpret:
  do:
    - "read S09, S10 with the coin's spread: at a one-step book a wall at the top is half the spread"
    - "read S17 as the TOP of the book thinning (the median coin's best bid and ask dollars)"
  dont:
    - "read S11, S12 of BTC or ETH in the thousands as a rare wall: their top level is the wall at 87 to 95% of minutes"


source:
  vendor: Tardis.dev, Binance USD-M futures trades, through our C13 (the close, high and low of the 60 s ending at each minute end)
  exchange_stream: trades as Tardis records them, read by C13; C10 reads C13's minute rows of D-1 and D, never a stream
  files: 'the year''s C13 of D-1 and D (C13.parquet: S01 to S04) for the roster of D''s week'
  columns: 'C13 S01 close, S02 high, S03 low (decimal text), S04 no trade (1: the price carried, high = low = close); each with empty_reason'
  fields:
    dial: 'the median over the roster coins with a close at t of the 120-minute width pct of their valued minutes, never before 00:00 of D-1; empty (no coin, or 0): the chain''s last dial carried; before the first dial nothing steps [proof: CARD_C10_V4 rule 2, C9 rule 6; planted N7, E309, E310; mutants no carry and a 121-minute window caught; J16004: the median of the year''s C9 S08 equal at 7 of 7 points]'
    chain: 'the cold start at the first minute of D-1 with a close and a dial (an up leg); a leg ends when low <= E (1 - X dial / 100) (high >= E (1 + X dial / 100)), the reversal tested before the extension; the new leg''s extreme the most extreme price after the old extreme up to m [proof: CARD_C10_V4 rules 1, 3, 4; planted N2, N3a, N3b, N4, N6, E301 to E305, E307 and the falling dial (mine); mutants O3 B, a strict floor, the cold start at D, the confirming minute''s low caught; RULE_C10_STAMPS_V1 eeb7b1804ddb67c2]'
    legs: 'leg dir, age, size pct, pullback share (clipped), swing structure, swings today and in all [proof: CARD_C10_V4 rules 5 to 8, 14; planted E301, E302, E303, E306, E307, N4; mutants no clip, a lower-middle median caught; RULE_C10_STAMPS_V1 eeb7b1804ddb67c2]'
    market: 'the median and the share over the coins with a value [proof: CARD_C10_V4 rule 16; planted N1a, N7, E306; RULE_C10_STAMPS_V1 eeb7b1804ddb67c2]'
  latency: known_at = the latest known_at of C13's rows at m of the coin and of the dial's coins (rule 15); not a year column, not checked here
  silence: 'a coin with no C13 close at m is empty with C13''s reason (TRADES_HOLE, THIN_FEED stale); on 8 Mar 2026 no roster coin was empty at a minute end of D (J16004 named no such point): planted only (N1a, E305)'
reading_rules:
- 'the swing size is X times the market''s dial: the same percent for every coin, never the coin''s own range'
- a leg ends on a minute's low (high), not its close; the reversal is tested against the extreme before the minute (O3 A)
- the chain begins at 00:00 of D-1 as an up leg; swings total says how mature it is
- the record's m6x<X>_mkt_* names of the coin settings are BTC's values
values:
  units: 'S01, S15, S29: +1 or -1; S02, S16, S30: minutes; S03, S17, S31: percent (12 decimals); S04, S18, S32: a share 0 to 1 (12 decimals); S05, S19, S33: +1, -1 or 0; S06, S07, S20, S21, S34, S35: counts; S43, S48, S53: a share 0 to 1; S44, S49, S54: a share 0 to 1'
  zero: 'S03 0: the leg has no size (the cold start, or a leg that ended at its start); S04 0: the close at the leg''s extreme; S05 0: no shape, or fewer than two highs or lows; S06 0: no swing today'
  empty: 'NO_ROSTER, NO_FILE, TRADES_HOLE, THIN_FEED, BAD_INPUT (C13''s), NO_DIAL (before the chain''s first dial), NO_RANGE (the leg with no size: S04 and its twins), ALL_COINS_EMPTY (the market); value_kind 0. Never read empty as 0'
  stale: true when empty because C13 went quiet or thin (TRADES_HOLE, THIN_FEED); not a year column
  flags: DUPLICATE_ROW, NO_RATE_BASE (C13's), BAD_INPUT:<coin> (the market); not a year column
interpret:
  do:
  - 'read leg dir with swings total: 0 swings means the cold start''s leg'
  - compare coins by their swings today only knowing the size is the market's dial
  dont:
  - read a leg as the coin's own swing scale
  - 'read m6x<X>_mkt_* as the market: it is BTC'

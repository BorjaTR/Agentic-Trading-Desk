group: C10
name: 'price legs, our rules: the legs and swings (TREE''s family of OR1; METRIC_AUDIT3''s OUR_RULE_C10_M11_V1 holds today''s legs, S08 to S14, S22 to S28, S36 to S42, S45 to S47, S50 to S52, S55 to S57)'
summary: 'For each roster coin at each minute end m of D and for each swing size X of 0.25, 0.5 and 1 dial (the dial: the market''s 2-hour width, the median coin''s 120-minute range in percent, C9 rule 6), the coin''s price is cut into legs by a percent zigzag on its minute highs and lows: a leg ends when a minute''s low (high) reaches the leg''s extreme less (plus) X dials. Per coin: the running leg''s direction, age, size and the share of it the close has given back (S01 to S04, S15 to S18, S29 to S32), the shape of the last two swing highs and lows (S05, S19, S33), the swings confirmed today and since the chain began at 00:00 of D-1 (S06, S07, S20, S21, S34, S35). For the market: the median pullback share and the share of coins in an up leg (S43, S44, S48, S49, S53, S54). The record''s m6x<X>_mkt_* names of the coin settings are BTC''s own values.'
read_as: 'The swing size is the market''s, the same percent for every coin: on 8 Mar 2026 the swings per coin per day were median 77.5 (7 to 1066) at X 0.25, 27.5 (4 to 162) at X 0.5 and 5.5 (0 to 40) at X 1 (J16004 c10fire on the year rows of 8 Mar 2026). The chain begins cold at 00:00 of D-1 as an up leg: a coin with no swing since then (1 of 52 at X 1 on 8 Mar 2026) shows +1 and an age from the cold start, not a rise. A wick reverses a leg: on the closes alone 3 to 20 of 52 coins would be in the other leg at X 1 at the 7 points (J16004). Every value equals our exact recompute from C13 at 7 points of 8 Mar 2026 named by case (RULE_C10_STAMPS_V1 eeb7b1804ddb67c2).'
conclude:
  may:
  - whether the coin (or BTC) is in an up or a down leg of at least X dials, how old and how big that leg is, and how much of it the close has given back (S01 to S04, S15 to S18, S29 to S32)
  - whether the coin's last two swing highs and lows both rise (+1) or both fall (-1) at that swing size (S05, S19, S33)
  - how many swings the coin made today and since 00:00 of D-1 at that swing size (S06, S07, S20, S21, S34, S35); with swings total 0 the leg is the cold start's
  - the market's middle coin pullback share and the share of coins in an up leg (S43, S44, S48, S49, S53, S54)
  never:
  - 'a swing as the coin''s own scale: the size is the market''s dial for every coin; on 8 Mar 2026 one coin made 1066 swings at X 0.25 and one none at X 1 (J16004 c10fire on the year rows of 8 Mar 2026)'
  - 'leg dir +1 as a rise when swings total (S07, S21, S35) is 0: it is the cold start''s up leg (1 of 52 coins at X 1 at 00:00 and 1 at 12:00 of 8 Mar 2026)'
  - 'the record''s m6x<X>_mkt_* names of S01 to S07, S15 to S21, S29 to S35 as the market: they are BTC''s values; the market is S43, S44, S48, S49, S53, S54'
  - 'a leg as the zigzag of the closes: a minute''s wick ends it; at the 7 points of 8 Mar 2026 up to 16, 18 and 20 of 52 coins (X 0.25, 0.5, 1) would be in the other leg on the closes (J16004)'
  - 'leg age or swings total as of the move''s true start: the chain never reads before 00:00 of D-1'
  - 'empty as 0: NO_DIAL before the chain''s first dial, C13''s reason when the coin has no close at m, NO_RANGE when the leg has no size'

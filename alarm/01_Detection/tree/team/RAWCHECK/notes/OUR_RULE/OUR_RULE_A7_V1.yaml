# Edit 1 (BED, 18 Oct 2026, before landing; EDGE2's REVIEW OR4.A7 OK with nits 17:18:08Z): (1) A4 S04, S05 not landed, V32 NOT_CHECKED, said
# here and in rule_a7 ed3 c1d1d0b7 (its docstring only, the code as ed2's); (2) 'the flush far along is rare' replaced by the sizes; (3) the
# whole dollar's tie, half away from 0, written and planted (B6, tests ed3 4d9f11a8, 22 of 22 on the Mac, J16024); (4) the stamp and the sha16; notes (5) the

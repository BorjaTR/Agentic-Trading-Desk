group: A7
name: open interest since the liquidation wave began, our rules (per coin and for the market, on the long and the short wave's clock)
summary: >-
  At a minute end m with the market's long (short) wave of age a running (A4 S04, S05): the start is the minute end m - (a + 1) min; per coin
  S01 (S03) = (OI(m) - OI(start)) / OI(start), 6 decimals; S02 (S04) = (OI(m) - OI(start)) x mark(m), whole dollars, OI = E2 S02 (the coin's
  Binance open interest in coins), mark = the coin's Binance mark price at m (derivative_ticker, 61.0 s level); for the market S05 (S08) the
  coins' summed dollars over their summed OI(start) x mark(m), S06 (S09) the median of the coins' shares, S07 (S10) the summed dollars. No
  wave: NO_WAVE (A4's reason) (CARD_A7_V6 rules 1 to 7).
read_as: >-
  The year writes all ten exactly: every roster coin at every minute end (74,880 and 73,440 values each of S01 to S04) and the market (1,440
  each of S05 to S10) on 8 Mar 2026 and 24 Sep 2025, from the year's A4 and E2 rows and the mark read from the Tardis files (RULE_A7_STAMPS_V1,
  J16019). While a long wave runs (248 and 385 minute ends) the market's share S05 is below 0 at 58.87% and 56.88% of them, by a median of
  -0.0187% and -0.0080% (the most -0.69% and -0.21%): the open interest moves hundredths of a percent and either way; A7's card's 'very
  negative: the flush far along' names no level, and no minute is counted against one here. In a short wave (287, 271) S08 is below 0 at 68.29% and 69.00%. The dollars settings value the change in coins
  at the mark NOW: they leave out the price's move on the open interest, so they are not 'the change of the dollar open interest' their old
  names say (RENAMED, RULING 3, EDGE1 16:19:26Z).

conclude:
  may:
    - "how much of a coin's (the market's) open interest has left or come in since the minute before the market's liquidation wave began, as a share (S01, S03, S05, S06, S08, S09) and in coins valued at the mark now (S02, S04, S07, S10) (RULE_A7_STAMPS_V1, J16019)"
  never:
    - "S02, S04, S07, S10 as the change of the dollar open interest: they are the change in coins valued at the mark of m, the price move left out (RULING 3)"
    - "S05 below 0 as the flush far along: it is below 0 at 58.87% and 56.88% of the long-wave minutes, by a median of -0.0187% and -0.0080% (8 Mar 2026, 24 Sep 2025, J16019)"
    - "a short wave's S08 below 0 as the shorts covering: the open interest also falls at 68.29% and 69.00% of the short-wave minutes, which the long side shows too (J16019)"


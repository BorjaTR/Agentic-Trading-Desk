source:
  vendor: "Tardis.dev, binance-futures derivative_ticker (open interest, mark price) and liquidations, through E2 S02 and A4 S04, S05"
  exchange_stream: "the ticker's openInterest and markPrice as Tardis records them; A4's waves from forceOrder"
  files: "the year's A4 (D), E2 (D-1, D) and A7 (D) output; <ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/derivative_ticker_<SYM>_<YYYY-MM-DD>.csv.gz of D (and D-1 before D's first row) for the mark"
  columns: "A4 S04, S05 (MARKET); E2 S02 of every roster coin; local_timestamp, mark_price (the check reads the mark's text exactly)"
  fields:
    start: "the minute end m - (a + 1) min, a the side's wave age at m [proof: CARD_A7_V6 rule 2; planted E60 (age 0: m - 1 min), E61 (age 10: m - 11 min), E66 (age 14) in tests/test_rule_a7.py; mutant start_at_first; RULE_A7_STAMPS_V1]"
    coin: "share (OI(m) - OI(start)) / OI(start), 6 decimals half away from 0, ZERO_BASE at a start of 0 (the dollars stand); dollars (OI(m) - OI(start)) x mark(m), whole dollars, a tie half away from 0 (prod_A7_v3 69, 70; basic_book.rnd 51 to 58); an empty input: m's reason, then the start's, then the mark's [proof: rules 3 to 6; planted E60 to E62, E64, E66 to E68, N2, B1, B6 (-0.5 dollars give -1, 2.5 give 3); mutants start_reason_first, round_even]"
    market: "the summed dollars over the summed OI(start) x mark(m) of the coins with both, the median of the shares, the summed dollars; no coin: the common reason, else ALL_COINS_EMPTY [proof: rule 7; planted E60 to E64, E69, N2, B2; mutants share_any, mean_share]"
    mark: "the mark_price of the last row received by m carrying one (D's file, else D-1's); its age over 61.0 s: STALE_VALUE (61.0 s exactly is not); no file NO_FILE [proof: E2 rules 1 to 6; planted B3, B4 on planted ticker files; mutant level_60; E2's bad-row rule 3 not read here]"
  latency: "known_at = the latest of A4's, E2's at m and at the start, and the mark's row (CARD_A7_V6 rule 8); not checked here"
  silence: "no wave: every value of the side NO_WAVE; the mark never empty at a coin-minute of a running wave on the two days (J16019)"

reading_rules:
  - "the clock is the market's wave (A4); the open interest is each coin's own (E2)"
  - "the share compares coins with coins; the dollars value that change at the mark of m, not the dollar open interest's change"
  - "the year also writes the market's coverage beside: not checked in this card"
  - "the check takes the roster from sources.roster (CF.ROSTER_CSV, team/LAB/code/COIN_SYMBOLS_V2.csv, by onboard date), not D's week roster file (CARD_A7_V6 rule 11); the coin sets agreed on both days (every coin-minute matched: 52 and 51 coins, J16019); NO_ROSTER not read: an open"

values:
  units: "S01, S03, S05, S06, S08, S09: a share (-0.05 = 5% of the start's open interest left); S02, S04, S07, S10: dollars (coins x the mark of m)"
  zero: "0: the open interest where it was at the start"
  empty: "NO_WAVE, NO_HISTORY and A1's reasons (through A4); NO_FILE, BAD_INPUT, NO_VALUE, STALE_VALUE (E2's and the mark's); ZERO_BASE; NO_ROSTER; ALL_COINS_EMPTY; value_kind 0. Never read empty as 0"
  stale: "true for an empty value from a stale input (A4's stale or STALE_VALUE)"
  flags: "DUPLICATE_ROW:<coin>, BAD_INPUT:<coin> (CARD_A7_V6 rule 9; not checked here)"

interpret:
  do:
    - "read S05 and S08 against their own small size: hundredths of a percent move while a wave runs"
  dont:
    - "read the dollars as the dollar open interest's change"


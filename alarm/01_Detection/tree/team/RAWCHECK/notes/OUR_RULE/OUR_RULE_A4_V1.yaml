group: A4
name: liquidation waves, our rules (the market's minutes of 100,000 dollars or more of one side's liquidations, over the last 15 minutes)
summary: >-
  At a minute end m, from A1 S12 (long) and S13 (short), the market's liquidation dollars of each minute: a wave minute holds 100,000 dollars
  or more; an empty minute is none. S01 the long wave minutes among m - 14 to m; S02 NO_FUEL (0), FLUSH (1 to 3), CASCADE (4 or more); S03
  m less the last long wave minute of the window, or NO_WAVE; S04 (long), S05 (short) the running wave's age: m less its first minute (a wave
  minute with none in the 14 before), NO_WAVE without a wave in the window, NO_HISTORY when its first minute is among 00:00 to 00:13 of D-1;
  S06 1 when m is a long wave minute. m's own A1 value empty: every setting empty with its reason (CARD_A4_V6 rules 1 to 9).
read_as: >-
  The year writes all six exactly: 17,280 of 17,280 minute values replayed from its own A1 rows on 8 Mar 2026 and 24 Sep 2025
  (RULE_A4_STAMPS_V1, J16014). The floor is the whole market's dollars (mostly BTC and ETH, A4's card): a long wave minute came 39 and 51
  times a day (S06 1 at 2.71% and 3.54% of minutes), a long wave ran (S04 valued) at 17.22% and 26.74% of minutes, a short one at 19.93% and
  18.82%, CASCADE at 3.12% and 3.82%. S01 is 0 at 82.78% and 73.26% of minutes, so its fifths are mostly the 0 class. S01 counts minutes,
  not age: the forced SHORT chains' condition 9 reads it as the wave's age (A4's card), S04 is the age itself.

conclude:
  may:
    - "how many of the last 15 minutes held 100,000 dollars or more of the market's long liquidations (S01), and its band (S02), the minutes since the last (S03), the age of the running long and short wave (S04, S05), and whether this minute is one (S06) (RULE_A4_STAMPS_V1, J16014)"
  never:
    - "S01 as the wave's age (the forced SHORT chains' condition 9 reads it so): it is a count of wave minutes; S04 is the age"
    - "a wave as rare: a long wave ran at 17.22% and 26.74% of minutes of 8 Mar 2026 and 24 Sep 2025, a short one at 19.93% and 18.82% (J16014)"
    - "a wave as one coin's: the floor is the whole market's dollars, mostly BTC and ETH (CARD_A4_V6)"


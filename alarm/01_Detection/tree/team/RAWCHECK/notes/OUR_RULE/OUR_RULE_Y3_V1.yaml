reading_rules:
  - "0 = the list was seen and nothing of that kind fired; empty = not seen, no file, no fire in the minute, or no roster: never 0"
  - "a count of fires counts triggers (one move can fire the 3 windows); a count of coins counts coins"
  - "up and down are the trigger's side; a fade trades against it (the owner's LONG fade fades a down fire)"
  - "a minute setting at a fire gives the last full minute"

values:
  units: "counts, ranks and 0/1; seconds (S10, S14, S16, exact); a coin (S15); shares 0 to 1 (S18, S19, 4 decimals)"
  zero: "nothing of that kind in the window, the list seen"
  empty: "NO_FILE, LIST_SILENT (stale), NO_FIRE, NO_ROSTER; value_kind 0. Never read empty as 0"
  stale: "true only with LIST_SILENT"
  flags: "fid=<fid> on every fire row; BAD_INPUT, DUPLICATE_ROW (rule 15: not compared here)"

interpret:
  do:
    - "read a fire's counts with its side and window; read S20, S21 beside S12, S13"
  dont:
    - "read the year's Y3 as the live engine's alarms"
    - "read S26 = 0 as usual"


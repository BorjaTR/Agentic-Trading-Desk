# Input named first (EDGE1 16:01:25Z HOW): J15998 (rule_y3src 733e99c0). Computation and meaning: J16005 (rule_y3 13584182, the card's rules
# written again with no import of prod_Y3_v4 or its reader), every row of 8 Mar 2026 and 24 Sep 2025. One card for the 26 (16 fire, 10

group: Y3
name: "the other fires around a fire, and the facts of each UTC minute, on the fire list (our rule)"
summary: >-
  A fire is one CUSUM, CUSUM_W30 or CUSUM_W40 trigger of mode EXHAUSTION of one coin at one second, on its side (up or down), from the
  list prod_reader_fire_list_v1 calls 'engine'. At each fire of D, Y3 counts the fires before it (60 s, 300 s, the day, its minute, 30
  and 60 min: any side, its side, the other side, other coins, its own coin), its rank in its minute and its seconds since the minute's
  first fire; at each of the 1,440 minute ends, the minute's fires, coins, span, leader and its second, the coins up and down, and the
  share of the roster (less BTC) that fired within 60 s and 300 s of a minute's first fire. Every window looks back and leaves the
  fire's own second out; a value is empty LIST_SILENT when the list had a gap over 739 s in its span, NO_FILE when a day it needs has no
  file, NO_FIRE when a minute has no fire, NO_ROSTER without the week's roster.
read_as: >-
  The year's Y3 is exactly the card's rules on the list it read: 28,323 of 28,323 values on 8 Mar 2026 and 23,031 of 23,031 on 24 Sep
  2025, the fire ids equal (663 and 411; J16005). But that list is not the engine's recorded triggers the card names: on the year days
  the reader's 'engine' files are ARCH's year root (VOLAT_FOR root_year52r), every row 'source' REPLAYED: the engine's code fed the
  recorded data again (ARCH_REPLAYED_FIRES_V3 section 1). It holds 51 and 50 coins and 663 and 411 fires a day where the card's facts
  (the live engine, Sep 2026) say 18 to 32 coins and 155 to 301; never BTC holds (0 BTC fires). Y3's silence gap is the engine's 739 s,
  while the reader's normal gap for the replay list is 900 s: 304 fire values and 33 minute values are LIST_SILENT on 24 Sep 2025.


    - "the counts, ranks, spans and shares as the card's rules define them, on the list the year reads (J16005: 28,323 of 28,323 and 23,031 of 23,031 values; fire ids equal)"
    - "on the year days, how clustered the replayed EXHAUSTION fires were: 64.4 and 59.1 percent of fires lead their minute (S11); 86.6 and 83.2 percent have a fade of their side in the 300 s before (S05); 52.0 and 45.8 percent refire within the hour (S22) (J16005)"
  never:
    - "Y3 on a year day as the live engine's recorded fires: every row read is REPLAYED (2,886 + 4,314 rows for 8 Mar 2026, 4,904 + 3,900 for 24 Sep 2025; J16005), a replay of the engine's code, not measured here against the engine's own file on a day both hold"
    - "the card's thin facts on the year (18 to 32 coins a day, 155 to 301 fires, spec F1, F7): 51 and 50 coins, 663 and 411 fires (J16005); only 'never BTC' holds"
    - "a LIST_SILENT value of a year day as an engine outage: the gap is the engine's 739 s on a replayed list whose reader gap is 900 s (prod_reader_fire_list_v1 NORMAL_GAP_S); 304 fire and 33 minute values on 24 Sep 2025"
    - "a fifth of any Y3 name from FIFTHS: all 26 are fifths NO (F04 by prod_FIFTHS_v11 Rules.classify over METRIC_CLOCK_FIFTHS_V2; OUR_RULE_FIFTHS_V1): CHAIN_forced_LONG_ride's 'cofire_5m in fifth 4 SKIP' (CARD_Y3_V9 part 1) reads a fifth FIFTHS never writes"
    - "S04 as a count of fires (it counts the other coins, OPEN-5 A); S18, S19 as the share at the minute m (they describe the minute that ended 60 s and 300 s before m, OPEN-4 A)"
    - "S26 at 0 (the first fire after a quiet hour) as common: 5 of 663 and 5 of 408 valued fires (J16005)"


  latency: "known_at = x_0's (CARD_B1_V7 rule 22); not checked here"
  silence: "x_0 empty: S13, S14 empty with its reason; none on the two days (J16008: empty 0)"

reading_rules:
  - "S13 compares the median coin's last 5 minutes with its own last 2 hours; it is a drift of a ratio, not of dollars"
  - "S14 = S13 squared: always 0 or more, no sign"
  - "the inputs are S12 at the minute ends, so S13 at a fire gives the last full minute (CARD_B1_V7 E320)"

values:
  units: "S13: (mean5 - mean120) over 1.4826 MAD, no unit: means over a robust spread, not the median-centred robust z (+ = more taker buying than the last 2 hours); S14: its square"
  zero: "S13 0: the last 5 minutes at the 2-hour mean"
  empty: "S12's reasons (x_0), SHORT_HISTORY, NO_SPREAD, NO_ROSTER; value_kind 0. Never read empty as 0"
  stale: "as x_0 (CARD_B1_V7 rule 22)"
  flags: "S12's"

interpret:

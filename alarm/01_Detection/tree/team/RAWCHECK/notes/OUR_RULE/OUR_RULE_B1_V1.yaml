group: B1
name: taker flow, our rules (S13 the drift of the median coin's taker ratio over 5 minutes against 2 hours; S14 its square)
summary: >-
  At a minute end m: x_j = the exact B1 S12 (the median roster coin's taker buy dollars over taker sell dollars of 300 s) at m - j min, j = 0
  to 119; S13 = (the mean of x_0 to x_4 - the mean of the 120) / (1.4826 x the median of |x_j - their median|), 4 decimals; x_0 empty: its
  reason; another x_j empty: SHORT_HISTORY; a spread of 0: NO_SPREAD (CARD_B1_V7 rule 13). S14 = the exact S13 squared, 4 decimals, empty as
  S13 (rule 14).
read_as: >-
  The year writes both exactly: S12 recomputed from the Tardis trades of every roster coin equals the year's at 145 of 145 minute ends a day,
  and S13, S14 from it equal the year's at 26 of 26 named minute ends of 8 Mar 2026 and 24 Sep 2025 and at 22:44 of 24 Sep (RULE_B1_STAMPS_V1,
  J16008, J16011). S13 leans up: 2 or more at 1.53% and 3.33% of minutes, -2 or less at 0.00% and 0.83%; the cause, that S12 is a median of RATIOS
  (above 1 unbounded, below 1 bounded by 0; BASIC_B1_V3 reads ln(S08) for a symmetric scale), is an opinion here, not measured (a ln twin
  would test it). S14 squares the sign away (4 or more at 1.53% and
  4.17%): the chains' taker_shift fifths read a buying and a selling drift alike.

conclude:
  may:
    - "how far the median coin's taker buy over sell ratio of the last 5 minutes sits from its last 2 hours, as (mean of 5 - mean of 120) over 1.4826 MAD (S13: the year's value equals our exact recompute at 26 named minute ends a day (02:05 to 02:30) of 8 Mar 2026 and 24 Sep 2025 and at 22:44 of 24 Sep 2025; RULE_B1_STAMPS_V1, J16008, J16011)"
    - "how large that drift is, either way (S14 = S13 squared)"
  never:
    - "S13 as symmetric: on a ratio scale it reaches 2 or more at 1.53% and 3.33% of minutes, -2 or less at 0.00% and 0.83% (8 Mar 2026, 24 Sep 2025, J16008)"
    - "S14 as a direction: it is S13 squared; a buying and a selling drift give the same S14"


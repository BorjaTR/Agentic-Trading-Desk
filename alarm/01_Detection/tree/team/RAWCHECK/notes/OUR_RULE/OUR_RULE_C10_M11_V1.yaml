source:
  vendor: "Tardis.dev, Binance USD-M futures trades, through our C13 and the C10 chain (OUR_RULE_C10_LEGS_V1)"
  exchange_stream: "trades as Tardis records them, read by C13"
  files: "the year's C13 of D-1 and D, the roster of D's week (as OUR_RULE_C10_LEGS_V1)"
  columns: "the chain's legs at each minute end: size at the end, recovered pullback, swing highs and lows with their minutes"
  fields:
    today: "a leg completes at the minute its swing is confirmed; today's legs are those completed at minute ends of D up to m [proof: CARD_C10_V4 rule 10; planted E301, E302 (the flat leg from 00:00 of D-1 a completed leg of size 0, METRIC_AUDIT2 16:00:11Z); J16004]"
    ratios: "leg rel size and pullback rel, exact, 12 decimals half up; empty NO_PRIOR_LEG, NO_PULLBACK in rule 12's order [proof: rules 11, 12, 14; E306, E307; J16004 values; J16021 the reasons, 2,038 of 2,038 (rule 12's order planted only)]"
    swings: "the last 8 confirmed swings, the latest higher low (lower high), counted from the swing's own minute, not its confirmation [proof: rule 13; E301 S27 1, E312; J16004]"
    market: "over the coins with a value: the share with a leg rel size over 1, the medians [proof: rule 16, O4 A; J16004 7 of 7]"
  latency: "as OUR_RULE_C10_LEGS_V1 (known_at of C13's rows at m)"
  silence: "the year's rows hold C13's empties: TRADES_HOLE 16, THIN_FEED 89 coin-minutes of each M11 coin setting on 24 Sep 2025, none on 8 Mar 2026 (J16015); the pass-through is proven on planted N1a only (no recompute ran on 24 Sep 2025: J16004, J16021 are 8 Mar)"

reading_rules:
  - "every M11 value is the coin against its own legs of today (from 00:00 of D)"
  - "'big' (S45, S50, S55) is a leg rel size over 1: bigger than the coin's median leg of today (O4 A)"
  - "the record's m6x<X>_m6x<X>_m11_mkt_* names of the coin settings are BTC's values"

values:
  units: "S08, S22, S36: counts; S09, S23, S37: percent; S10, S24, S38, S12, S26, S40: ratios (12 decimals); S11, S25, S39: a share 0 to 1; S13, S14, S27, S28, S41, S42: minutes; S45, S50, S55: a share 0 to 1; S46, S51, S56, S47, S52, S57: ratios"
  zero: "S08 0: no leg completed today; S12 0: the close at the leg's extreme; S45 0: no coin bigger than its median leg"
  empty: "NO_PRIOR_LEG, NO_PULLBACK, NO_SWING, NO_DIAL, C13's (TRADES_HOLE, THIN_FEED, NO_FILE, BAD_INPUT), ALL_COINS_EMPTY (the market); value_kind 0. Never read empty as 0"
  stale: "as C13's (TRADES_HOLE, THIN_FEED)"
  flags: "as OUR_RULE_C10_LEGS_V1"

interpret:
  do:
    - "read S10 (S24, S38) with S08 (S22, S36) beside it: a ratio on 1 or 2 legs is young"
  dont:
    - "read the big leg share as a size: it is a rank against each coin's own day"

biases:

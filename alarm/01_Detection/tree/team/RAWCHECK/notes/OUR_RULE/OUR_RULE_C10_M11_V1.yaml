group: C10
name: "price legs, our rules: today's legs (the record's M11: the running leg against the legs completed today, and the market's shares)"
summary: >-
  On the legs of OUR_RULE_C10_LEGS_V1 (a coin's price cut by its swings of X = 0.25, 0.5 or 1 dial), at each minute end m and for each X:
  the legs completed today (from 00:00 of D) and their median size; the running leg's size against that median (leg rel size); the
  median recovered pullback of today's legs and the running pullback against it; the minutes since the last higher low and the last lower
  high among the last 8 swings. For the market: the share of coins whose leg rel size is over 1 (big leg share), and the medians of the
  coins' leg rel size and pullback rel. Empty NO_PRIOR_LEG before a leg completes today, NO_PULLBACK when no completed leg had a
  recovered pullback, NO_SWING when the last 8 swings hold no higher low (lower high).
read_as: >-
  Every value is the card's rule (TREE's J16004: 364 of 364 a coin setting, 7 of 7 a market one, at 7 points of 8 Mar 2026). They are
  relative to the coin's own day: 'big' means bigger than the coin's median leg completed today, which about half the legs are at their
  end (56.7 to 60.1 percent on 8 Mar 2026, 41.2 to 47.2 on 24 Sep 2025, J16015): the big leg share sits near one half (median 0.615,
  0.712, 0.608 on 8 Mar; 0.392, 0.354, 0.431 on 24 Sep) and moves with the day, not with a fixed size. Early in the UTC day the medians
  stand on 1 or 2 legs (at X 1, 43 percent of coins have fewer than 3 legs at 12:00 of 8 Mar). At X 1 the minutes since a higher low
  are empty NO_SWING at 52.1 percent of 8 Mar's coin-minutes.

conclude:
  may:
    - "the running leg against the coin's legs completed today, its pullback against their typical recovered pullback, and the time since the last higher low or lower high, as the card's rules 10 to 13 define them (J16004)"
    - "the market's share of coins in a leg bigger than their own median leg of today, and the middle coin's ratios (rule 16)"
  never:
    - "S45, S50, S55 over 0.5 as the market in unusually big legs: 'big' is over each coin's median leg of today (O4 A), which about half the legs are at their end (56.7 to 60.1 percent, 8 Mar 2026; 41.2 to 47.2, 24 Sep 2025; J16015); over 0.5 at 63.1, 70.1, 59.1 percent of 8 Mar's minutes"
    - "an M11 value early in the UTC day as the day's typical: the medians stand on 1 or 2 legs (fewer than 3 legs at 00:00 for 76, 97 and 100 percent of coins at X 0.25, 0.5, 1; at X 1 still 43 percent at 12:00, 8 Mar 2026; J16015)"
    - "S13, S27, S41 empty as 'no higher low for a long time': NO_SWING means none among the last 8 swings (at X 1 52.1 percent of 8 Mar 2026's coin-minutes, 39,043 of 74,880)"
    - "the record's m6x<X>_m6x<X>_m11_mkt_* names of S08 to S14, S22 to S28, S36 to S42 as the market: they are BTC's values; the market is S45 to S47, S50 to S52, S55 to S57 (CARD_C10_V4 part 1)"
    - "a leg rel size or pullback rel across coins as one scale: each is the coin against its own day"


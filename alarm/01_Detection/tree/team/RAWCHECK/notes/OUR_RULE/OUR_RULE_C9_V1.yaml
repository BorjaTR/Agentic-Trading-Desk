  fields:
    dial: "the median (exact) of the 120-minute width pct over the roster coins with one at e; width dials = the coin's exact width pct / the dial, rounded once to 12 decimals; NO_DIAL when no coin has a 120-minute width or the dial is 0 [proof: CARD_C9_V4 rule 6, O2 A; RULE_C9_STAMPS_V1; planted R, N2, N7, E210 and 'the dial at every W' in tests/test_rule_c9.py]"
    touches: "runs of consecutive window minutes (60 s apart; a skipped minute ends a run) whose high is at or above high - 0.10 x (high - low), or whose low is at or below low + 0.10 x (high - low) [proof: CARD_C9_V4 rule 7; planted N3, E203, E204, E206, E207]"
    market: "the median of the coins' exact width dials, rounded once; the share of the coins with a width dials value whose width dials is under 1 (1 is not under) [proof: CARD_C9_V4 rule 12; planted E210]"
  latency: "known_at = the latest known_at of the C13 rows read, and of the dial's coins for the width dials (CARD_C9_V4 rule 11)"
  silence: "a coin is empty with C13's reason when C13's close at e is empty (24 Sep 2025: 105 coin-minutes, J15995 c9fire 'empty 105'); OPEN: rule_c9 compares values only, so an empty against an empty is a MATCH without its reason: C13's reason and NO_DIAL are not proven by J15995 (BED's review 16:18:17Z nit 3)"

reading_rules:
  - "the dial is the median coin's 120-minute width at e: a cross-section, so a coin's width dials says how it compares with the median coin now, not with the market's usual"
  - "S23 is at most 1, S26 is 1, S29 is at least 1, S27 is the share under the median, by construction (24 Sep 2025, J15995 c9fire)"
  - "a touch is a run of minutes in the band, each run counted once; the edge minute itself is one"
  - "a window with C13 minutes missing reads the minutes it has (BASIC_C9_V1: SHORT_WINDOW); a skipped minute ends a touch run"

values:
  units: "S02, S09, S16, S23, S26, S29: a ratio (width pct over the dial); S24, S27, S30: a share 0 to 1; S04, S05, S11, S12, S18, S19: a count (1 or more)"
  zero: "width dials 0: the coin had one price over W; a tight share of 0: no coin under 1"
  empty: "NO_ROSTER, NO_FILE, TRADES_HOLE, THIN_FEED, BAD_INPUT (C13's), NO_DIAL (no dial or a dial of 0), ALL_COINS_EMPTY (market); value_kind 0. Never read empty as 0"
  stale: "true when empty because a feed went quiet or thin (C13's TRADES_HOLE, THIN_FEED)"
  flags: "SHORT_WINDOW:<coin>, DUPLICATE_ROW, NO_RATE_BASE, BAD_INPUT (CARD_C9_V4 rules 10, 13)"

interpret:
  do:
    - "read width dials as a coin against the median coin of the same minute; for BTC read it as BTC's calm against the median coin"
    - "read S23 against its own day (0.341971 to 0.993451 on 24 Sep 2025), never against 1"
  dont:
    - "read S26 or S27"
    - "read a touch count of 1 as no test of the edge"


group: C9
name: range register, our rules (the width in market dials, the edge touches, the market's median dials and tight share)
summary: >-
  For each roster coin at a minute end e over the last W minutes (W = 60, 120, 240; the window of BASIC_C9_V1): the width in dials, the coin's
  width pct over the DIAL, the median 120-minute width pct of the roster's coins at e (S02, S09, S16); the touches, the runs of consecutive
  minutes whose high reaches the top tenth of the window's width (S04, S11, S18) or whose low reaches its bottom tenth (S05, S12, S19); and for
  the market the median of the coins' width dials (S23, S26, S29) and the share of coins whose width dials is under 1 (S24, S27, S30).
read_as: >-
  The dial is the median coin's 2-hour width NOW, a cross-section at e, not the market's usual 2 hours over time. So the market dials are
  bounded by construction: S26 (the median of the 120-minute width dials) is 1 at every minute and S27 (the share under it) 0.47 to 0.50; S23
  is at most 1 and S30 at most about 0.5 (a 60-minute width is under, a 240-minute one over the coin's own 120-minute width), S29 at least 1
  (24 Sep 2025: S26 1 at 1,440 of 1,440 minutes; S23 max 0.993451; S29 min 1.000000; J15995 c9fire). A coin's width dials compares it with
  the median coin: BTC, calmer than the median coin, has S16 under 1 at 95.28% of 24 Sep's minutes, so the card's reading 'under 1: chop
  territory' says chop for BTC nearly always. The touches count at least 1 by construction (the edge minute itself); both edges touched twice
  or more at 26.83% (60 min) to 44.76% (240 min) of coin-minutes, not a rare 'range the market respects'. Every value equals our recompute at
  the named moments (RULE_C9_STAMPS_V1, J15995).

conclude:
  may:
    - "how wide a coin's last 60, 120, 240 minutes were against the median roster coin's 2-hour width at that minute (S02, S09, S16: 2 = twice the median coin's 2-hour width; RULE_C9_STAMPS_V1, J15995)"
    - "how many separate times the coin's minutes reached the top or bottom tenth of the window's width (S04, S05, S11, S12, S18, S19: 1 or more)"
    - "where the median coin's 60 and 240-minute width sits against the median 2-hour width (S23 at most 1, S29 at least 1: 0.341971 to 0.993451 and 1.000000 to 3.908102 on 24 Sep 2025, J15995 c9fire), and the share of coins under it (S24, S30)"
  never:
    - "S26 or S27 as information: S26 is 1 and S27 the share under the median (0.470588 to 0.500000) at every minute, by construction (24 Sep 2025, J15995 c9fire)"
    - "width dials under 1 as a calm market or as chop: the dial is the median coin now, not the market's usual; BTC's S16 is under 1 at 95.28% and its S02, S09 at 100% of 24 Sep 2025's minutes; every coin's S02 at 77.20% (J15995 c9fire)"
    - "S23 or S29 against a threshold of 1 as if it could cross: S23 is at most 1 and S29 at least 1 by construction"
    - "a touch count of 1 as an untested range: the edge minute is itself a touch (at least 1 at every coin-minute, J15995 c9fire)"
    - "both edges touched twice or more as rare: 26.83%, 36.22%, 44.76% of coin-minutes at 60, 120, 240 minutes (24 Sep 2025, J15995 c9fire)"


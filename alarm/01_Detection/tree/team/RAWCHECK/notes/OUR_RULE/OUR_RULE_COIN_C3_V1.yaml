# OUR_RULE_COIN_C3_V1.yaml: the card of COIN_C3's OUR RULES (each coin's excess over BTC and over the roster's median, in its own 2-hour
# dials), EDITION 1, edit 3 (EDGE2, 2026-10-18; edit 3 = BED's review 16:50:05Z optional nit, the median of S17 to S20 by construction; edits c5f9debb, 8dda61ce kept as twins; OR3 of OUR_RULES_REVIEW_WORKPACKAGES_V1 6c2fdf72b7646f86). Made as OUR_RULE_C5_V1 638b08cf;
# meaning_register checks it. Register of the day: LAYER_REGISTER_V32 e249ce941c5cdb16 (COIN_C3 S13 to S20 our_rule, NOT_CHECKED before this
# card; COIN_C1 S01, their divisor, layer model, NOT_CHECKED). EDGE1 16:12:07Z ruled (A): COIN_C1 S01 recomputed in the same small module,
# S13 to S20 judged on it, COIN_C1 S01's meaning left with the models. The smart check: inputs cited, planted tests and mutants first, ONE
# small job J16007 (5 named minutes and the first 2 minutes where each setting reaches 1 or -1 and the dial 0, of 8 Mar 2026 and 24 Sep
# 2025, every roster coin; how often on the year's own rows of 24 Sep 2025), readers to TREE's RR1.
# Pass lines: hb/EDGE2.txt 2026-10-18T16:34:10Z, posted before J16007 ran; results 2026-10-18T16:4xZ.

group: COIN_C3
name: coin strength against the market, our rules (the excess over BTC and over the roster's median in the coin's own 2-hour dials)
summary: >-
  For each roster coin and h = 5, 15, 60, 240 minutes: S13 to S16 its h-minute return less BTC's (COIN_C3 S05 to S08), S17 to S20 less the
  roster's median return (S09 to S12), each divided by the coin's own 2-hour dial (COIN_C1 S01: 100 x the range of its last 120 minute closes
  over its close at e, as published to 6 decimals), rounded once. 1 = the coin moved one of its normal 2-hour ranges beyond the market.
read_as: >-
  Every value equals our recompute, the dial recomputed too, at the named and the firing minutes of both days (RULE_COINC3_STAMPS_V1, J16007).
  Over 5 to 60 minutes a coin almost never moves one of its 2-hour ranges beyond the market: |x| 1 or more at 0.00% to 0.80% of 24 Sep
  2025's coin-minutes; over 240 minutes at 16.62% (against BTC) and 10.67% (against the median). The dial narrows the differences between
  coins (each coin's p90 of |x| differs 14.96 times in points, 2.40 in dials, at 240 minutes against BTC; 23.58 and 7.31 against the median)
  but does not make 1 the same move on every coin (J16007 coinc3fire).

conclude:
  may:
    - "how many of its own 2-hour ranges a coin moved beyond BTC (S13 to S16) or the roster's median (S17 to S20) over 5, 15, 60, 240 minutes (RULE_COINC3_STAMPS_V1, J16007)"
  never:
    - "a 5 to 60 minute excess of 1 or more as a usual move: 0.00% to 0.80% of coin-minutes (24 Sep 2025, J16007 coinc3fire)"
    - "a value of 1 as the same move on every coin: each coin's p90 of |x| still differs 2.40 and 7.31 times between coins at 240 minutes (J16007)"


  settings_register: "testbed/value_audit/code/L0_y52f12/value_audit/registers/SETTINGS_COIN_C3_V1.tsv dd7da09c2cb5033a (the dial in SETTINGS_COIN_C1_V1.tsv fb358e48f420e53a)"

  producer: "testbed/value_audit/code (COIN_C3's producer of CARD_COIN_C3_V6), reading C13's and COIN_C1's built parts of D"
  year_output: <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/COIN_C3.parquet
  year_output_columns: "name (S01 to S22 and their twins), coin (every roster coin), as_of_us (the 1,440 minute ends), value_kind (0 = EMPTY), value_f64, value_txt, known_at_us, stale, empty_reason, flags"
  read_it_with: "team/RAWCHECK/code/rawcheck/meaning_candle.py ours(D, names, group='COIN_C3') (value_kind 0 empty, else value_f64)"

source:
  vendor: "Tardis.dev, Binance USD-M futures book_ticker, through our C13 S05 closes (MEANING_C13_V4)"
  exchange_stream: "bookTicker as Tardis records it, read by C13"
  files: "the year's C13.parquet of D and D-1 (the 240-minute horizon and the dial reach D-1 before 04:00), COIN_C1.parquet and COIN_C3.parquet of D, the week's roster"
  columns: "C13 S05 of every roster coin; COIN_C1 S01; COIN_C3 S13 to S20"
  fields:
    dial: "COIN_C1 S01 = 100 x (the largest - the smallest valued close of the 120 minute ends e - 119 min to e) / the close at e, exact, 6 decimals, half up; the close at e empty: empty; under 60 valued closes: SHORT_WINDOW; a range of 0 gives 0 [proof: CARD_COIN_C1_V6 rules 1 to 5, 10; planted N2 to N6b, E2 to E20 in tests/test_rule_coinc3.py; RULE_COINC3_STAMPS_V1 COIN_C1 S01 2,731 of 2,731]"
    in_dials: "S13 to S20 = the excess (COIN_C3 rules 2 to 6, exact, unrounded) over the dial as published; ZERO_RANGE when the dial is 0; BTC's own row against BTC is 0 [proof: CARD_COIN_C3_V6 rule 7; planted E9 to E22 and the two rule 7 cases, mutants B1, B2; RULE_COINC3_STAMPS_V1]"
  latency: "known_at = the latest known_at among the closes read and the dial's (CARD_COIN_C3_V6 rule 9)"
  silence: "the excess's reason first (NO_FILE, BOOK_HOLE, THIN_ROSTER, NO_BTC), then the dial's (SHORT_WINDOW, ZERO_RANGE); none at the points checked but the dial's 0 (ZERO_RANGE: CRV at 01:22, 01:23, 01:31, 01:32 of 8 Mar 2026, 32 coin-setting rows, empty both sides, J16007 RULE_COINC3_ROWS)"

reading_rules:
  - "the divisor is the coin's own 2-hour range at e, published to 6 decimals: a quiet coin's small dial makes a large value"
  - "S13 to S16 against BTC, S17 to S20 against the median of the roster but BTC"
  - "S17 to S20 pooled over coin-minutes have a median of 0 by construction: each minute half the coins are above the roster's median and half below (0.000000 on 24 Sep 2025, J16007 log lines 93 to 96; BED's review 16:50:05Z)"

values:
  units: "dials: the excess (percent points) over the coin's 2-hour range (percent of its price)"
  zero: "0: the coin moved as BTC (or the median coin) did over h minutes; BTC against BTC is 0"
  empty: "the excess's reason or the dial's (SHORT_WINDOW, ZERO_RANGE); value_kind 0. Never read empty as 0"
  stale: "as the closes read (BOOK_HOLE)"
  flags: "none of their own"

interpret:
  do:
    - "read 1 as 'one of its own 2-hour ranges beyond the market', and compare horizons: 240 minutes reaches it about 1 time in 6 (against BTC), 5 to 60 minutes almost never"
  dont:
    - "compare a value across coins as the same size of move without the coin's dial beside it"

biases:
  - {what: "a 2-hour range as the unit for every horizon", direction: "short horizons rarely reach 1, 240 minutes often", size: "|x| 1 or more 0.00% (5 min) to 16.62% (240 min, against BTC) of coin-minutes", proof: "J16007 coinc3fire, 24 Sep 2025"}
  - {what: "one coin's own range as the unit", direction: "coins still differ in how far their excess runs in dials", size: "each coin's p90 of |x| differs 2.40 and 7.31 times between coins at 240 minutes", proof: "J16007 coinc3fire"}


group: COIN_C2
name: coin wave, our rules (the coin's own liquidation wave clock on its own floor, and its open interest change since the wave began)
summary: >-
  For each roster coin at each minute end m, per side (long liquidations S01 to S07, short S08 to S14): the coin's liquidation dollars of
  the minute (S01, S08: A1's S08, S09 passed through); a wave minute is a minute whose dollars are at or over the coin's own floor, the
  third quartile of its non-zero minute dollars of that side over the 14 UTC days before (LEVELS edition 4's cut 3, at least 100 non-zero
  minutes); wave now (S02, S09), minutes since the last wave minute in m - 14 to m (S03, S10), wave minutes in that window (S04, S11),
  minutes since the wave began (S05, S12), the open interest change since the minute before the wave began as a share (S06, S13) and, in
  contracts valued at m's close, in dollars (S07, S14, renamed).
read_as: >-
  The floor is the coin's own top quarter of its liquidation minutes, so a wave minute is the coin's own scale, not a market-size flush:
  on 8 Mar 2026 the long floors run from 507.5 to 24,306 dollars (median 2,119.5), the median long wave minute is 6,664 dollars and 445 of
  730 are under 10,000 dollars. It is rare: long wave minutes are 0.975% of the judged coin-minutes and a long wave runs at 9.73% of them
  (short 0.381% and 4.42%; J16000). The open interest change while a wave runs is fractions of a percent (long p10 -0.004251, median
  -0.000302, p90 0.002317). Empty NOT_FILLED in the year's first two weeks (the 14 days must lie from 29 Sep 2025 on: 24 Sep 2025 is
  NOT_FILLED for 51 of 51 coins), FEW_VALUES for a coin with under 100 non-zero minutes (3 coins short on 8 Mar). Every value equals our
  recompute from the year's own inputs at every coin-minute of both days (RULE_COIN_C2_STAMPS_V1, J16000).

conclude:
  may:
    - "whether this coin's liquidations of the minute reached its own top quarter of the last 14 days (S02, S09: 1 or 0; 0.975% of long and 0.381% of short judged coin-minutes on 8 Mar 2026, J16000)"
    - "how recent and how dense the coin's own wave is: minutes since its last wave minute (0 to 14), wave minutes in the last 15, minutes since its wave began (S03 to S05, S10 to S12)"
    - "how the coin's open interest in contracts moved since the minute before its wave began, as a share (S06, S13) and valued at this minute's close (S07, S14)"
  never:
    - "a wave minute as a large flush in dollars: the floor is the coin's own top quarter, 507.5 to 24,306 dollars long on 8 Mar 2026; 445 of 730 long wave minutes are under 10,000 dollars and 4 under 1,000 (J16000)"
    - "S07 or S14 as the change of the dollar open interest: they are the change in contracts valued at this minute's close; the price move since the wave began is left out (CARD_COIN_C2_V8 rule 15); renamed, could_build COIN_C2.CB1"
    - "S06 or S13 against a large threshold: while a long wave runs the share is p10 -0.004251, median -0.000302, p90 0.002317 (8 Mar 2026, J16000): the card's 'very negative: much of the coin's open interest has left' (CARD_COIN_C2_V8 line 46) is a fraction of a percent here"
    - "empty as 0: NOT_FILLED in the year's first two weeks (24 Sep 2025 all day), FEW_VALUES for a coin without 100 non-zero minutes; never read as a quiet coin"
    - "a coin's wave against another coin's in dollars: each coin has its own floor"


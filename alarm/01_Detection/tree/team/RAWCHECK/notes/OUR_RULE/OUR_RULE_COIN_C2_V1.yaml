  columns: "A1 S08, S09 whole dollars of the minute; E2 S02 open interest in contracts (decimal text); C13 S01 close (decimal text); each with empty_reason"
  fields:
    floor: "the third quartile, linear between ranks, of the coin's non-zero A1 values of the side at the 1,440 minute ends of each of the 14 UTC days before d; FEW_VALUES under 100; NOT_FILLED when a day of the 14 is before 29 Sep 2025; a minute of D-1 judged with D-1's floor [proof: CARD_COIN_C2_V8 rule 3, CARD_LEVELS_V1 rules 1 to 9; planted LV.N8, LV.N9, LV.E4, LV.E35, LV.E36, N4c, N4d in tests/test_rule_coin_c2.py; J16000: every wave decision equal on 8 Mar 2026, DOGE 02:51 at 0.998590 and HBAR 04:26 at 1.002904 of their floors]"
    wave: "a wave minute: dollars at or over the floor; the window m - 14 to m; a wave begins at a wave minute with none in the 14 before; NO_HISTORY when that beginning lies in 00:00 to 00:13 of D-1 [proof: CARD_COIN_C2_V8 rules 4 to 12; planted N3a to N3e, E2 to E7, E10 to E18, N6, R11; RULE_COIN_C2_STAMPS_V1]"
    oi_change: "S06 = (OI(m) - OI(w0 - 1)) / OI(w0 - 1), 6 decimals, a tie away from 0; S07 = (OI(m) - OI(w0 - 1)) x close(m), whole dollars, a tie away from 0; ZERO_BASE for S06 when OI(w0 - 1) is 0 [proof: CARD_COIN_C2_V8 rules 13 to 15; planted N4b, E4, E19 to E23, N1f to N1l]"
  latency: "known_at = the latest known_at of the input rows read (CARD_COIN_C2_V8 rule 16); not a year column, not checked here"
  silence: "a value is empty with A1's reason at m first, then the floor's (24 Sep 2025: TRADES_HOLE 80 and THIN_FEED 445 coin-minute-settings per side, DASH 03:09 and 03:10, J16000)"

reading_rules:
  - "the floor is per coin, per side and per day: a wave minute is the coin's own top quarter, not a dollar size"
  - "the wave is remembered 14 minutes: S03 runs 0 to 14, then NO_WAVE"
  - "S06, S13 are shares of contracts; S07, S14 are the contract change valued at this minute's close, not the change of the dollar open interest"
  - "a minute not judged (A1 empty, no floor) counts as no wave minute inside the window; the value at m is empty with A1's reason first, then the floor's"


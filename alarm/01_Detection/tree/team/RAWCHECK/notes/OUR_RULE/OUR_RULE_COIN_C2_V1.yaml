  zero: "S01 0: no liquidation of that side in the minute; S02 0: the minute under the floor; S06 0: the open interest unchanged since the wave began"
  empty: "NO_ROSTER, NO_FILE, TRADES_HOLE, THIN_FEED, BAD_INPUT (A1's, C13's), NO_VALUE, STALE_VALUE, ZERO_BASE (E2's), FEW_VALUES, NOT_FILLED (the floor's), NO_WAVE, NO_HISTORY; value_kind 0. Never read empty as 0"
  stale: "true when empty because an input went quiet or thin (A1's or C13's TRADES_HOLE, THIN_FEED; E2's STALE_VALUE); not a year column"
  flags: "USDC_MISSING, DUPLICATE_ROW, NO_RATE_BASE (the inputs', CARD_COIN_C2_V8 rule 17); not a year column"


group: D2
name: top of the book, our rule S05 (the median coin's spread as a robust z against its last 24 hours)
summary: >-
  At a minute end e: z = (x - med) / (1.4826 x MAD), x = the exact D2 S04 at e (the median roster coin's spread, bps), the history = the
  exact S04 at every minute end after e - 24 h and before e that has a value, med its median, MAD the median of the distances to med; 4
  decimals, half up, never -0. Empty with x's reason, THIN_HISTORY under 720 values, FLAT_HISTORY when MAD is 0 (CARD_D2_V3 rule 12).
read_as: >-
  The formula is the standard robust (modified) z, and the year writes it exactly (18 of 18 named minute ends, RULE_D2_STAMPS_V1, J16001).
  But its input barely moves: the coins' spreads are one price step at 98.94% and 97.03% of coin-minutes (BASIC_D2_V1), so the MAD of the
  median spread is 0.7054% (24 Sep 2025) and 1.4340% (8 Mar 2026) of its median over the day (0.7931% and 1.3196% at the 3 and 50 minutes
  with z 3 to 3.5), and at those minutes the median spread is only 3.575% and 6.373% over its 24 h median (J16003). S05 is 3 or more at 21.94% and 6.74% of minutes, 1 or more at 23.96% and 42.29%: a 3 is common, not a 3-sigma
  event. This is what keeps D5's latch on (OUR_RULE_D5_V1). On a one-step book the median spread in bps is that coin's step over its price,
  so a few percent can come from the price level or from another coin becoming the median, not from a wider book (not separated here).

conclude:
  may:
    - "how far the median coin's spread now sits from its own last 24 hours, in robust units (S05: the year's value equals our exact recompute at 18 of 18 named minute ends of 8 Mar 2026 and 24 Sep 2025; RULE_D2_STAMPS_V1, J16001)"
    - "a large S05 at a real widening: 70.8287 at 22:04 of 8 Mar 2026 (the median spread 4.7511 bps), 167.7976 at 13:44 of 24 Sep 2025 (2.0578 bps against about 0.82) (J16001)"
  never:
    - "S05 of 3 or more as a rare wide spread: 21.94% (24 Sep 2025) and 6.74% (8 Mar 2026) of minutes; at z 3 to 3.5 (3 and 50 minutes) the median spread is only 3.575% and 6.373% over its 24 h median, the MAD 0.7931% and 1.3196% of the median there (0.7054% and 1.4340% over the day) (J16003)"
    - "S05 as the book getting wider: the coins' spreads are one price step at 97 to 99% of coin-minutes (BASIC_D2_V1), so a few percent in bps can be the step over a lower price or another median coin"


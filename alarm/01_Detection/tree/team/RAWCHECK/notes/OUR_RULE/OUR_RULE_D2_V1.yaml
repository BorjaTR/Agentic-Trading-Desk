  silence: "x empty: S05 empty with x's reason (BOOK_HOLE, stale); none on 8 Mar 2026 and 24 Sep 2025 (J16001: empty 0)"

reading_rules:
  - "S05 compares the median coin's spread with its own last 24 hours: a cross-time z of one number, not of every coin"
  - "the MAD of a one-step spread is about 1% of the median, so 1.4826 x MAD is about 1 to 2% of the spread: S05 counts percents of a step"
  - "the year also writes S05.coverage (the coins in S04's median at e) and S05.quotes_off (the same rule on the quotes stream's S04): not checked in this card (the owner's copies rule, BASIC_C1_V5)"

values:
  units: "a robust z, no unit (positive = the median spread wider than its 24 h median)"
  zero: "0.0000: the median spread equals its 24 h median (24 Sep 2025 03:00, J16001)"
  empty: "BOOK_HOLE, NO_FILE, BAD_INPUT, ALL_COINS_EMPTY (S04's reasons), THIN_HISTORY, FLAT_HISTORY, NO_ROSTER; value_kind 0. Never read empty as 0"
  stale: "true when empty BOOK_HOLE (CARD_D2_V3 rule 13)"
  flags: "S04's (BAD_INPUT:<coin>)"


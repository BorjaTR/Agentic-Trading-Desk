source:
  vendor: "Tardis.dev, Binance USD-M futures book_ticker: BTC's mids through BED's book base MID_1S (S03, S04), every roster coin's mid through our C13 S05 (S08); the year's own C6 and C7 rows (S11, S12)"
  exchange_stream: "bookTicker as Tardis records it"
  files: "BOOK_BASE_<D-1>, BOOK_BASE_<D>/BTC.parquet; the year's C13.parquet of D-2, D-1, D; C6.parquet and C7.parquet of D-62 to D-1; the week's roster file"
  columns: "MID_1S value_txt, why; C13 S05 of every roster coin; C6 S07 and C7 S07 of the coin MARKET"
  fields:
    robust_z: "S03 = (a_0 - med) / (1.4826 x MAD) of a_k = accel(e - 60 k s), k = 0 to 360, doubles; S04 = ((x_0 - med) / MAD, exact, to its nearest double) / 1.4826 of x_k = mid(e - 60 k s); NO_MOVE when MAD is 0 or a vel is [proof: CARD_C6_V5 rules 5, 6; planted E28, E60, E64 (the card's -65.4964 and 1.341487), E72, E4, E38 in tests/test_rule_c6.py; RULE_C6_STAMPS_V1]"
    persist: "at each minute end a coin is ranked when its mid is known then and 24 h before; the top and bottom tenth are floor(n / 10) coins, a tie in the roster's order; S08 = the longest stay of any coin over 60, at most 1,440 minute ends [proof: CARD_C6_V5 rules 11, 12; planted E21, E81 to E85, E87, a coin from the top to the bottom; RULE_C6_STAMPS_V1 and 1,440 of 1,440 a day]"
    floors: "S09 0.9, S10 0.1 at every minute end; S11, S12 the k-th highest of the 62 days' non-empty values, k = ceil(n / 10), NO_HISTORY when a window day is not built [proof: CARD_C6_V5 rules 19 to 21; planted E100, E103 to E118]"
  latency: "S03, S04: the latest arrival among the samples' rows (rule 14); S08: the latest arrival of the ranked coins' rows at e; S11, S12: the latest known_at of the values counted (rule 21f)"
  silence: "S03, S04 empty TOP_HOLE (NO_FILE first) when a second of the window is not known; S08 FEW_COINS under 10 ranked coins; none at the points checked (J16006)"

reading_rules:
  - "S03, S04 are z scores of a path: their samples overlap, so their tails are heavy; read their own fifths, not a normal law's"
  - "S08 belongs to the market: the coin that sets it is any roster coin, not the coin read"
  - "S11, S12 change once a day; empty in the year's first 62 days"

values:
  units: "S03, S04: robust standard deviations; S08: hours, 0 to 24; S09, S10: a position 0 to 1; S11 heat (a ratio), S12 percent of price"
  zero: "S03, S04 0: at the 6 hours' median; S08 0 never (a coin in a tenth has a stay of at least 1 minute end)"
  empty: "NO_MOVE, TOP_HOLE, NO_FILE (S03, S04); FEW_COINS, NO_ROSTER (S08); NO_HISTORY, NO_VALUES (S11, S12); value_kind 0. Never read empty as 0"
  stale: "S03, S04 when TOP_HOLE (rule 1); the floors never"
  flags: "BAD_ROW:BTC on S03, S04 when a bad row was skipped (rule 15)"

interpret:
  do:
    - "read S04 at 3 or more as BTC's mid well above its 6 hours' middle, a state of about one minute in ten (J16006)"
    - "read S08 at 24 as 'some coin has led or lagged the roster all day'"
  dont:
    - "compare S03, S04 with a normal law's tail"
    - "read S08 as the persistence of the coin a chain fires on"

biases:
  - {what: "the z of a path (361 overlapping samples)", direction: "|z| 2 or more far more often than a normal law", size: "S04 25.76% and 24.44%, S03 8.26% and 10.83% of minutes (4.55% normal)", proof: "J16006 c6fire"}
  - {what: "a maximum over the roster", direction: "S08 near its cap whenever one coin trends for a day", size: "24 at 100% of 24 Sep 2025's minutes; 6 to 24 h at 91.32% of 8 Mar 2026's", proof: "J16006 c6fire"}


# OUR_RULE_C6_V1.yaml: the card of C6's OUR RULES (BTC's robust z of accel and of the mid, the longest stay at an extreme, the label
# floors), EDITION 1, edit 2 (EDGE2, 2026-10-18; edit 2 = BED's review 16:50:05Z nit, '|z|' in read_as; edit 1 b4e8e994 kept as a twin; OR3 of OUR_RULES_REVIEW_WORKPACKAGES_V1 6c2fdf72b7646f86). Made as OUR_RULE_C5_V1 638b08cf;
# meaning_register checks it. Register of the day: LAYER_REGISTER_V32 e249ce941c5cdb16 (C6 S03, S04, S08 to S12 our_rule, NOT_CHECKED before
# this card). The smart check: inputs cited, planted tests and mutants first, ONE small job J16006 (the computation at 6 named minutes and at
# the first 2 minutes where S03, S04 reach 2 or -2 and S08 24 or under 1, of 8 Mar 2026 and 24 Sep 2025; S08 to S12 at every minute end;
# how often each fires on the year's own rows of both days), readers to TREE's RR1.
# Pass lines: hb/EDGE2.txt 2026-10-18T16:34:10Z, posted before J16006 ran; results 2026-10-18T16:4xZ.

group: C6
name: market motion, our rules (BTC's accel_z and stretch_z, persist_h, the label floors pos_top, pos_bottom, hot_heat, hot_dial_2h)
summary: >-
  S03 accel_z and S04 stretch_z are robust z scores of BTC: accel (S02's rule) and the mid now against their own 361 samples 60 s apart over
  the last 6 hours, (now less the median) over 1.4826 x the median absolute deviation. S08 persist_h is the longest stay, in hours (at most
  24), of any roster coin among the top or the bottom tenth of the coins ranked by their 24 h return. S09 0.9 and S10 0.1 are RULED floors of
  the STRETCH labels. S11 hot_heat and S12 hot_dial_2h are TOP 10 percent floors: the k-th highest (k = ceil(n / 10)) of C6 S07 heat and of
  C7 S07 dial_2h at the minute ends of the 62 days before D, empty in the year's first 62 days.
read_as: >-
  Every value equals our recompute at the named and the firing minutes, and S08 to S12 at every minute end of both days (RULE_C6_STAMPS_V1,
  J16006). The z scores are not rare at 2: BTC's S04 was 2 or more, or -2 or less, at 25.76% (8 Mar 2026) and 24.44% (24 Sep 2025) of
  minutes and |z| 3 or more at 10.07% and 10.97%, S03 at |z| 2 or more at 8.26% and 10.83%, where a normal law gives 4.55% and 0.27%: the 361 samples are a path,
  not draws. S08 is a maximum over 51 to 52 coins: 24 at every minute of 24 Sep 2025 (WLFI, then ASTER), never under 4.02 h on 8 Mar 2026.
  S11 on 8 Mar 2026 is 0.506223 and D's heat was at or above it at 12.15% of minutes; S12 3.114847 and D's dial_2h at 2.64% (J16006 c6fire).

conclude:
  may:
    - "how far BTC's accel (S03) or mid (S04) now is from its last 6 hours, in robust standard deviations (RULE_C6_STAMPS_V1, J16006)"
    - "how long the most pinned roster coin has stayed among the top or the bottom tenth by 24 h return (S08, hours, at most 24)"
    - "the floors the labels compare raw values with: 0.9 and 0.1 (RULED), the 62 days' top tenth of heat and of dial_2h (S11, S12)"
  never:
    - "S04 (or S03) at 2 as unusually high (CARD_C6_V5 line 18): S04 at |z| 2 or more at 25.76% and 24.44% of minutes, S03 at 8.26% and 10.83% (J16006 c6fire)"
    - "S08 as the fired coin's own stay: it is the longest stay of any roster coin (WLFI, ASTER at the cap all of 24 Sep 2025; RULE_C6_ROWS of J16006)"
    - "S08 under 1 hour as common: 0 of 2,880 minutes on the two days (J16006 c6fire)"
    - "S11, S12 as fixed numbers: each is re-measured on the 62 days before D, and empty in the year's first 62 days (NO_HISTORY at every minute of 24 Sep 2025)"


  empty: "the count's reasons, SHORT_HISTORY, FLAT_BASE, NO_ROSTER; value_kind 0. Never read empty as 0"
  stale: "the count's at e; SHORT_HISTORY and FLAT_BASE never stale"
  flags: "the count's at e (USDC_MISSING, DUPLICATE_ROW, NO_RATE_BASE, BAD_INPUT)"


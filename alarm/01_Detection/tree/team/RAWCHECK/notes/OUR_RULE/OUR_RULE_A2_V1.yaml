group: A2
name: liquidation breadth, our rules (S03, S04 the count of coins with long, short liquidations in 30 s as a z against the last 6 hours)
summary: >-
  At e (every 30 s mark): z = (n x c - S1) / sqrt(n x S2 - S1 x S1), n = 360, c = the count at e (A2 S01 long, S02 short), S1, S2 the sum and
  the sum of squares of the counts at the 360 minute ends in [e - 21,600 s, e), e left out; whole numbers exactly, then one double division,
  written unrounded. Empty: the count's reason; SHORT_HISTORY when a baseline count is empty; FLAT_BASE when every baseline count is equal
  (CARD_A2_V6 rules 10 to 13, 15).
read_as: >-
  The year writes both exactly: 11,520 of 11,520 values (every 30 s mark of 8 Mar 2026 and 24 Sep 2025, S03 and S04) replayed from its own
  counts, as doubles equal to the last bit (RULE_A2_STAMPS_V1, J16010). The counts are 0 most of the time (S01 at 72.47% and 54.20% of marks,
  S02 at 78.33% and 55.66%), so the z has a floor at the empty level, -0.2186 to -0.4958 at the marks printed. By construction, at a count of 0 the z is
  -mean/sd of the baseline, at least -sqrt((1 - p0) / p0) with p0 the baseline's share of zero counts (Cauchy-Schwarz), so it cannot go
  below -1 while p0 is 0.5 or more (the day's zero share 54.20% to 78.33%, near the edge on 24 Sep); they are 2 or more at 3.06% to 4.58% of marks and 3 or more at 2.22% to 3.30%. A z of a mostly-zero count: its low fifths say
  'nothing liquidated', not 'fewer than usual'.

conclude:
  may:
    - "how many more roster coins had long (short) liquidations in the last 30 s than over the last 6 hours, in standard units (S03, S04: the year's value equals our replay at 11,520 of 11,520 marks; RULE_A2_STAMPS_V1, J16010)"
  never:
    - "S03, S04 below 0 as fewer liquidations than usual: the counts are 0 at 54 to 78% of marks, and the z cannot go below -1 while the baseline's zero share is 0.5 or more (by construction; J16010)"
    - "S03, S04 of 2 or more as rare: 3.06% to 4.58% of marks (J16010)"


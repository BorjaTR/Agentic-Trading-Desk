  - "the baseline is the 6 hours of minute ends before e, e left out; a 30 s mark reads the same minute-end series"
  - "the year also writes the variants .e_inside_off, .flat0_off, .n1_off, .own_roster_off, .w60_off and the coverage: not checked in this card"


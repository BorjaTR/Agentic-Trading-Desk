  BASIC: team/RAWCHECK/notes/BASIC/BASIC_C2_V3.yaml 23e187d3297bb9a2 (the basic settings of C2)
  STAMPS: "team/RAWCHECK/notes/RAWCHECK/C2_STAMPS_V1.tsv 8eceeedbb4fda108"
  JOBS: "15999 (c2fire 24 Sep 2025; log af3a5cac5c0546aa)"
  PASS_LINES: "hb/EDGE2.txt 2026-10-18T16:08Z, posted before J15999 ran"

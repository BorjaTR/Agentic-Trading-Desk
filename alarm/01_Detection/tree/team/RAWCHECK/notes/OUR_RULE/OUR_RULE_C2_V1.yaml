     meaning: {status: DEFINED_WITH_OPEN, proof: "J15999 c2fire (24 Sep 2025): min 0.04, median 0.80, p90 0.88, max 0.96; at 0.85 or more at 23.89% of minutes, where BTC's own 1 h move was under 0.5 points at 99.42% (|median| 0.1002); Spearman with BTC's |1 h move| -0.40387; the share rule 8 says (no rename)"},
     open: "high in quiet hours: the label WHY-SCOPE/BTC-LED reads 0.85 or more as BTC-led; one day measured",

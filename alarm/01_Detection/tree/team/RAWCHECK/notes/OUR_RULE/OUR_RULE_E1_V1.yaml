# Edit 3 (BED, 18 Oct 2026, before landing; EDGE1 RULING 3 17:11:43Z: RENAME): S07 is renamed (renamed_from funding_z) and could_build E1.CB1
# (the robust z with the MAD's spread) added. J16022 (rule_e1 ed3 0721656c, log 38ece378f472e875) counted the spread's term with the MAD at
# exactly 0 apart: MEANAD at 1,440 of 1,440 minute ends of both days, MEANAD_MAD0 at none: the MAD is above 0, the MeanAD term is larger. The
# rename rests on the formula (the spread is not 1.4826 MAD), not on a MAD of 0. S08 keeps funding_persist_h (it counts hours). No value changed.
group: E1
name: funding, our rules (S07 the market's funding deviation from its 504-hour median in units of max(1.4826 MAD, 1.2533 MeanAD); S08 the run of hours at 2 or more)
summary: >-
  S07 at e: x = E1 S05 at e (the open-interest weighted lower median of the roster coins' funding rate per 8 h less Binance's default 0.0001);
  the base = S05 at the 504 clock hours h with e - 504 h < h <= e, VALUED with 479 or more; z = (x - med) / max(1.4826 MAD, 1.2533 MeanAD),
  4 decimals; NO_BASELINE, ZERO_SPREAD, x's reason when empty (CARD_E1_V9 rule 25). S08 at a minute end: the signed count of clock hours in a
  row, from the last clock hour back (at most 24), with S07 at 2 or more in size on the side of the last hour's sign; 0 when the last hour's
  |S07| is under 2 (rules 27, 14).
read_as: >-
  The year writes both exactly: 5,760 of 5,760 values (2,880 minute ends x S07, S08) replayed from its own S05 on 8 Mar 2026 and 4 Nov
  2025 (RULE_E1_STAMPS_V1, J16009, again J16018). The spread was the MeanAD floor (1.2533 MeanAD over 1.4826 MAD) at 1,440 of 1,440 minute
  ends of both days (J16018), the MAD above 0 at all of them (J16022: MEANAD 1,440, MEANAD_MAD0 0): on these days S07 is (x - median) over
  1.2533 x the mean absolute deviation, not the MAD's robust z, hence the rename (EDGE1 17:11:43Z). On those days S07 never reached 2 in size (-1.9217 to 1.7773), so S08 was 0 at every minute: the 'persist' setting never fired.
  S07 kept one sign a day (8 Mar: -1 or less at 36.53% of minutes, never 1 or more; 4 Nov: 1 or more at 62.01%, never -1 or less): it says
  where the market's funding sits against its own last 3 weeks, and the base moves with the rate; it is not 'above the default' (S05 0 at 12:00
  of 4 Nov gave S07 1.7001; CARD_E1_V9, BED's finding 3).

conclude:
  may:
    - "where the market's funding deviation sits against its own last 504 hours, in units of the spread max(1.4826 MAD, 1.2533 MeanAD), the MeanAD term on both days (S07: the year's value equals our replay at 2,880 of 2,880 minute ends of 8 Mar 2026 and 4 Nov 2025; RULE_E1_STAMPS_V1, J16009)"
    - "how many hours in a row the market's funding has stayed 2 of S07's units or more from its 3 weeks (S08: equal to our replay at 2,880 of 2,880; 0 at every minute of both days)"
  never:
    - "S07 as crowded positioning in itself: it is the funding against its own last 3 weeks; on 4 Nov 2025 the rate at its default (S05 0) read S07 1.7001 (J16009)"
    - "S08 not 0 as common: it was 0 at every minute of 8 Mar 2026 and 4 Nov 2025, S07 never 2 or more in size (J16009)"
    - "S07 as the MAD's robust z: the spread was the 1.2533 MeanAD term at 1,440 of 1,440 minute ends of both days (J16018, J16022)"


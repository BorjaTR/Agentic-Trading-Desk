- what: the textbook form of each name (TA-Lib's documented definitions, Wilder, Lane, Kaufman, Chande, White; talib itself is not in the analyst venv) coded apart in float64 on the same chain
  where: team/LAB/code/rawcheck/meaning_nautilus_osc.py ref (every coin-minute of 8 Mar 2026 and 24 Sep 2025, 52 and 51 coins)
  status: 'MEASURED on every coin-minute of 8 Mar (J15977) and 24 Sep (J15979): equal to 1e-8 for stoch.value_k, cci.value, cmo.value, macd.value, psl.value; the differences named per setting (smoothing, scale, window, sign)'

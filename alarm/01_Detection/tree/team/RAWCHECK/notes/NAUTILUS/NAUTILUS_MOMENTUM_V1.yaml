  status: 'AGREES: corr 0.9995 to 1.0000, |gap| median 2.161e-13 to 1.962e-09 over 10 settings, every coin-minute of 8 Mar (the candles are the same minute almost always: C13 against the kline, BASIC_C8); the largest gaps where one candle differs: cci.value max 64.71, stoch.value_k max 50, cmo.value max 22.94, stoch.value_d max 16.67'

  year_output_columns: name (S01 to S84), coin, as_of_us (the minute end e), value_kind (0 empty, 1 float, 2 int, 4 a decimal with value_f64 and its text), value_f64, value_txt, known_at_us, stale, empty_reason, flags
  read_it_with: team/LAB/code/rawcheck/ours.py at(D, 'NAUTILUS', settings, coins, moments); rawcheck/nautilus_osc.py year_rows (empty by value_kind only)
source:
  vendor: 'none new: built on our 1-minute candles of Binance USDT perpetual trades through Tardis (C13 S01 to S04, MEANING_C13_V4; the open and the volume from the same rows, the
    candle base)'
  exchange_stream: trades (Binance USD-M futures trade channel through Tardis.dev)
  files: '<ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/trades_<SYM>_<YYYY-MM-DD>.csv.gz (D-2, D-1 and D: the chain of rule 13)'
  columns: timestamp (the trade time, exchange), local_timestamp (arrival), side, price, amount
  fields:
    candle: 'close, high, low of the trades stamped in (e - 60 s, e] and received by e (C13 rules 1, 3, 4); open = the first such row''s price, volume = the sum of the amounts; a
      minute with no trade is flat at the carried price with volume 0 [proof: CARD_NAUTILUS_V4 rules 1, 2; nautilus_candles job 15946: Tardis C, H, L = C13 at every valued minute]'
    chain: 'the candles from 00:00 of D-2 up to e, one step per candle; an empty candle (C13 reason) is skipped and every value at that minute end carries the reason
      [proof: CARD_NAUTILUS_V4 rules 3, 13; case E25; test_nautilus_osc T21]'
    arithmetic: 'Decimal at 40 digits, each value rounded once to 12 decimals half up [proof: rule 6; nautilus_osc rnd; the year values equal at 12 decimals, jobs 15975, 15976]'
  latency: 'known_at = the latest C13 known_at of the candles stepped (the latest trade arrival); at a minute end every value is the last full minute (rule 14); max_staleness 60 s'
reading_rules:
- 'the chain: the candles from 00:00 of D-2 to e, one step per valued candle; a candle with an empty reason is skipped and every value at that minute end carries the reason (CARD_NAUTILUS_V4 rules 3, 13)'
- 'the value at a minute end is the last full minute (rule 14); every period counts candles stepped, so after a feed hole a window spans more clock minutes (rule 3)'
- 'WARMUP while the chain has stepped fewer candles than the Need (rule 8); NO_RANGE, NO_MOVE, NO_VOLUME, NO_SWING for a zero denominator or no swing yet (rules 9, 10): empty is never 0'
- 'Decimal at 40 digits, rounded once to 12 decimals half up (rule 6); the integers S46, S47, S56, S57, S61 to S63 exact'
values:
  units: 'S36 0 to 100, S37 0 to 100, S38 -100 to 100, S39 USDT, S40 USDT, S41 0 to 1, S42 ratio, S43 USDT a candle, S44 up to 1, S45 percent, S46 0 or 1, S47 0 or 1'
  empty: 'C13''s reason (NO_ROSTER, NO_FILE, TRADES_HOLE, THIN_FEED, BAD_INPUT), WARMUP, NO_RANGE, NO_MOVE, NO_VOLUME, NO_SWING; value_kind 0 (NaN in value_f64). Never read empty as 0. 8 Mar 2026: S29 NO_RANGE 1, S35 NO_MOVE 12, S41 NO_MOVE 33 of 2,845,440 values (J15978 empty)'
  stale: 'with C13''s TRADES_HOLE or THIN_FEED (the candle at e empty)'
  flags: 'the candle''s (DUPLICATE_ROW:<coin>, NO_RATE_BASE:<coin>); none on an empty value'
interpret:
  do:
  - 'how recent the 26-candle high or low is (aroon) and which is newer (aroon.value sign)'
  - 'how straight the path of the last 10 closes was (er near 0.9 or 1) and how trending the last 28 (vhf)'
  dont:
  - 'S45 as Chande''s forecast oscillator: the sign is the opposite (74770 of 74770); plus means the line is ABOVE the close'
  - 'S46 = 1 as "both averages rising": EMA_10 fell in 4194 of 36387 ones on 8 Mar; S47 the same the other way'
biases:
- what: our candle against Binance's kline of the same minute
  direction: 'either way, rarely (a trade stamped in the last ms received after e, or stamped exactly on the minute end: MEANING_C13_V4, BASIC_C8)'
  size: 'corr 0.9995 to 1.0000, |gap| median 0 to 3.226e-13 over 12 settings, every coin-minute of 8 Mar (the candles are the same minute almost always: C13 against the kline, BASIC_C8); the largest gaps where one candle differs: aroon.aroon_down max 4, aroon.value max 4, archer.long_run max 1, archer.short_run max 1'
  proof: J15978 klines (our formulas on Binance's OHLCV chain of 6 to 8 Mar against the year, 52 coins, every minute end)

group: NAUTILUS
name: trend indicators (nautilus, built on our 1-minute candles)
summary: 'Twelve trend numbers of NautilusTrader 1.231.0 on our 1-minute candles: aroon up, down and oscillator (26 candles), the smoothed directional moves (EMA_14 of +DM, -DM), the efficiency ratio (9 steps over 10 deltas), the vertical horizontal filter (28), the 20-candle least-squares line (slope, R2, and the line''s gap to the close) and the Archer EMA_5 / EMA_10 flags. Four settings RENAMED: S41 er (net over 9 steps against the path over 10, RULING 3), S45 (the negative of Chande''s forecast oscillator), S46, S47 (the fast EMA above or below its value 5 candles back while the slow EMA moved either way).'
read_as: 'How clean and how new the move is, on one coin. Each value equals the card''s formula on the year''s own C13 candles at every coin-minute of two days (J15975, J15976: 0 MISS). aroon, vhf, the slope and R2 are the textbook forms to 1e-8 (J15977 ref). dm.pos and dm.neg are EMAs, about one fourteenth of TA-Lib''s Wilder sums (corr 0.9820). er is Kaufman''s idea with a window quirk: the net change over 9 steps against the path over 10 deltas, so a straight line over all 10 steps reads 0.9 and 1 needs the oldest delta to be 0 (corr 0.8562 with Kaufman''s ER(10)); 476 of 74847 coin-minutes at 0.95 or more on 8 Mar. linreg.cfo is 100 x (line - close) / close: the OPPOSITE sign of Chande''s forecast oscillator at 74770 of 74770 non-zero coin-minutes (renamed). archer.long_run was 1 while EMA_10 fell at 4194 of its 36387 ones (renamed).'
conclude:
  may:
  - 'how recent the 26-candle high or low is (aroon) and which is newer (aroon.value sign)'
  - 'how straight the path of the last 10 closes was (er near 0.9 or 1) and how trending the last 28 (vhf)'
  - 'the slope and the fit of the last 20 closes (S43 in USDT a candle, S44 0 to 1) and how far the line sits above or below the close (S45)'
  - 'that EMA_5 rose (S46 = 1) or fell (S47 = 1) over the last 5 candles'
  never:
  - 'S45 as Chande''s forecast oscillator: the sign is the opposite (74770 of 74770); plus means the line is ABOVE the close'
  - 'S46 = 1 as "both averages rising": EMA_10 fell in 4194 of 36387 ones on 8 Mar; S47 the same the other way'
  - 'er = 1 as the only straight line: a straight line over all 10 steps reads 0.9; er compared with Kaufman''s ER(10) (corr 0.8562)'
  - 'dm.pos, dm.neg as TA-Lib''s PLUS_DM, MINUS_DM: ours are EMAs of the moves (a fourteenth of the Wilder sums, faster)'
  - 'aroon on a tie as the oldest candle: the newest wins (the oldest-tie reading differs at p90 by 20 points)'

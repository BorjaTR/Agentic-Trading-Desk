- 'the chain of each coin starts at the first valued candle of 00:00 of D-2 (rule 13); an EMA-type average starts at its first input (rule 4), forgotten at 12 decimals after the two
  days (card part 6; J15981: equal to the TA-Lib seeded forms)'

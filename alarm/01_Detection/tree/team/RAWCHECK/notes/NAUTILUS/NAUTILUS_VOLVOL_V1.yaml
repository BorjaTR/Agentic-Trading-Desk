settings:
- id: NAUTILUS.S48
  layer: nautilus
  side: none
  window: 14 candles
  clock: minute end
  scope: coin
  contracts: USDT
  aggregate: 'SMA_14(TR), TR = max(H, C(t-1)) - min(L, C(t-1)); H - L at the chain''s first candle'
  aliases: atr.value
  means: 'the usual size of a candle''s move over the last 14, in USDT: a simple mean of the true range, not Wilder''s smoothed ATR'
  name: 'mean true range over 14 candles (SMA, not Wilder)'
  renamed_from: atr.value
  computation:
    status: RELIABLE
    proof: 'J15975, J15976: equal to the formula on the year''s C13 candles at 74,880 of 74,880 (8 Mar 2026, 52 coins) and 73,440 of 73,440 (24 Sep 2025, 51 coins) coin-minutes, every minute end, at 12 decimals; 4 Nov 2025 at 5 minute ends x 52 coins J15941 (ed1; editions 2, 3 changed only the --at all window and S29''s residue rule, test T23)'
  meaning:
    status: DEFINED_WITH_OPEN
    proof: 'an independent float of the formula agrees with the year at corr 1.0000 (J15977 ref); against ATR_wilder14: corr 0.9900, Spearman 0.9993, |gap| median 6.746e-05 p90 0.01835 max 72.59, same sign 100.00% at 74,880 coin-minutes (per coin corr lowest 0.9323, median 0.9562) (J15977 ref); against TRANGE: corr 0.8404, Spearman 0.9823, |gap| median 0.0003571 p90 0.085 max 560.2, same sign 99.94% at 74,880 coin-minutes (per coin corr lowest 0.3685, median 0.5304) (J15977 ref); our formula on Binance klines: corr 1.0000, Spearman 1.0000, |gap| median 2.857e-13 p90 4.286e-13 max 0.3714, same sign 100.00% at 74,880 coin-minutes (per coin corr lowest 0.9999, median 1.0000) (J15978); name test: ratio median 0.9850 p10 0.8720 p90 1.1261 at 74880 coin-minutes (J15977 name)'
  open: 'renamed (RULING 3): a simple mean of the true range, not Wilder''s ATR: 0.87 to 1.13 of it at p10 to p90; could_build NAUTILUS.CB18'
- id: NAUTILUS.S49
  layer: nautilus
  side: none
  window: 19 candles
  clock: minute end
  scope: coin
  contracts: USDT
  aggregate: '100 x U / (U + D), U and D the EMA_10 of s on up closes and of s on down closes, s = the sample sd of the last 10 closes (0 into both on an unchanged close); NO_MOVE when U + D = 0'
  aliases: rvi.value
  means: 'the share of recent volatility that came with up closes, 0 to 100 (Dorsey''s relative volatility index, EMA_10)'
  name: 'relative volatility index with EMA_10 smoothing, 0 to 100'
  renamed_from: rvi.value
  computation:
    status: RELIABLE
    proof: 'J15975, J15976: equal to the formula on the year''s C13 candles at 74,880 of 74,880 (8 Mar 2026, 52 coins) and 73,440 of 73,440 (24 Sep 2025, 51 coins) coin-minutes, every minute end, at 12 decimals; 4 Nov 2025 at 5 minute ends x 52 coins J15941 (ed1; editions 2, 3 changed only the --at all window and S29''s residue rule, test T23)'
  meaning:
    status: DEFINED_WITH_OPEN
    proof: 'an independent float of the formula agrees with the year at corr 1.0000 (J15977 ref); our formula on Binance klines: corr 0.9996, Spearman 0.9996, |gap| median 3.553e-13 p90 2.166e-05 max 36.2, same sign 100.00% at 74,880 coin-minutes (per coin corr lowest 0.9957, median 0.9999) (J15978); no textbook form coded (Dorsey''s RVI differs only by its smoothing; the ratio is scale-free)'
  open: 'renamed (RULING 3): EMA_10 smoothing where Dorsey''s RVI uses Wilder 14; could_build NAUTILUS.CB19; the size not measured (no run)'
- id: NAUTILUS.S50
  layer: nautilus
  side: none
  window: 30 candles
  clock: minute end
  scope: coin
  contracts: USDT
  aggregate: 'SMA_30(TR) / SMA_10(TR); NO_RANGE when SMA_10(TR) = 0'
  aliases: vr.value
  means: 'the 30-candle mean true range over the 10-candle one: above 1 the last 10 candles are calmer than the last 30 (not Schwager''s TR / ATR)'
  name: 'mean true range over 30 candles over the mean over 10 (slow over fast)'
  renamed_from: vr.value
  computation:
    status: RELIABLE
    proof: 'J15975, J15976: equal to the formula on the year''s C13 candles at 74,880 of 74,880 (8 Mar 2026, 52 coins) and 73,440 of 73,440 (24 Sep 2025, 51 coins) coin-minutes, every minute end, at 12 decimals; 4 Nov 2025 at 5 minute ends x 52 coins J15941 (ed1; editions 2, 3 changed only the --at all window and S29''s residue rule, test T23)'
  meaning:
    status: DEFINED_WITH_OPEN
    proof: 'an independent float of the formula agrees with the year at corr 1.0000 (J15977 ref); against ATR30_over_ATR10_wilder: corr 0.6834, Spearman 0.6629, |gap| median 0.0965 p90 0.2598 max 2.975, same sign 100.00% at 74,880 coin-minutes (per coin corr lowest 0.6346, median 0.6871) (J15977 ref); our formula on Binance klines: corr 1.0000, Spearman 1.0000, |gap| median 2.5e-13 p90 4.667e-13 max 0.06754, same sign 100.00% at 74,880 coin-minutes (per coin corr lowest 0.9998, median 1.0000) (J15978)'
  open: 'slow over fast mean true range, not Schwager''s TR / ATR: renamed; could_build NAUTILUS.CB11'
- id: NAUTILUS.S51
  layer: nautilus
  side: none
  window: 20 candles
  clock: minute end
  scope: coin
  contracts: USDT
  aggregate: '(C - EMA_20(TP)) / ((kc.upper - kc.lower) / 2), the Keltner channel EMA_20(TP) +/- 2 x SMA_20(TR); NO_RANGE when SMA_20(TR) = 0'
  aliases: kp.value
  means: 'where the close sits against the Keltner channel, in half-widths: +1 at the upper band, -1 at the lower'
  name: 'Keltner position, half-widths'
  derived_from: NAUTILUS.S15, NAUTILUS.S16, NAUTILUS.S17 (NAUTILUS_BANDS_V1)
  computation:
    status: RELIABLE
    proof: 'J15975, J15976: equal to the formula on the year''s C13 candles at 74,880 of 74,880 (8 Mar 2026, 52 coins) and 73,440 of 73,440 (24 Sep 2025, 51 coins) coin-minutes, every minute end, at 12 decimals; 4 Nov 2025 at 5 minute ends x 52 coins J15941 (ed1; editions 2, 3 changed only the --at all window and S29''s residue rule, test T23)'
  meaning:
    status: DEFINED_WITH_OPEN
    proof: 'an independent float of the formula agrees with the year at corr 1.0000 (J15977 ref); our formula on Binance klines: corr 1.0000, Spearman 1.0000, |gap| median 3.613e-13 p90 8.167e-06 max 0.4401, same sign 99.99% at 74,880 coin-minutes (per coin corr lowest 0.9994, median 1.0000) (J15978); no textbook form coded: the Keltner channel is NR1''s (S15 to S17, SMA_20 of TR by case E2)'
  open: 'the channel is SMA_20 of TR around EMA_20(TP) (NR1''s S15 to S17)'
- id: NAUTILUS.S52
  layer: nautilus
  side: none
  window: 1,440 candles
  clock: minute end
  scope: coin
  contracts: USDT
  aggregate: 'the sum over the last 1,440 candles of +V when C > O, -V when C < O, else 0'
  aliases: obv.value
  means: 'the volume of up candles less the volume of down candles over the last 1,440 candles (a day), the sign by the candle''s own close against its open; in coins'
  name: 'signed volume over 1,440 candles (close against open)'
  renamed_from: obv.value
  computation:
    status: RELIABLE
    proof: 'J15975: equal to the formula on the year''s C13 candles with the base''s open and volume at 74,880 of 74,880 coin-minutes of 8 Mar 2026 (every minute end, 52 coins), 0 MISS; 24 Sep 2025 (J15976): MATCH 11,637, MISS 61,803 where the base''s volume differs from the year''s input (the Expansion trades copy, METRIC_AUDIT2 J15958): an open of the base'
  meaning:
    status: DEFINED_WITH_OPEN
    proof: 'our formula on Binance klines: corr 1.0000, Spearman 0.9998, |gap| median 1125 p90 2.531e+05 max 1.693e+07, same sign 99.94% at 74,880 coin-minutes (per coin corr lowest 0.9763, median 1.0000) (J15978); name test: the two signs differ on 10561 of 74880 kline minutes with volume (J15977 name)'
  open: 'close against open and a 1,440-candle window: renamed; could_build NAUTILUS.CB12; on 24 Sep the base''s volume differs from the year''s input (J15976): J15997 (count_miss_b1check_v2 against B1CHECK_20250924, METRIC_AUDIT2 J15991): of the 24 Sep MISS, those with a minute in reach where the base differs from B1: S52 61,685 of 61,803, S55 62,680 of 64,927, S54 14,238 of 14,429, S53 38,100 of 38,647; the rest (DASH, VVV, ICP, TRUMP, ONDO, TIA, ADA) hold no such minute, about half of them a minute B1CHECK could not compare, the cause not named (an open of the base)'
- id: NAUTILUS.S53
  layer: nautilus
  side: none
  window: 67 candles
  clock: minute end
  scope: coin
  contracts: USDT
  aggregate: 'EMA_13(EMA_34(sV) - EMA_55(sV)), sV = +V when TP rose against the previous TP (0 at the first candle), -V when it fell, else 0; the signal EMA fed from the 55th candle'
  aliases: kvo.value
  means: 'a MACD of the volume signed by the typical price''s direction, in coins: plus when volume has lately come on rising typical prices (not Klinger''s volume force)'
  name: 'volume flow oscillator (EMA_13 of EMA_34 less EMA_55 of the volume signed by the typical price''s move)'
  renamed_from: kvo.value
  computation:
    status: RELIABLE
    proof: 'J15975: equal to the formula on the year''s C13 candles with the base''s open and volume at 74,880 of 74,880 coin-minutes of 8 Mar 2026 (every minute end, 52 coins), 0 MISS; 24 Sep 2025 (J15976): MATCH 34,793, MISS 38,647 where the base''s volume differs from the year''s input (the Expansion trades copy, METRIC_AUDIT2 J15958): an open of the base'
  meaning:
    status: DEFINED_WITH_OPEN
    proof: 'our formula on Binance klines: corr 0.9999, Spearman 0.9934, |gap| median 10.54 p90 918.2 max 6.328e+05, same sign 99.12% at 74,880 coin-minutes (per coin corr lowest 0.9907, median 0.9996) (J15978)'
  open: 'not Klinger''s volume force: renamed; could_build NAUTILUS.CB13; 24 Sep as S52 (J15997)'
- id: NAUTILUS.S54
  layer: nautilus
  side: none
  window: 20 candles
  clock: minute end
  scope: coin
  contracts: USDT
  aggregate: '((C - L) - (H - C)) / EMA_20(TR) x V / EMA_20(V); NO_RANGE when EMA_20(TR) = 0, then NO_VOLUME when EMA_20(V) = 0'
  aliases: pressure.value
  means: 'buying less selling pressure of the candle (the close''s place in its range, in units of the smoothed true range) scaled by the candle''s volume against its smoothed volume'
  name: 'pressure (Nautilus)'
  computation:
    status: RELIABLE
    proof: 'J15975: equal to the formula on the year''s C13 candles with the base''s open and volume at 74,880 of 74,880 coin-minutes of 8 Mar 2026 (every minute end, 52 coins), 0 MISS; 24 Sep 2025 (J15976): MATCH 59,011, MISS 14,429 where the base''s volume differs from the year''s input (the Expansion trades copy, METRIC_AUDIT2 J15958): an open of the base'

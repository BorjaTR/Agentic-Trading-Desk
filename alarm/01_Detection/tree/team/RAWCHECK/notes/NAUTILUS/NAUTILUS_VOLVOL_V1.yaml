group: NAUTILUS
name: volatility and volume (nautilus, built on our 1-minute candles, the volume from the candle base)
summary: 'Eight numbers of NautilusTrader 1.231.0: atr (a simple mean of 14 true ranges), rvi (the share of volatility on up closes), vr (the 30-candle mean true range over the 10-candle one), kp (the close in Keltner half-widths), and four volume numbers on the candle''s open and volume (the shared base): obv over 1,440 candles signed by close against open, kvo (a volume MACD by typical-price direction), pressure and its 1,440-candle sum. Six RENAMED (RULING 3): atr (SMA_14, not Wilder), rvi (EMA_10, not Wilder 14), vr, obv, kvo and pressure.value_cumulative say other formulas than their names.'
read_as: 'How big the minutes are and whether volume backs the move, on one coin. The four price settings equal the card''s formula on the year''s C13 candles at every coin-minute of two days (J15975, J15976: 0 MISS); the four volume settings equal it on 8 Mar with the candle base''s open and volume (J15975: 299,520 values, 0 MISS); on 24 Sep they differ wherever the base''s volume does (the Expansion trades copy lacks rows the year read after 08:03 and on 23 Sep: METRIC_AUDIT2 J15958): an open of the base, not of the formula. atr is a simple mean, 0.9850 of Wilder''s ATR(14) at the median (p10 0.8720, p90 1.1261; corr 0.9900). vr is slow over fast, not Schwager''s TR / ATR (corr 0.6834 even with its own Wilder form). obv signs by the candle''s close against its OPEN, Granville by the previous close: the signs differ on 10561 of 74880 minutes; and it is a 1,440-candle window, not cumulative. kvo is not Klinger''s volume force. On Binance''s own klines our formulas give the same numbers (corr 0.9995 to 1.0000, J15978).'
conclude:
  may:
  - 'the usual size of a candle''s move (atr, USDT) and whether the last 10 candles are calmer (vr above 1) than the last 30'
  - 'whether volatility came with up closes (rvi above 50) and where the close sits in its Keltner channel (kp, half-widths)'
  - 'whether the last day''s volume came on up candles (obv above 0, by close against open) and whether volume lately backs rising typical prices (kvo above 0)'
  - 'the candle''s buying less selling pressure scaled by its relative volume (S54) and its last-day sum (S55)'
  never:
  - 'atr as Wilder''s ATR (renamed): a simple 14-candle mean, 0.9850 of Wilder''s at the median, 0.8720 to 1.1261 at p10 to p90'
  - 'vr as the volatility ratio TR / ATR or as fast over slow: it is SMA_30(TR) / SMA_10(TR), above 1 when NOW is calmer'
  - 'obv as Granville''s OBV: the sign is close against open (not the previous close; 10561 of 74880 minutes differ) and the sum is over 1,440 candles, not since a start'
  - 'kvo as Klinger''s KVO: it is EMA_13 of (EMA_34 - EMA_55) of the volume signed by the typical price''s move'
  - 'pressure.value_cumulative as a running total: it is the last 1,440 candles'
  - 'the volume settings on 24 Sep 2025 from the base as proof: the base''s trades copy differs from the year''s input there (J15976, J15997, METRIC_AUDIT2 J15958)'

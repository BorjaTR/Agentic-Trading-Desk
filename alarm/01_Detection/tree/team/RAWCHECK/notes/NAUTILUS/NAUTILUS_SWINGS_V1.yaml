group: NAUTILUS
name: swings (nautilus, built on our 1-minute candles, period 5)
summary: 'Eight swing numbers of NautilusTrader 1.231.0 on our 1-minute candles, period 5 (rule 10): a swing-high candle has H = HH_5 and L above LL_5, a swing-low candle L = LL_5 and H below HH_5 (both or neither changes only the counts); the direction (+1 after a swing high, -1 after a swing low), whether it flipped at this candle, the last swing high and low prices, their difference, and the candles since each; empty NO_SWING until both a swing high and a swing low have happened.'
read_as: 'Where the last short-term turns were, on one coin. Each value equals the card''s formula on the year''s own C13 candles at every coin-minute of two days (J15975, J15976: 0 MISS; the rule''s edge cases in test_nautilus_osc T6, T20, T22). The scout''s reading of Nautilus (H >= HH_5 and L >= LL_5) gives the same direction at every coin-minute of both days (J15977, J15979 name: 0 differ): the two rules are one rule once a both-candle cancels. On Binance''s klines the same rule gives the same swings (direction corr 1.0000, J15978). The candles after a dip are swing highs by this rule (card case E6: the flat candles after a low tie the 5-candle high with their low above it), so since_high is often 1 to 3 on a flat stretch.'
conclude:
  may:
  - 'which way the last 5-candle turn went (direction) and when (since_high, since_low; duration = the age of the current leg)'
  - 'the last swing high and low prices and their gap (length, USDT; below 0 when the low came after a lower high)'
  - 'that a new leg began at this candle (changed = 1)'
  never:
  - 'a swing as a large move: the period is 5 candles; a flat candle after any dip is a swing high (case E6), so since_high of 1 to 3 is common on flat stretches'
  - 'the direction while NO_SWING: the chain has not yet seen both a high and a low (every day: the chain from D-2 has them within minutes)'
  - 'changed = 1 at the first swing of a chain: the first swing is not a flip (case E32)'
  - 'length compared across coins: USDT of the coin; use it against atr or the close'
where:
  card: testbed/value_audit/code/L0_y52f12/value_audit/registers/CARD_NAUTILUS_V4.md (60f66fc848dda3cd; rules 1 to 18, cases N1 to E88)
  settings_register: testbed/value_audit/code/L0_y52f12/value_audit/registers/SETTINGS_NAUTILUS_V2.tsv (e82d7319899be9ea)
  built_on_register: 'team/RAWCHECK/notes/MEANING/MEANING_C13_V4.yaml (C13 S01 close, S02 high, S03 low, S04 no trade: raw, RELIABLE, LIMITS); the open and the volume: the shared
    candle base rawcheck/nautilus_candles.py (METRIC_AUDIT2, 0571dec26778f46d) from the same Tardis trade rows as C13, proven row by row against C13 and B1 (job 15946)'
  producer: testbed/value_audit/code/L0_y52f12/value_audit/code/prod_NAUTILUS_v4.py (2ad9df92f9f4f82f; edition 4 rules)
  year_output: <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/NAUTILUS.parquet
  year_output_columns: name (S01 to S84), coin, as_of_us (the minute end e), value_kind (0 empty, 1 float, 2 int, 4 a decimal with value_f64 and its text), value_f64, value_txt, known_at_us, stale, empty_reason, flags
  read_it_with: team/LAB/code/rawcheck/ours.py at(D, 'NAUTILUS', settings, coins, moments); rawcheck/nautilus_osc.py year_rows (empty by value_kind only)
source:
  vendor: 'none new: built on our 1-minute candles of Binance USDT perpetual trades through Tardis (C13 S01 to S04, MEANING_C13_V4; the open and the volume from the same rows, the
    candle base)'
  exchange_stream: trades (Binance USD-M futures trade channel through Tardis.dev)
  files: '<ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/trades_<SYM>_<YYYY-MM-DD>.csv.gz (D-2, D-1 and D: the chain of rule 13)'
  columns: timestamp (the trade time, exchange), local_timestamp (arrival), side, price, amount
  fields:
    candle: 'close, high, low of the trades stamped in (e - 60 s, e] and received by e (C13 rules 1, 3, 4); open = the first such row''s price, volume = the sum of the amounts; a
      minute with no trade is flat at the carried price with volume 0 [proof: CARD_NAUTILUS_V4 rules 1, 2; nautilus_candles job 15946: Tardis C, H, L = C13 at every valued minute]'
    chain: 'the candles from 00:00 of D-2 up to e, one step per candle; an empty candle (C13 reason) is skipped and every value at that minute end carries the reason
      [proof: CARD_NAUTILUS_V4 rules 3, 13; case E25; test_nautilus_osc T21]'
    arithmetic: 'Decimal at 40 digits, each value rounded once to 12 decimals half up [proof: rule 6; nautilus_osc rnd; the year values equal at 12 decimals, jobs 15975, 15976]'
  latency: 'known_at = the latest C13 known_at of the candles stepped (the latest trade arrival); at a minute end every value is the last full minute (rule 14); max_staleness 60 s'
reading_rules:
- 'the chain: the candles from 00:00 of D-2 to e, one step per valued candle; a candle with an empty reason is skipped and every value at that minute end carries the reason (CARD_NAUTILUS_V4 rules 3, 13)'
- 'the value at a minute end is the last full minute (rule 14); every period counts candles stepped, so after a feed hole a window spans more clock minutes (rule 3)'
- 'WARMUP while the chain has stepped fewer candles than the Need (rule 8); NO_RANGE, NO_MOVE, NO_VOLUME, NO_SWING for a zero denominator or no swing yet (rules 9, 10): empty is never 0'
- 'Decimal at 40 digits, rounded once to 12 decimals half up (rule 6); the integers S46, S47, S56, S57, S61 to S63 exact'
- 'rule 10, period 5, this candle among the last 5: a swing-high candle has H = HH_5 and L above LL_5, a swing-low candle L = LL_5 and H below HH_5; both or neither changes only the counts; the first swing is not a flip'
values:
  units: 'S56 +1 or -1, S57 0 or 1, S58 USDT, S59 USDT, S60 USDT, S61 minutes, S62 minutes, S63 minutes'
  empty: 'C13''s reason (NO_ROSTER, NO_FILE, TRADES_HOLE, THIN_FEED, BAD_INPUT), WARMUP, NO_RANGE, NO_MOVE, NO_VOLUME, NO_SWING; value_kind 0 (NaN in value_f64). Never read empty as 0. 8 Mar 2026: S29 NO_RANGE 1, S35 NO_MOVE 12, S41 NO_MOVE 33 of 2,845,440 values (J15978 empty)'
  stale: 'with C13''s TRADES_HOLE or THIN_FEED (the candle at e empty)'
  flags: 'the candle''s (DUPLICATE_ROW:<coin>, NO_RATE_BASE:<coin>); none on an empty value'
interpret:
  do:
  - 'which way the last 5-candle turn went (direction) and when (since_high, since_low; duration = the age of the current leg)'
  - 'the last swing high and low prices and their gap (length, USDT; below 0 when the low came after a lower high)'
  dont:
  - 'a swing as a large move: the period is 5 candles; a flat candle after any dip is a swing high (case E6), so since_high of 1 to 3 is common on flat stretches'
  - 'the direction while NO_SWING: the chain has not yet seen both a high and a low (every day: the chain from D-2 has them within minutes)'
biases:
- what: our candle against Binance's kline of the same minute
  direction: 'either way, rarely (a trade stamped in the last ms received after e, or stamped exactly on the minute end: MEANING_C13_V4, BASIC_C8)'
  size: 'corr 1.0000 to 1.0000, |gap| median 0 to 2.385e-17 over 8 settings, every coin-minute of 8 Mar (the candles are the same minute almost always: C13 against the kline, BASIC_C8); the largest gaps where one candle differs: swings.high_price max 5.2, swings.length max 5.2, swings.since_high max 3, swings.duration max 1'
  proof: J15978 klines (our formulas on Binance's OHLCV chain of 6 to 8 Mar against the year, 52 coins, every minute end)

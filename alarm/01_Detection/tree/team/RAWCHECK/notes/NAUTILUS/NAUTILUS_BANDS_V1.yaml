name: NAUTILUS bands S12 to S25 (nautilus layer, on OUR 1-minute candles)
summary: 'Fourteen band and Ichimoku levels of a coin at each minute end, in USDT: Bollinger bands of the typical price (20, 2 sd: S12 to S14), the Keltner channel (EMA_20 of the typical
  price, 2 x the simple ATR_20: S15 to S17), the Donchian channel (20: S18 to S20), the Ichimoku tenkan, kijun and the cloud edges at the current candle (S21 to S24) and the close 26
  candles back (S25). Each is the NautilusTrader 1.231.0 formula on OUR 1-minute candles (C13), the chain from 00:00 of D-2, exact, rounded once to 12 decimals.'
read_as: 'The year equals the card''s formula exactly: 770 of 770 coin-minutes per setting (J15933) and at the named empty and gap minutes (J15974). Donchian and Ichimoku equal their
  standard definitions at step 3 points (J15981). The Bollinger settings are on the typical price, not the close: renamed (S12 to S14), with Bollinger of the close as could_build; the
  Keltner channel is on the typical price with a simple ATR_20: renamed (EDGE1 RULING 3), the common modern form as could_build; S25 is the close 26 candles back, not the chikou span
  itself: renamed, the chikou reading as could_build.'
conclude:
  may:
  - where the close sits in its 20-candle range (S18 to S20 equal TA-Lib MAX, MIN, MIDPRICE)
  - the Ichimoku tenkan, kijun and cloud edges at the current candle (S21 to S24, the standard definitions)
  - how far the close is stretched against 2 sd of the typical price (S12, S14) or 2 average true ranges (S15, S17), per coin
  never:
  - 'S12 to S14 as Bollinger bands of the close (renamed: on the typical price)'
  - 'S15 to S17 as a charting Keltner channel (renamed: EMA of TP, simple ATR_20)'
  - 'S25 as the current close (renamed: the close 26 candles back)'
  - a band compared across coins in USDT
  - 'a value read at an EMPTY minute end: empty is never 0'

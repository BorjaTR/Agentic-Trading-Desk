reading_rules:
- 'the candle at a minute end e: C13 close, high, low of the 60 s ending at e (trades stamped in (e - 60 s, e], received by e); a candle C13 leaves empty is skipped and every value at
  e is empty with its reason; periods count candles stepped, so after a gap a window spans more clock minutes (CARD_NAUTILUS_V4 rules 1, 3, 18)'
- 'the chain of each coin starts at the first valued candle of 00:00 of D-2 (rule 13); an EMA-type average starts at its first input (rule 4), forgotten at 12 decimals after the two
  days (card part 6; J15981: equal to the TA-Lib seeded forms)'
- each value exact (Decimal, 40 digits), rounded once to 12 decimals, half up; value_kind 4 carries the written text (rule 6)
- TP = (H + L + C)/3 of the candle; sd divides by n; ATR_20 of S15, S17 is the simple 20-candle mean of TR, TR = max(H, C(t-1)) - min(L, C(t-1)), H - L at the chain's first candle
- S23, S24 are the spans computed 26 candles back (the cloud as it stands at e); S25 is the close 26 candles back
values:
  units: USDT (a price level of the coin)
  empty: NO_ROSTER, NO_FILE, TRADES_HOLE, THIN_FEED, BAD_INPUT (C13 reasons of the candle at e), WARMUP (the chain has fewer candles than the Need), no formula empty in S12 to S25 (no
    denominator); value_kind 0. Never read empty as 0
  stale: true when the candle at e is empty for TRADES_HOLE or THIN_FEED (C13)
  flags: DUPLICATE_ROW:<coin>, NO_RATE_BASE:<coin> (C13, on valued answers)
interpret:
  do:
  - read the close at e against the band of the same coin and minute
  - read the cloud (S23, S24) against the close at e
  dont:
  - compare a band with another coin in USDT
  - treat a Bollinger touch on TP as the textbook touch

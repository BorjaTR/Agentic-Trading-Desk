  - {what: "S04 against one-sidedness via max(S04, 1 - S04); S01 ours less klines signed; S07's twins at every minute with D-1 read", run: "python3 -B -m rawcheck.meaning_relative c5v <D> | twins2 <D>", where: "team/RAWCHECK/code (meaning_relative.py ed6 e83ddd2809493979, tests 45 of 45, mutants 21 of 21; J15879, J15880)"}

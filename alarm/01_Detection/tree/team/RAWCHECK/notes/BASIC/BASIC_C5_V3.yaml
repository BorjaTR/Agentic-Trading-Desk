  - {what: "every value and twin equal to an exact recompute (fractions) from our C1", run: "python3 -B -m rawcheck.basic_c5 --days <D1,D2> --at <HHMM,..> --out <dir>", where: "team/RAWCHECK/code (basic_c5.py f1d923e07406f3d6, tests 14 of 14, mutants 9 of 9; job 15819; C5_STAMPS_V1 1ac967d2327d4431)"}

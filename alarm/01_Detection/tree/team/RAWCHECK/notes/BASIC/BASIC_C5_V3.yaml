  - {what: "the gap split, the twins, the coverage, the empties", run: "python3 -B -m rawcheck.meaning_relative decomp <D> | twins <D> | cover <D> | empty <D>", where: team/RAWCHECK/code}
  - {what: "one market minute: every coin's input, ours and the kline's", run: "python3 -B -m rawcheck.meaning_relative mlook <D> C5.<S01|S02|S03|S04> <HHMM>", where: team/RAWCHECK/code}


  - {what: "the names: breadth (signed), one-sided (the larger share), rotation (its direction), dispersion (sd against the interquartile range)", where: "kline returns", status: "DIFFERED for S01, S04, S07, RENAMED; S02, S03 the sd as named, tail-driven (job 15833 c5name)"}
  - {what: "the twins: .coverage against the count of our coins with the C1 input; .strict_off against the value", where: "our C1 rows", status: "VERIFIED as a recompute from our own C1 rows, not an outside record: 1,440 of 1,440 minutes both days (job 15833 twins, cover); S07.coverage and .strict_off at all 1,440 minutes with D-1's C1 rows read for 00:00 to 00:29 (J15879, J15880 twins2)"}


# BASIC_E3_V2.yaml: the card of the basic settings of E3, EDITION 2 (EDGE1, 2026-10-18, BR5 edit 1) = BASIC_E3_V1 (kept) with EDGE2's review of 14:58:45Z applied.
# Made as BASIC_C1_V5 (METRIC_REVIEW_METHOD_V1 section 5). Computation J15897 (basic_deriv 9420f568), meaning J15900 (meaning_deriv 7e89c066, tests 1642b1fb), J15901 (meaning_deriv ae69d2fc, tests 611e4290).
group: E3
name: mark premium speed (basic, built on E3 S01)
summary: 'How fast the market''s mark premium moves: the median over the roster coins of the change of each coin''s exact mark premium (10,000 x (mark - index) / index of the row read
  at e and at e - W: E3 S01 before its rounding) over 60 s (S02) and 300 s (S03), in bp per minute, rounded once to 4 decimals; with the coins counted (.coverage).'
read_as: 'Whether the typical coin''s premium over spot is widening (plus) or narrowing, per minute. Recomputed from E3 S01 at every minute end of both days, equal within one unit of
  the 4th decimal: the year works on the exact premiums, our recompute on E3 S01 rounded to 4 decimals (J15897). Against the same rule on Binance''s mark and index 1 minute klines it
  follows closely, not exactly: corr 0.93 to 0.97, the other sign on 5.4 to 6.4% of minutes, |gap| median 0.11 bp per minute for S02, max 8.068 (J15900). At 8 Mar 2026 02:51 and 02:52
  the kline basis of 36 and 37 of the 52 coins moves over 3 bp per minute away from ours and back while ours stays (counted from the look3 tables of J15901): consistent with Binance''s
  index kline close being the next second''s index (MEANING_E3_V2, jobs 15734, 15735). 22:06 is different: our own premiums moved (our median from -2.17 to 10.06 bp per minute; DASH
  -23.91 to -0.70 against klines -4.07 to -4.95): cause open. The old names said basis; E3 S01 is the mark premium (renamed in MEANING_E3_V2): RENAMED; the instant basis speed is could_build
  E3.CB2.'
conclude:
  may:
  - whether the typical coin's mark premium over spot is widening (plus) or narrowing, and how fast, in bp per minute (S02 over the last minute, S03 over the last 5 minutes)
  never:
  - 'the speed of the instant basis (last trade or book mid against spot): it is Binance''s smoothed mark premium'
  - 'a single minute''s small S02 as a direction: its kline version differs by a median 0.11 bp per minute and has the other sign on 5.5 to 6.1% of minutes (J15900)'
  - 'Binance''s 1 minute kline basis speed as the same number: its basis jumps and comes back at single minutes (8 Mar 2026 02:51, J15901), consistent with its index close being the
    next second''s index'
  - 'a jump at one minute as Binance moving alone: at 8 Mar 2026 22:06 our own premiums moved (median 10.06 bp per minute against klines 3.22), cause open'
where:
  card: testbed/value_audit/registers/CARD_E3_V1.md
  settings_register: testbed/value_audit/registers/SETTINGS_E3_V1.tsv
  built_on_register: 'team/RAWCHECK/notes/MEANING/MEANING_E3_V2.yaml (E3 S01, raw: RELIABLE, DEFINED)'
  producer: testbed/value_audit/code/prod_E3_v1.py
  year_output: <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/E3.parquet
  year_output_columns: name, coin (roster coin, or MARKET), as_of_us (e), value_kind (0 empty, 1 float, 2 int, 3 word, 4 decimal with value_f64 and its text), value_f64, value_txt, known_at_us,
    stale, empty_reason, flags
  read_it_with: team/LAB/code/rawcheck/ours.py at(D, 'E3', settings, coins, moments)
source:
  vendor: 'none new: built on our raw E3 S01 (Tardis.dev binance-futures derivative_ticker mark_price and index_price; MEANING_E3_V2)'
  exchange_stream: 'derivative_ticker: Binance''s mark price and index price from its markPrice stream, every 1 s (MEANING_E3_V2)'
  files: <ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/derivative_ticker_<COIN>USDT_<YYYY-MM-DD>.csv.gz (read by the producer of the raw E3); <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/E3.parquet
    (E3 S01 read here)
  columns: name, coin (roster coin, or MARKET), as_of_us (e), value_kind (0 empty, 1 float, 2 int, 3 word, 4 decimal with value_f64 and its text), value_f64, value_txt, known_at_us,
    stale, empty_reason, flags
  fields:
    premium: 'E3 S01: 10,000 x (mark - index) / index of one row, bp: Binance''s smoothed mark premium [proof: MEANING_E3_V2 S01]'
    speed: '(b(e) - b(e - W)) x 60 s / W from the exact premiums of the two reads, then the median over the coins [proof: CARD_E3_V1 rules 8, 9]'
  latency: as E3 S01's (the row's arrival); a premium older than 61 s is empty STALE_VALUE and leaves its coin out
reading_rules:
- speed of a coin over W = (b(e) - b(e - W)) x 60 s / W in bp per minute, b the exact premium of the row read at e and at e - W (before E3 S01's rounding), empty when either read is
  (CARD_E3_V1 rule 8)
- 'the market value is the median over the coins with a speed (even count: the mean of the two middle), rounded once to 4 decimals; .coverage counts them (rule 9)'
values:
  units: bp per minute
  empty: NO_ROSTER, NO_FILE, BAD_INPUT, NO_VALUE, STALE_VALUE, ALL_COINS_EMPTY; value_kind 0. Never read empty as 0
  stale: when every coin is stale
  flags: DUPLICATE_ROW:<coin>, BAD_INPUT:<coin>
interpret:
  do:
  - read the sign as the premium widening (plus) or narrowing
  - read S03 for the trend of the last 5 minutes and S02 for the last minute
  dont:
  - read a small S02 as a direction
  - read it as the instant basis
biases:
- what: Binance's kline basis at single minutes
  direction: the outside record jumps and comes back, ours stays
  size: 36 and 37 of 52 coins at 8 Mar 2026 02:51, 02:52; 11 of 51 at 24 Sep 2025 04:32 (the two speeds over 3 bp per minute apart; counted from the look3 tables of J15901)
  proof: 'J15901 look3; consistent with MEANING_E3_V2 (jobs 15734, 15735: Binance''s index kline close is the next second''s index)'
- what: our own premiums at 8 Mar 2026 22:06
  direction: ours moves more than the klines
  size: median 60 s speed ours 10.06 against klines 3.22 bp per minute; 43 of 52 coins over 3 apart; DASH ours -23.91 to -0.70, klines -4.07 to -4.95
  proof: J15900 e3m; J15901 look3 2206 (counted from its table); cause open
external_checks:

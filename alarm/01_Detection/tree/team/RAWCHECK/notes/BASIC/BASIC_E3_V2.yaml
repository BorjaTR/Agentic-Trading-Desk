  status: 'FOLLOWS, NOT EQUAL: S02 corr 0.9347, 0.9579, S03 0.9396, 0.9674; the other sign on 5.49%, 6.12% (S02) and 6.42%, 5.37% (S03) of minutes; |gap| median 0.109, 0.110 and 0.025,
    0.023, max 8.068, 2.497 and 1.858, 0.425 bp per minute (J15900); the widest named (J15901)'

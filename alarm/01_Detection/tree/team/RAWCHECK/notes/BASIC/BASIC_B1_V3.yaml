# Made the way BASIC_C8_V3 was (METRIC_REVIEW_METHOD_V1 da211e1d section 5; the rename rule; conclude). ONE SOURCE OF TRUTH;
# rawcheck/meaning_register.py (edition 5 6223b1ad) checks it and writes .md, .flat.jsonl, .agent.jsonl.
# Layer: basic (a sum, ratio, rate or median of proven raw taker dollars). S13 (a robust z of S12's drift) and S14 (its square), with their

     meaning: {status: DEFINED_WITH_OPEN, proof: "CARD_D3_V4 rule 9 (D2's weighted mid with 5 levels' dollars for weights; Stoikov S1 of MEANING_D2D3_V2: a weighted mid, not the micro-price): RENAMED; J15947, J15948 d3: S07 - mid = half the spread x S03 (the bookTicker spread within 1% at 97.93%, 96.22%)"},
     open: "carries nothing beyond the top's prices and S03",
     never: ["S07 as a micro-price (D3.CB2)"]}
  - {id: D3.S08, name: "5-level weighted mid's distance from the mid, bps", renamed_from: "micro_dev_d", layer: basic, side: none, window: "the snapshot row in force at e (seen within 15 s)", clock: minute end, scope: coin, contracts: USDT,
     aggregate: "(S07 - mid) / mid x 10,000 = half the spread in bps x S03", aliases: "EF.ef_micro_dev_d (the old name)",
     derived_from: "D3 S03 and the snapshot's spread",
     means: "how far the 5-level weighted mid sits from the mid, in bps",
     computation: {status: RELIABLE, proof: "BOOK_STAMPS_V1 658b774f: 221,805 of 221,805 MATCH"},
     meaning: {status: DEFINED_WITH_OPEN, proof: "J15947, J15948 d3: 2 S08 / S03 against the bookTicker spread: median 1.000000, within 1% at 97.93% and 96.22% of 74,880 and 73,440 coin-minutes, within 0.1% at 86.48% and 79.55% (the two channels' tops); lean as S03 (56.80%, 57.73%): RENAMED"},
     open: "across coins its size is the spread's",
     never: ["S08 as a signal apart from S03"]}
  - {id: D3.S15, name: "coin's top-of-book dollars over the median coin's", renamed_from: "xs_depth", layer: basic, side: none, window: "the rows in force at e", clock: minute end, scope: coin, contracts: USDT,
     aggregate: "the coin's exact D3 S01 over the exact S16", aliases: "EF.ef_xs_depth_usd (the old name: not dollars, a ratio)",

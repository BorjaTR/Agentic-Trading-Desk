settings:
  - {id: D3.S02, name: "dollar imbalance of the 25 levels seen", layer: basic, side: none, window: "the snapshot row in force at e (seen within 15 s)", clock: minute end, scope: coin, contracts: USDT,
     aggregate: "(bid - ask) / (bid + ask) of the 25 levels' dollars", aliases: "CUBE.depth_imb",
     means: "whether the 25 levels seen hold more bid or ask dollars: +1 all bid, -1 all ask",
     computation: {status: RELIABLE, proof: "BOOK_STAMPS_V1 658b774f: 221,805 of 221,805 MATCH (J15905 to J15908)"},
     meaning: {status: DEFINED_WITH_OPEN, proof: "J15954 bookdepth: on CRV equal to Binance's own 1% imbalance (Spearman 0.9692, 0.9510), on BTC not (0.0639, 0.0506: its 25 levels are 0.27% and 0.53% of the 1% notional); J15947, J15948 lean: to its side 52.94% and 53.27%"},
     open: "the 25 levels are a different share of each coin's book (BTC 0.27% of its 1% notional, SOL 33.25%; CRV's 25 levels pass 1%, 6.79 times its notional; 8 Mar 2026, J15954)",
     never: ["S02 as the book's imbalance on a liquid coin"]}
  - {id: D3.S03, name: "dollar imbalance of the first 5 levels", layer: basic, side: none, window: "the snapshot row in force at e (seen within 15 s)", clock: minute end, scope: coin, contracts: USDT,
     aggregate: "(bid - ask) / (bid + ask) of levels 0 to 4's dollars", aliases: "EF.ef_near_imb",
     means: "whether the 5 best levels hold more bid or ask dollars",
     computation: {status: RELIABLE, proof: "BOOK_STAMPS_V1 658b774f: 221,805 of 221,805 MATCH"},
     meaning: {status: DEFINED_WITH_OPEN, proof: "J15947, J15948 lean: the next mid change to S03's side at 56.80% and 57.72% of 68,316 and 72,112 coin-minutes, rising with |S03| (53.75%, 59.37%, 64.83%, 73.75% on 8 Mar 2026); against D2 S03 (the top) Spearman 0.55676, 0.60937"},
     open: "a lean, not a forecast; 5 levels can be under a tick's width of price on BTC",
     never: ["S03 as a forecast of the next price"]}
  - {id: D3.S04, name: "dollar imbalance of the levels seen within 10 bps of the mid (of the 25)", renamed_from: "imb_band_10", layer: basic, side: none, window: "the snapshot row in force at e (seen within 15 s)", clock: minute end, scope: coin, contracts: USDT,
     aggregate: "(bid - ask) / (bid + ask) over the bids at or above mid (1 - 0.001) and the asks at or below mid (1 + 0.001) among the 25 levels; NO_LEVELS when none", aliases: "EF.ef_imb_010 (the old name)",
     means: "the imbalance of the near book within 10 bps as far as the 25 levels reach",
     computation: {status: RELIABLE, proof: "BOOK_STAMPS_V1 658b774f: 221,805 of 221,805 MATCH (NO_LEVELS included)"},
     meaning: {status: DEFINED_WITH_OPEN, proof: "J15947, J15948 d3: equal to S02 (all 25 levels inside 10 bps) at 15.67% and 30.94% of coin-minutes, 5 and 11 coins at every minute: the band cut by the snapshot, RENAMED; empty NO_LEVELS on CRV all 8 Mar; lean 57.04% and 55.20%, 82.79% and 79.98% at |S04| 0.8 or more"},
     open: "the band is cut by the 25 levels on the liquid coins; CRV's half spread passes 10 bps (NO_LEVELS)",
     never: ["S04 as the book within 10 bps where it equals S02"]}
  - {id: D3.S05, name: "dollar imbalance of the levels seen within 30 bps of the mid (of the 25)", renamed_from: "imb_band_30", layer: basic, side: none, window: "the snapshot row in force at e (seen within 15 s)", clock: minute end, scope: coin, contracts: USDT,
     aggregate: "the same over 30 bps", aliases: "EF.ef_imb_030 (the old name)",
     means: "the imbalance of the book within 30 bps as far as the 25 levels reach",
     computation: {status: RELIABLE, proof: "BOOK_STAMPS_V1 658b774f: 221,805 of 221,805 MATCH"},
     meaning: {status: DEFINED_WITH_OPEN, proof: "J15947, J15948 d3: equal to S02 at 38.21% and 61.79% of coin-minutes (18 and 31 coins every minute): RENAMED; J15949: where the 25 levels pass 20 bps (SOL) their notional equals Binance's within 0.2% (1.0001); the imbalance ranks with Binance's only at Spearman 0.7454 (the same sign 81.56%, the cause not named)"},
     open: "cut by the 25 levels on most coins; not tested at 30 bps itself (Binance writes 0.2% and 1%)",
     never: ["S05 as the book within 30 bps where it equals S02"]}
  - {id: D3.S06, name: "dollar imbalance of the levels seen within 50 bps of the mid (of the 25)", renamed_from: "imb_band_50", layer: basic, side: none, window: "the snapshot row in force at e (seen within 15 s)", clock: minute end, scope: coin, contracts: USDT,
     aggregate: "the same over 50 bps", aliases: "EF.ef_imb_050 (the old name)",
     means: "the imbalance of the book within 50 bps as far as the 25 levels reach",
     computation: {status: RELIABLE, proof: "BOOK_STAMPS_V1 658b774f: 221,805 of 221,805 MATCH"},
     meaning: {status: DEFINED_WITH_OPEN, proof: "J15947, J15948 d3: equal to S02 at 55.77% and 76.47% of coin-minutes (27 and 39 coins every minute): RENAMED; lean 53.23%, 53.32% (J15947, J15948)"},
     open: "mostly the 25 levels: on 24 Sep 2025 39 coins at every minute",
     never: ["S06 as the book within 50 bps where it equals S02"]}
  - {id: D3.S07, name: "mid weighted by the first 5 levels' dollars, USDT", renamed_from: "mp_depth", layer: basic, side: none, window: "the snapshot row in force at e (seen within 15 s)", clock: minute end, scope: coin, contracts: USDT,

  BUILT_ON: team/RAWCHECK/notes/MEANING/MEANING_D2D3_V2.yaml f33f6ba098035767
  STAMPS: "team/RAWCHECK/notes/RAWCHECK/BOOK_STAMPS_V1.tsv 658b774f3febf6d6 (J15905 base, J15906 to J15908 Tardis)"
  TWINS: "team/BED/seats/EDGE1/receipts/q_15849/<D>/TWINS_<D>.tsv (8 Mar a9bc9402dcda74b9, 24 Sep 0ea4c5c8804a3576)"
  JOBS: "15905 (basic_book base, 3 days; log 155fbe2d), 15906, 15907, 15908 (basic_book tardis 8 Mar, 24 Sep, 4 Nov; 3f5f3b4b, 81642fde, 309bc753), 15947, 15948 (schema; 96f4cebc, 7f83e31d), 15950 (c12; cde01fba), 15953 (c12 again with the step that differs, meaning_bookbasic ed3 a1b2b25e; f862e428)"

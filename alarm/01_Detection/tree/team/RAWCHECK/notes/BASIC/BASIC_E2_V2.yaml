  side: none
  window: 60 s
  clock: minute end
  scope: coin
  contracts: USDT
  aggregate: 1 when the row the any-age open interest at e (S02.any_age_off) is read from arrived at or before e - 60 s, else 0
  aliases: m1_oi_carried
  means: whether the coin's open interest at e comes from a row older than a minute (1) or a row arrived in the last minute (0; that row may repeat the last open interest)

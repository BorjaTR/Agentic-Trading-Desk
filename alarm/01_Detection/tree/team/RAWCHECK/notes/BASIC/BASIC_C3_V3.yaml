group: C3
name: price range (basic, built on the book mid)
summary: >-
  Per coin, how wide its book mid ((best bid + best ask) / 2, Tardis book_ticker) swung over a window ending at e: the highest less the lowest
  mid among every top that stood in [e - W, e] (every top, not only whole seconds), set against the mid at e: S01 60 s and S02 300 s in
  percent, S05 120 s and S04 30 s as a fraction, S06 30 s in basis points; S03 the change of S01 from the minute before; S07 the 60 s range over
  the 300 s range; S08 the 300 s range over the mean range of its five minutes; S09 the mean range of the last 60 minutes over the mid at e, in
  percent; S10 the place of the mid at e in its 8 h range (0 low, 1 high). S04 and S06 are written every 30 s, the others at each minute end.
  The year also writes the same ten on Tardis quotes (.quotes_off): copies, its accepted cross-check, not metrics of their own.
read_as: >-
  The coin's QUOTED MID range. Against the same quantity on Binance's own 1-minute klines (its trades) at every coin-minute of 8 Mar 2026 and
  24 Sep 2025 (J15864, J15865): the ranges S01, S02, S05 are 0.9483 to 0.9985 of the kline ranges at the median coin-minute and rank
  alike the coin-minutes where both ranges are above 0 (Spearman 0.92903 to 0.98805); with the zeros in, 0.80898 to 0.98804 (8 Mar: S01 0 while
  the trades span a range at 6,160 of 74,880 coin-minutes); S10 equals the kline place within 0.004699 at the median; S03's sign agrees in 92.74% and
  94.50%. On a quiet day the wide-tick coins split mid and trades apart: CRV's mid stood still for an hour while its trades bounced one 0.43%
  tick every minute (8 Mar 02:59 to 03:58, J15864 c3look), so a trade-based range measures the bid-ask bounce there. That breaks the ratios and the
  60-minute mean on 8 Mar: Spearman against klines S07 0.85196, S08 0.77257, S09 0.81029 (24 Sep: 0.94352, 0.93714, 0.97401). S08 and S09
  carried 'atr' in their old names; they are built on 1-minute MID ranges (S09 is 0.8905 of the textbook trade ATR on 8 Mar): RENAMED, the
  trade ATR to could_build (C3.CB1). S04 is S06 / 10,000 at every 30 s step (one value in two units). S04 and S06 rank 30 s windows as the
  30 s trade range of Binance's aggTrades does (24 Sep 2025, 8 coins: Spearman 0.97322, per coin 0.82744 to 0.99755) at about its size (ours over
  it 0.9999 at the median, J15990): wider where the quotes moved without trades (SEI 02:36:00, 10.3538 against 3.4507 bps), narrower where a
  sweep printed below the standing top (ASTER 05:29:00, 108.5984 against 159.6285 bps; J15992 c3s30look).

conclude:
  may:
    - "how far a coin's quoted mid swung over the last 60 s, 120 s or 300 s (S01, S05, S02) against its mid now, ranking as its trade range does the coin-minutes where both ranges are above 0 (Spearman 0.92903 to 0.98805; with the zeros 0.80898 to 0.98804, J15864, J15865)"
    - "where the mid sits in its 8 h range (S10: within 0.004699 (8 Mar) and 0.002221 (24 Sep) of the kline place at the median coin-minute)"
    - "how far a coin's quoted mid swung in the last 30 s (S04 a fraction, S06 bps of the mid now), ranking 30 s windows as the trade range of the same 30 s does (Spearman 0.97322, 24 Sep 2025, 8 coins with aggTrades, J15990)"
    - "S03's sign: the last minute swung wider (plus) or narrower than the minute before (the kline version's sign in 92.74% and 94.50% of coin-minutes)"
  never:
    - "that a coin did not trade when its mid range is 0: a wide-tick coin's mid can stand still for an hour while its trades bounce one tick every minute (CRV 8 Mar 2026 02:59 to 03:58, J15864 c3look)"
    - "S08 or S09 as the textbook ATR of trades: they are built on mid ranges (renamed; the trade ATR is C3.CB1)"
    - "S07 or S08 to two decimals on a wide-tick coin on a quiet day: its ranges are 0 to 2 ticks, so the ratios take a few values (ARB 8 Mar 2026 05:44: S07 0, S08 5 against 1 and 1 on klines, J15864 c3look)"
    - "that a coin did not trade in the last 30 s when S04 or S06 is 0: S06 was 0 while the trades moved at 309 of 23,032 coin-steps (24 Sep 2025, 8 coins; SEI 178, ADA 53; J15990)"
    - "S06 as the deepest price traded in the 30 s: a sweep prints below the standing top (ASTER 24 Sep 2025 05:28:37: trades down to 2.0377, the lowest standing mid 2.0483; J15992)"
    - "a copy (.quotes_off) as a metric of its own: it is the year's cross-check of the same metric on a second feed; read the ten metrics"
    - "how long the mid stood at its high or low from S01: a top that stood 0 ms counts (J15869 why FIL 8 Mar 06:09: the low stood 0.0 ms)"


source:
  vendor: "Tardis.dev, Binance USD-M futures, through our raw C13 S05 (the book mid, MEANING_C13_V4)"
  exchange_stream: "bookTicker as Tardis records it (book_ticker); C3 reads the rows itself: every top that stands in the window"
  files: "<ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/book_ticker_<SYM>_<YYYY-MM-DD>.csv.gz of D, D-1 (a window starting before 00:00, an 8 h or 1 h window) and D-2 only as C1's rule 2 fallback; the week's roster (the year roster root)"
  columns: "exchange, symbol, timestamp, local_timestamp, ask_amount, ask_price, bid_price, bid_amount"
  fields:
    range: "the highest less the lowest mid among the top standing at s = e - W and every top that comes to stand in (s, e]; known when the top is known at every moment of [s, e] (stamped at most 30 s before), else BOOK_HOLE [proof: CARD_C3_V7 rules 1 to 4; basic_c3c4.c3_range (e43169989347ee69); C3C4_STAMPS_V1]"
    scale: "S01, S02: 100 x range / mid at e; S04, S05: range / mid at e; S06: 10,000 x range / mid at e [proof: CARD_C3_V7 rule 5, O6]"
    s03: "S01 at e less S01 at e - 60 s, each rounded (rule 10), exact [proof: CARD_C3_V7 rule 6]"
    s07_s08: "S07 = range 60 s / range 300 s; S08 = range 300 s / mean of the ranges of its five minutes, each closed at both ends; a divisor 0: NO_SPREAD [proof: CARD_C3_V7 rules 7, 8, O3]"
    s09: "100 x the mean of the ranges of the 60 minutes ending at e (each closed) / mid at e [proof: CARD_C3_V7 rule 8, O3]"
    s10: "(mid at e - 8 h low) / (8 h high - 8 h low); range 0: NO_SPREAD [proof: CARD_C3_V7 rule 9, O4]"
  latency: "known_at = the latest arrival of the rows that stand in the windows used; at most e; max_staleness 30 s (CARD_C3_V7 part 2)"
  silence: "a top unknown at some moment of the window (a silence over 30 s): BOOK_HOLE, stale; 8 Mar 2026 and 24 Sep 2025: 0 empty except NO_SPREAD for S07, S08 (1,068 and 27 coin-minutes: the 300 s range or the five-minute mean 0, J15864, J15865 c3schema)"

reading_rules:
  - "a range is of the BOOK MID over every top that stood (not of trades, not only whole seconds), against the mid at e (O6)"
  - "a ratio or a place with a divisor 0 is empty NO_SPREAD, never 0 or 1"
  - "the year also writes 10 copies of the same metrics as its own cross-check: .quotes_off, the same range from a second price feed (Tardis quotes). ACCEPTED as a cross-check (the owner 18 Oct 2026, BASIC_C1_V5): the ranges S01, S02, S04, S05, S06 equal to the metric at 83.20 to 91.28% of rows on 8 Mar 2026 and 79.08 to 87.10% on 24 Sep 2025, the change, ratios and place S03, S07, S08, S10 at 53.95 to 81.04% and 52.75 to 76.03%, S09 (a mean of 60 minutes) at 11.38% and 7.61%; corr 0.9891 to 0.9999, otherwise a small gap from the two feeds disagreeing (gap p99 up to 0.42 in the setting's unit, S06 3.28 bps; S07, S08 empty in the copy at 34 and 3 coin-minutes where the metric has a value; J15849 TWINS); not separate metrics"
  - "S04 and S06 are the same 30 s range, a fraction and basis points (S04 x 10,000 = S06 at 100% of minute ends, J15864, J15865 c3name); both are written every 30 s"
  - "at a fire a minute-end setting gives the last full minute; a fire-second setting the window ending at the fire (CARD_C3_V7 rule 13)"

values:
  units: "S01, S02, S09: percent of the mid at e; S03: percent points; S04, S05: a fraction of the mid at e; S06: basis points; S07, S08: ratios; S10: 0 to 1"
  zero: "a range 0 = the mid did not move in the window (the trades may still have bounced across the spread); S10 0 = the mid at e is the 8 h low"
  empty: "NO_ROSTER, NO_FILE, BOOK_HOLE, NO_SPREAD; value_kind 0 with NaN in value_f64. Never read empty as 0"
  stale: "1 when empty BOOK_HOLE"
  flags: "none (a bad row never stands, CARD_C3_V7 part 2)"

interpret:
  do:
    - "read S01, S02, S05 as the coin's quoted swing over the window: close to its trade swing on a busy day (ratio 0.9893 to 0.9985 on 24 Sep at the median)"
    - "read S10 as the 8 h place of the mid: it matches the kline place (Spearman 0.99681 and 0.99957)"
  dont:
    - "read a 0 range as no activity on a wide-tick coin (CRV, FIL, ENA, ARB, WLFI on 8 Mar 2026: the worst median gaps, J15864 c3worst)"
    - "read S08 or S09 as a trade ATR (renamed)"
    - "trust S07, S08 between coins whose ranges are a few ticks"
    - "read empty as 0"

biases:
  - {what: "the mid does not cross the spread; trades do", direction: "a mid range smaller than the trade range, by the bid-ask bounce", size: "S01 below the kline range in 76.84% (8 Mar) and 67.90% (24 Sep) of coin-minutes; the worst S01 rows a quarter of the kline range (ONDO, FIL, ENA, NEAR 8 Mar, J15864 c3worst)", proof: "J15864, J15865 c3day; J15869 why FIL 06:09 (one tick of the mid, four of the trades: the top at the ask, the bottom at the bid)"}
  - {what: "wide-tick coins on a quiet day: the mid stands still while trades bounce one tick each minute", direction: "S09, S07, S08 apart from their kline versions", size: "CRV 8 Mar 03:58: S09 0.007199 against the kline mean range 0.440115 (one tick every minute; ours one tick in 60 minutes / 60); ARB 05:44: S08 5 against 1, S07 0 against 1", proof: "J15864 c3worst (the 12 worst S09 rows all CRV; S07, S08 all ARB); J15864 c3look CRV 03:58, ARB 05:44"}


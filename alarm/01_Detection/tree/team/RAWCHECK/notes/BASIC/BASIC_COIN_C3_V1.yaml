# BASIC_COIN_C3_V1.yaml: the card of the basic group COIN_C3 coin strength (built on the C13 book mid closes), EDITION 1 (EDGE2, 2026-10-18; BR3 =
# WP3 of BASIC_REVIEW_WORKPACKAGES_V3 075b96c8). Made as BASIC_C9_V1; meaning_register edition 5 6223b1ad3de7bb1b checks it. Register of the day:
# LAYER_REGISTER_V18 b2d8bb81 (COIN_C3 NOT_CHECKED before this card). S01 to S12, S21, S22; S13 to S20 (over the coin's dial: our rules) not here.
# Every meaning number is from the BR3 proof run on meaning_minute edition 4 fe27fa1c: J15895 (8 Mar 2026), J15896 (24 Sep 2025); first J15889, J15890.
# Edit 1 (EDGE2, 18 Oct 2026, before landing): BED's REVIEW BR3.COIN_C3 (hb/BED.txt 15:08:56Z): E1 the year's 20 twins of these 14 settings: the 14
# .quotes_off are copies (the year's accepted cross-check, as BASIC_C1_V5: one reading rule, one never line, no rows); the 6 .cov_off counts are
# rows, recomputed by basic_coinc3 ed. 2 6d5e7d90 (COINC3_STAMPS_V2, J15968: 15,400 of 15,400); E2 the 24 Sep rank misses named (3 ties of the
# 6-decimal check, BED's J15935); E3 the jobs of may 2, the biases over all 12 settings; E4 job 15716's scope; cc3name's labels fixed in
# meaning_minute ed. 5 43c71985 (J15969: the same numbers as J15895, J15896 under the right labels).
# Edit 2 (EDGE2, 18 Oct 2026): the sha16 of COINC3_STAMPS_V2.tsv is ff89f47f8a7bc90d (my edit 1 mistyped one character; BED 15:26:53Z).

group: COIN_C3
name: coin strength (basic, built on the C13 book mid closes)
summary: >-
  For each roster coin at a minute end e, over h = 5, 15, 60, 240 minutes: its return from its book mid closes (C13 S05) in percent points
  (S01 to S04), that return less BTC's (S05 to S08) and less the median return of the roster less BTC (S09 to S12, 10 coins or more), and its
  rank among the roster less BTC over 60 and 240 minutes (S21, S22: 0 the worst, 100 the best, a tie at the bottom).
read_as: >-
  Returns of the QUOTED MID, against the market. The names hold on our values at 100%: x_btc is the return less BTC's, x_med less the median of
  the roster WITHOUT BTC, the rank counts the others strictly below (J15895, J15896 cc3name; on 24 Sep the 6-decimal check misses 3 coin-minutes
  of S21, S22, ties at 6 decimals that differ exactly: S21 PENGU 02:56 with HYPE, S21 APT 22:49 with TIA, S22 BTC 07:11 with ETH; the exact ranks
  equal the year at every row, BED's J15935). Against the same on Binance's kline closes (the
  last trade of each minute) they rank coin-minutes alike on a busy day (24 Sep 2025: Spearman 0.983033 to 0.999842) and less on a quiet one
  (8 Mar 2026: 0.936015 to 0.999045, short horizons lowest): every largest gap is CRV, whose last trade sits a tick from the mid (C1 V5's case).
  Computation: 15,400 of 15,400 with the six counts .cov_off (COINC3_STAMPS_V2, J15968; V1 10,780 of 10,780 kept). EDGE1's earlier S01 compare
  (job 15716, BTC alone on 8 Mar) is covered by cc3day over every roster coin (it prints no BTC line of its own). The year also writes 14 copies
  .quotes_off (the same settings on the quotes' closes): the year's accepted cross-check, not metrics of their own.

conclude:
  may:
    - "how a coin's quoted mid moved over 5 to 240 minutes, against BTC and against the typical other coin (S01 to S12): the same sign as on Binance's candles at 93.99 to 99.99% of coin-minutes, Spearman 0.936 to 0.9998 (J15895, J15896)"
    - "whether a coin led or lagged the other coins over 60 and 240 minutes (S21, S22, 0 to 100): ranking coin-minutes as the candles do, Spearman 0.986789 to 0.998946 (J15895, J15896 cc3day)"
    - "how many coins less BTC had a return at a horizon (the six .cov_off: the count the median and the rank are over; COINC3_STAMPS_V2)"
  never:
    - "a short-horizon excess or rank of a wide-tick coin on a quiet day as its trade move: the last trade bounces a tick around the mid (CRV 8 Mar 22:29: 0.867679 against 1.304348, J15895 cc3look)"
    - "x_med as against the whole roster: the median leaves BTC out (with BTC it equals at 0.14 to 9.51% of minutes only, J15895, J15896 cc3name)"
    - "a rank or an x_med when fewer than 10 other coins have a return: empty THIN_ROSTER, never 50 or 0"
    - "a copy (.quotes_off) as a metric of its own: it is the year's cross-check of the same setting on the quotes' closes; read the 14 settings"

where:
  card: testbed/value_audit/code/L0_y52f12/value_audit/registers/CARD_COIN_C3_V6.md 457731e44e88010b (rules 1 to 18, OPEN-1 to OPEN-4)
  settings_register: testbed/value_audit/code/L0_y52f12/value_audit/registers/SETTINGS_COIN_C3_V1.tsv dd7da09c2cb5033a (22 settings)
  built_on_register: "team/RAWCHECK/notes/MEANING/MEANING_C13_V4.yaml fe5df65ba7680fc8 (C13 S05 the book mid close: raw, LIMITS)"
  layer_list: "team/LAB/notes/RAWCHECK/BASIC_LIST_V2.md (COIN_C3 S01 to S12, S21, S22 basic); LAYER_REGISTER_V18 b2d8bb81"
  producer: "testbed/value_audit/code/L0_y52f12/value_audit/code/prod_COIN_C3_v5.py 82285b19dda34151 (CARD_COIN_C3_V6 edition 6)"
  year_output: <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/COIN_C3.parquet
  year_output_columns: "name, coin (every roster coin), as_of_us (the 1,440 minute ends), value_kind (0 = EMPTY), value_f64, value_txt, known_at_us, stale, empty_reason, flags"
  read_it_with: "meaning_candle.ours(D, names, group='COIN_C3') (value_kind 0 empty, else value_f64)"

source:
  vendor: "Tardis.dev, Binance USD-M futures book_ticker, through our raw C13 S05 (MEANING_C13_V4)"
  exchange_stream: "bookTicker as Tardis records it, read by C13 (the mid in force at each minute end); COIN_C3 reads C13's S05 rows"
  files: "the year's C13 output of D and D-1 (C13.parquet), the week's roster (the year roster root)"
  columns: "C13 S05 (the mid close) with value_kind, value_f64, value_txt, known_at_us, empty_reason, flags"
  fields:
    returns: "ret_h = 100 x (close at e / close at e - h min - 1), exact, 6 decimals half up; D-1's rows for a horizon before 00:00 [proof: CARD_COIN_C3_V6 rules 1, 2, 12; COINC3_STAMPS_V1; planted E2 to E5, N4a in tests/test_basic_coinc3.py 900b1e40]"
    excess: "x_btc = ret - BTC's ret; x_med = ret - the median of the roster less BTC (10 or more, an even count the mean of the two middle) [proof: CARD_COIN_C3_V6 rules 3 to 6, OPEN-1 A, OPEN-2 A; planted E6 to E11, N3a, N3b]"
    rank: "100 x (others strictly below) / (others), 10 or more [proof: CARD_COIN_C3_V6 rule 8, OPEN-3 A; planted E8 to E11]"
  latency: "known_at = the latest known_at of the closes read (CARD_COIN_C3_V6 rule 9); a close is the mid in force at the minute end, at most 30 s old (C13)"
  silence: "empty with the close's reason (NO_FILE, BOOK_HOLE, NO_ROSTER), THIN_ROSTER under 10 coins, NO_BTC without BTC (CARD_COIN_C3_V6 rules 2 to 8)"

reading_rules:
  - "returns are of the book MID at the minute ends, not of the last trade"
  - "the median and the rank are over the roster LESS BTC (OPEN-1 A); BTC's own rank places it among them; BTC's own x_btc is 0"
  - "a tie ranks at the bottom of its tie (OPEN-3 A)"
  - "the year also writes 14 copies as its own cross-check, .quotes_off (S01 to S12, S21, S22 by the same rules on the quotes' closes, C13 S05.quotes_off; CARD_COIN_C3_V6 rule 15). ACCEPTED as a cross-check (the owner 18 Oct 2026, BASIC_C1_V5): equal to the setting at 92.38 to 99.07% of coin-minutes (8 Mar 2026) and 88.23 to 98.91% (24 Sep 2025), corr 0.99959 to 1.00000 (J15849 TWINS); a copy is no metric of its own: read the 14 settings"

values:
  units: "S01 to S12: percent points; S21, S22: 0 to 100"
  zero: "0 = no move (or the same move as the reference); BTC's S05 to S08 are 0 by rule"
  empty: "NO_ROSTER, NO_FILE, BOOK_HOLE, THIN_ROSTER, NO_BTC; value_kind 0 with NaN. Never read empty as 0"
  stale: "true only with BOOK_HOLE"
  flags: "SKIPPED_BAD_ROW (C13's)"

interpret:
  do:
    - "read S05 to S12 for a move of the coin's own against BTC's or the market's; S21, S22 for the leader or the laggard"
  dont:
    - "read a 5 min excess of a wide-tick coin on a quiet day as its trade move"
    - "read empty as 0"

biases:
  - {what: "the mid close against the last trade of the minute", direction: "either way, up to a tick on a wide-tick coin", size: "over S01 to S12: 8 Mar 2026 |gap| median 0.000160 (S01) to 0.012176 (S12) points, p90 0.057110 to 0.069825, largest 0.4367 (S01) to 0.5295 (S12), every largest gap CRV; 24 Sep 2025 median 0.001789 to 0.007006, p90 0.023101 to 0.027312, largest 0.1543 to 0.1887", proof: "J15895, J15896 cc3day, cc3look CRV 22:29 (8 Mar), 04:17 (24 Sep)"}

external_checks:
  - {what: "S01 to S12, S21, S22 recomputed exactly from our C13 S05 (D-1 and D) for every roster coin at 5 minute ends of 3 days", where: "the year's C13 output", status: "VERIFIED: COINC3_STAMPS_V2 ff89f47f8a7bc90d: 15,400 of 15,400 MATCH with the six .cov_off (J15968 log fc827a6c, basic_coinc3 ed2 6d5e7d901dd41071, tests 4da111da 26 of 26); V1 4229faea3f59dc06 10,780 of 10,780 (J15888, ed1 54d8b719) kept"}
  - {what: "every roster coin at every minute end of 2 days against the same on Binance kline closes", where: "Binance 1m klines, <SCRATCH_DISK>/realcheck/outside/binance/klines_1m", status: "VERIFIED with a named gap (J15895, J15896 cc3day, cc3look)"}
  - {what: "the names on our own values: x_btc, x_med less BTC, the strict rank", where: "our values", status: "VERIFIED (J15895, J15896 cc3name; the 3 rank coin-minutes of 24 Sep are ties of the 6-decimal check, the exact ranks equal: BED's J15935)"}
  - {what: "the 14 .quotes_off copies against their settings", where: "the year rows (meaning_twins 74d02bc2)", status: "MEASURED: equal at 92.38 to 99.07% (8 Mar), 88.23 to 98.91% (24 Sep), corr 0.99959 to 1.00000 (J15849 TWINS): copies, an accepted cross-check"}

tools:
  - {what: "recomputed from our C13 S05, the six counts too", run: "python3 -B -m rawcheck.basic_coinc3 --days <D,..> --at <HHMM,..> --out <dir>", where: "team/RAWCHECK/code (basic_coinc3.py ed2 6d5e7d901dd41071, tests 4da111da025f060d 26 of 26; ed1 54d8b719c82c6632 kept)"}
  - {what: "against the kline closes; the names; one coin-minute", run: "python3 -B -m rawcheck.meaning_minute cc3day <D> | cc3name <D> | cc3look <D> <COIN> <HHMM>", where: "team/RAWCHECK/code (meaning_minute.py fe27fa1c60137712 edition 4 for J15895, J15896, tests cf7599c3 17 of 17; edition 5 43c71985848403e5: cc3name labels each x_med line by its own pair, ed. 4 printed 'S01 - S09' on all four, the numbers the same, J15969)"}

used_by: "S07 (x_btc_60) by the coin layer's Q6 block, WITH or AGAINST (no rule written yet); S07 and S22 compared with the record's engine rows (never a source); nobody else (CARD_COIN_C3_V6 'Who reads it today')"


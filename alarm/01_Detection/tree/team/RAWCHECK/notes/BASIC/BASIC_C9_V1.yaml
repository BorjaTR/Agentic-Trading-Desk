group: C9
name: range register (basic, built on the C13 trade candles)
summary: >-
  For each roster coin at a minute end e, over the last W minute ends (W = 60, 120, 240; e - (W - 1) min to e): the highest C13 high and the
  lowest C13 low of the minutes C13 has valued. S01, S08, S15 the width between them in percent of the close at e; S03, S10, S17 where the close
  sits in it (0 the low, 1 the high); S06, S13, S20 and S07, S14, S21 how many minutes ago the high and the low were last set; S22, S25, S28 the
  median pos over the roster coins.
read_as: >-
  The coin's TRADE range over the last 1, 2, 4 hours, as Binance's own 1-minute candles give it: equal to the same formula on the klines within
  1e-9 at 99.75 to 99.76% of coin-minutes on 8 Mar 2026 and 99.41 to 99.52% on 24 Sep 2025 (Spearman 0.999885 to 1.000000; minutes since an
  edge the same at 100% and 99.83 to 99.94%) (J15895, J15896). The rest has two named causes: a window that reads fewer than W minutes where C13
  is empty (the year's flag SHORT_WINDOW; DASH on 24 Sep: C13 empty at 33 of the 60 minutes to 10:41), and a minute whose C13 candle differs
  from the kline's by a late or a boundary trade (MEANING_C13_V4 LIMITS). The market medians S22, S25, S28 equal the kline median at 98.82 to
  99.31% (8 Mar) and 90.42 to 91.32% (24 Sep) of minutes: one middle coin's pos moves them. Computation: 9,285 of 9,285 (C9_STAMPS_V1).

conclude:
  may:
    - "how wide a coin's trade range of the last 60, 120, 240 minutes is in percent of its last price (S01, S08, S15) and where its last price sits in it (S03, S10, S17): equal to Binance's candles within 1e-9 at 99.41 to 99.76% of coin-minutes (J15895, J15896)"
    - "how many minutes ago the window's high and low were last set (S06, S07, S13, S14, S20, S21): the same minute as on the candles at 99.83 to 100%, the LATEST minute that touched the edge (J15895, J15896 c9day, c9name)"
    - "where the typical coin sits in its range (S22, S25, S28, the median): at most 0.0500 from the candle median at every minute of both days (the largest: S28 24 Sep 13:57, ours 0.15 against the kline median 0.20000000000000473; J15895, J15896 c9market, c9mlook)"
  never:
    - "a width, place or age from a window with C13 minutes missing as the full window's: the year flags it SHORT_WINDOW (557 to 1,330 coin-minutes of 24 Sep, equal to the candles at 70.02 to 96.77% only; DASH 10:41: the 21.40 high missed)"
    - "S06, S07, S13, S14, S20, S21 as the FIRST touch of the edge: it is the latest (the klines' earliest and latest edge differ at 20.31 to 29.77% of coin-minutes on 8 Mar, 12.79 to 17.93% on 24 Sep; J15895, J15896 c9name)"
    - "S22, S25, S28 as a mean or as a share of coins near their high: it is the median pos (against the mean pos equal at 0.00% of minutes both days, J15895, J15896 c9name)"
    - "a pos when the window had one price: empty NO_RANGE, never 0.5"

where:
  card: testbed/value_audit/code/L0_y52f12/value_audit/registers/CARD_C9_V4.md 0475da4281e68c35 (rules 1 to 17, O1, O2)
  settings_register: testbed/value_audit/code/L0_y52f12/value_audit/registers/SETTINGS_C9_V1.tsv b6aabe0d8ce8cfc1 (30 settings, 51 metrics)
  built_on_register: "team/RAWCHECK/notes/MEANING/MEANING_C13_V4.yaml fe5df65ba7680fc8 (C13 S01 close, S02 high, S03 low, S04 no trade: raw, LIMITS)"
  layer_list: "team/LAB/notes/RAWCHECK/BASIC_LIST_V2.md (C9 S01, S03, S06 to S08, S10, S13 to S15, S17, S20 to S22, S25, S28 basic); LAYER_REGISTER_V18 b2d8bb81"
  producer: "testbed/value_audit/code/L0_y52f12/value_audit/code/prod_C9_v5.py d8a46ee26caf5f20 (CARD_C9_V4 edition 4; reads C13's built parts of D and D-1)"
  year_output: <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/C9.parquet
  year_output_columns: "name (S01 to S30 and S22 to S30 .coverage: 39 names, J15895, J15896 c9schema), coin (every roster coin; MARKET for S22 to S30), as_of_us (the 1,440 minute ends), value_kind (0 = EMPTY; 1, 4 a decimal; 2 a count), value_f64, value_txt, known_at_us, stale, empty_reason, flags (SHORT_WINDOW:<coin> and others)"
  read_it_with: "team/RAWCHECK/code/rawcheck/meaning_minute.py c9ours(D, names) (value_kind 0 empty, else value_f64; the flag SHORT_WINDOW beside)"

source:
  vendor: "Tardis.dev, Binance USD-M futures trades, through our raw C13 (MEANING_C13_V4)"
  exchange_stream: "trades as Tardis records them, read by C13; C9 reads C13's minute rows, never a stream"
  files: "the year's C13 output of D and D-1 (C13.parquet), the week's roster (the year roster root)"
  columns: "C13 S01 close, S02 high, S03 low, S04 no trade, each with value_kind, value_f64, value_txt, known_at_us, empty_reason, flags"
  fields:
    window: "the W minute ends e - (W - 1) x 60 s to e, D-1's rows for the first W - 1 minutes of D; a minute C13 has empty is skipped, the value flagged SHORT_WINDOW [proof: CARD_C9_V4 rules 1, 2, O1; C9_STAMPS_V1 08f8e198, planted N4, E204 in tests/test_basic_c9.py 6c652c13]"
    width_pos: "width = 100 x (high - low) / close at e; pos = (close - low) / (high - low), NO_RANGE when high = low; exact, rounded once to 12 decimals half up [proof: CARD_C9_V4 rules 3 to 5, 9; C9_STAMPS_V1]"
    since: "minutes since the latest window minute end whose high (low) equals the window high (low) [proof: CARD_C9_V4 rule 8; planted E206; J15895 c9name]"
    median: "the median of the coins' pos with a value [proof: CARD_C9_V4 rule 12; C9_STAMPS_V1 15 of 15]"
  latency: "known_at = the latest known_at of the C13 rows read; C13's close of (e - 60 s, e] received by e (CARD_C9_V4 rule 11; MEANING_C13_V4)"
  silence: "a coin is empty with C13's reason when C13's close at e is empty (24 Sep: 105 coin-minutes THIN_FEED, TRADES_HOLE, J15896 c9schema; 8 Mar: 0)"

reading_rules:
  - "a window reads the minutes C13 has valued; fewer than W: the year flags SHORT_WINDOW:<coin> and the value is of the minutes read (CARD_C9_V4 O1 A)"
  - "the width is in percent of the CLOSE at e (of the low it differs: equal at 0.21 to 1.66% only, J15895, J15896 c9name)"
  - "min since takes the LATEST minute that set the edge"
  - "the market values are medians over the roster coins with a value, with a .coverage count beside (not in this card)"

values:
  units: "S01, S08, S15: percent of the close; S03, S10, S17, S22, S25, S28: 0 to 1; S06, S07, S13, S14, S20, S21: minutes (0 to W - 1)"
  zero: "width 0 = one price in the window; min since 0 = the minute ending at e set the edge; pos 0 = the close is the window low"
  empty: "NO_ROSTER, NO_FILE, TRADES_HOLE, THIN_FEED, BAD_INPUT (C13's), NO_RANGE (pos), ALL_COINS_EMPTY (market); value_kind 0 with NaN. Never read empty as 0"
  stale: "true when empty because a feed went quiet or thin (C13's TRADES_HOLE, THIN_FEED)"
  flags: "SHORT_WINDOW:<coin>, DUPLICATE_ROW, NO_RATE_BASE, BAD_INPUT (CARD_C9_V4 rules 10, 13)"

interpret:
  do:
    - "read S01, S08, S15 and S03, S10, S17 as the candle range and place of the last 1, 2, 4 hours"
    - "check the flags for SHORT_WINDOW before reading a value of a coin with C13 gaps"
  dont:
    - "read a SHORT_WINDOW value as the full window's"
    - "read S06 to S21's minutes as the first touch"
    - "read empty as 0"

biases:
  - {what: "a window that reads fewer than W minutes", direction: "a narrower range: the missing minutes' high or low are not read", size: "24 Sep 2025: 557 (60 min) to 1,330 (240 min) coin-minutes flagged, equal to the candles at 70.02 to 96.77%; DASH 10:41 width 0.234742 against 0.516432", proof: "J15896 c9day (by flag), c9look DASH 10:41, 11:09, 23:30, c9worst S21"}
  - {what: "C13's candle (e - 60 s, e] received by e against the kline's [e - 60 s, e)", direction: "either way, one minute's high, low or close", size: "0.24 to 0.25% of coin-minutes on 8 Mar (no SHORT_WINDOW that day); ETH 22:04 one minute's low 1921.68 against 1921.06; CRV 20:29 the close 0.238 against 0.237", proof: "J15895 c9day, c9look ETH 22:04, CRV 20:29; MEANING_C13_V4"}


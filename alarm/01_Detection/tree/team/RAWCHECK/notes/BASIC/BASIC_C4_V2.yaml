source:
  vendor: "Tardis.dev, Binance USD-M futures, through our raw C13 S05 (the book mid, MEANING_C13_V4)"
  exchange_stream: "bookTicker as Tardis records it (book_ticker), read through prod_reader_book_ticker_v2; the quotes stream beside (.quotes_off) through prod_reader_quotes_v2"
  files: "<ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/book_ticker_<SYM>_<YYYY-MM-DD>.csv.gz of D and D-1 (D-2 only when no row of D-1 is in force at a window's first moment, CARD_C4_V3 rule 5); the week's roster (the year roster root)"
  columns: "exchange, symbol, timestamp, local_timestamp, ask_amount, ask_price, bid_price, bid_amount"
  fields:
    mid: "the mid of the top in force at each whole second e, e - 1 s, ..., e - W (the last good row stamped at or before the second and received by it), exact; known when stamped at most 30 s before, else TOP_HOLE [proof: CARD_C4_V3 rules 1 to 4; C3C4_STAMPS_V1]"
    rv: "r_k = ln(mid(e - (k - 1) s) / mid(e - k s)), k = 1 to W; Q_W = the sum of r_k squared (math.fsum); rv = 100 sqrt(Q_W), rounded once to 6 decimals, half up [proof: CARD_C4_V3 rule 6, O1, O10; C3C4_STAMPS_V1 9 of 9]"
    pace: "S04 = sqrt((Q_300 / 300) / (Q_3600 / 3600)), S05 = sqrt((Q_3600 / 3600) / (Q_86400 / 86400)), S10 = sqrt((Q_1800 / 1800) / (Q_21600 / 21600)) from the unrounded sums; the base sum 0: NO_MOVE [proof: CARD_C4_V3 rules 7, 9, O3; J15864, J15865 c4name: 3.4641 and 4.8990 x the plain quotient]"
  latency: "known_at = the latest arrival among the rows in force at the window's samples (the base's window for a ratio), at most e; max_staleness 30 s (CARD_C4_V3 rule 13)"
  silence: "a top unknown at some sample of the window (a silence over 30 s): TOP_HOLE, stale; 8 Mar 2026 and 24 Sep 2025: 0 empty mains except S04 NO_MOVE at 90 coin-minutes of 8 Mar (S02 = 0); the quotes twins of S03, S05 TOP_HOLE at 572 coin-minutes of 24 Sep (J15864, J15865 c4schema)"

reading_rules:
  - "rv is of the BOOK MID at whole seconds (1 s log returns), not of trades: 300, 3,600 and 86,400 returns for S01, S02, S03 (O1)"
  - "S04, S05, S10 are PACE ratios per second: 1 = the same pace; the plain quotient S01 / S02 is S04 / 3.4641 (.plain_off)"
  - "a ratio with a base sum 0 is empty NO_MOVE, never 0 or 1; a 0 over a base above 0 is 0"
  - "the per-minute metrics S01.step60_off to S05.step60_off and S10.step60_off are C4 metrics (the owner 18 Oct 2026, the ones to use): rule 6 on the samples e, e - 60 s, ..., e - W (W / 60 returns), the ratios of rules 7 and 9 from those sums (CARD_C4_V3 rule 16); their '_off' is the year's name, not a switch"
  - "the year also writes 9 copies as its own cross-check: 6 .quotes_off (the same metric from a second price feed, Tardis quotes) and 3 .plain_off (S04, S05, S10 without the per-second rule, so the metric / 3.4641, 4.8990, 3.4641 at every coin-minute, J15864, J15865 c4name; C4.CB1). ACCEPTED as a cross-check (the owner 18 Oct 2026, BASIC_C1_V5): the quotes copies equal to the metric to 6 decimals at 0 to 46.65% of rows (8 Mar 2026) and 0 to 25.10% (24 Sep 2025), corr 0.9975 to 0.999996, gap p99 0.021 to 0.082, S03 and S05 copies empty at 572 coin-minutes of 24 Sep (J15849 TWINS, J15865 c4schema); not separate metrics"
  - "at a fire the window ends at the fire second (CARD_C4_V3 rule 14); the year holds the 1,440 minute ends"

values:
  units: "S01, S02, S03: percent (100 x the root of a sum of squared log returns); S04, S05, S10: a ratio of paces per second, no unit"
  zero: "rv 0 = the mid did not move at any whole second of the window (the trades may still have closed at the bid and the ask in turn); S04 0 = the last 5 minutes did not move while the hour did"
  empty: "NO_ROSTER, NO_FILE, TOP_HOLE, NO_MOVE; value_kind 0 with NaN in value_f64. Never read empty as 0"
  stale: "1 when empty TOP_HOLE"
  flags: "BAD_ROW:<coin> when a bad row in the window was skipped (CARD_C4_V3 rule 12)"

interpret:
  do:
    - "read S02 and S03 as the coin's hourly and daily mid volatility: they rank coin-minutes as the trade-close rv does (Spearman 0.93959 to 0.98353)"
    - "compare a coin with its own scale (CARD_C4_V3 part 1: S01's middle minute from 0.021 for TRX to 0.477 for NEAR on 17 Sep)"
    - "read S04, S05, S10 around 1: above 1 the short window is faster per second than the long one"
  dont:
    - "read S04 as S01 / S02 (it is 3.4641 times that)"
    - "read S01's or S04's rank among coin-minutes as a 1-minute trade rv's (Spearman 0.81 and 0.66 on 8 Mar 2026)"
    - "read a 0 as no trading on a wide-tick coin"
    - "read empty as 0"

biases:
  - {what: "1 s returns against 60 s returns of the same mid", direction: "either way per coin-minute: ours against our per-minute .step60_off median 1.0565 (S01, 8 Mar) to 0.9043 (S03, 24 Sep)", size: "ranks apart at 5 minutes: Spearman ours vs our per-minute .step60_off S01 0.80876, 0.78304; S04 0.69560, 0.54021; S05 0.90577, 0.86163; S10 0.88325, 0.90481", proof: "J15864, J15865 c4split (the year's .step60_off twin)"}
  - {what: "mid against trade closes at the same 60 s steps", direction: "small: our per-minute .step60_off is 0.9864 to 1.0024 of the kline rv at the median", size: "Spearman 0.95386 (S01, 8 Mar) to 0.99999 (S10, 24 Sep); with the zeros S01 0.88542 on 8 Mar: our 60 s mid unchanged at 1,417 coin-minutes where the trade closes moved", proof: "J15864, J15865 c4split"}
  - {what: "the trade closes bounce between bid and ask while the mid stands", direction: "the kline rv above ours at a still mid", size: "8 Mar 2026: S01 0 with the kline rv above 0 at 986 coin-minutes, S02 at 90; 24 Sep: S01 at 32", proof: "J15864, J15865 c4day (the zeros line)"}


group: C4
name: realized volatility (basic, built on the book mid)
summary: >-
  Per coin, how much its book mid ((best bid + best ask) / 2, Tardis book_ticker) moved over a window ending at e, from the mid at every whole
  second: rv = 100 x the root of the sum of the squared 1 s log returns, over 5 minutes (S01), 1 hour (S02) and 24 hours (S03), in percent; and
  two pace ratios per second of these sums, 5 min against 1 h (S04) and 1 h against 24 h (S05): 1 = the short window moved at the long window's
  pace. S10 is BTC's 30 min against its 6 h, the same way. THE PER-MINUTE METRICS (the year's .step60_off, the ones to use, the owner 18 Oct
  2026): the same six from the mid at whole MINUTES (1-minute log returns: 5, 60, 1,440 of them), as many returns as Binance's 1-minute candles.
  The year also writes copies of the six on Tardis quotes (.quotes_off) and the plain quotient of the two rvs (.plain_off, S04, S05, S10): its
  cross-check, not metrics of their own.
read_as: >-
  The size of the MID's moves at 1 s steps. Against the rv of the same coin's Binance 1-minute kline closes (its trades) at every coin-minute of
  8 Mar 2026 and 24 Sep 2025 (J15864, J15865): S01, S02, S03 are 0.9001 to 1.0114 of it at the median coin-minute, so 'rv' holds; S02 and S03
  rank coin-minutes as it does (Spearman 0.93959 to 0.98353), S01 less (0.81439, 0.78852), because 300 one-second returns and 5 one-minute
  returns are different samples of the same move: our own per-minute .step60_off ranks as the klines do (Spearman 0.95386, 0.98434) and ours against our 60 s
  twin is 0.80876, 0.78304. The ratios are not 'rv5 over rv60': S04 = 3.4641 x S01 / S02 and S05 = 4.8990 x S02 / S03 at every coin-minute
  (the roots of 12 and 24, by the per-second rule): RENAMED to pace ratios; the plain quotient is built beside (.plain_off, C4.CB1). The pace
  ratios rank coin-minutes far from the kline pace ratios (S04 0.65744, 0.52938), again the step: our per-minute .step60_off against the klines 0.93919, 0.97316.

conclude:
  may:
    - "how much a coin's quoted mid moved over the last 5 minutes, 1 hour or 24 hours from its 1-minute returns (S01.step60_off, S02.step60_off, S03.step60_off, the ones to use): 0.9864 to 0.9978 of the trade-close rv at the median coin-minute, ranking coin-minutes as it does (Spearman 0.95386 to 0.99729 on rows above 0; J15864, J15865 c4split)"
    - "whether the last 5 minutes, the last hour or BTC's last 30 minutes moved faster per second than the longer window, from 1-minute returns (S04, S05, S10 .step60_off): 0.9987 to 1.0024 of the kline pace ratio at the median, Spearman 0.93919 to 0.99999 (J15864, J15865 c4split)"
    - "how much a coin's quoted mid moved over the last 5 minutes, 1 hour or 24 hours (S01, S02, S03), in percent: 0.9001 to 1.0114 of the rv of its 1-minute trade closes at the median coin-minute (J15864, J15865)"
    - "that one coin-hour or coin-day moved more than another (S02, S03 rank coin-minutes as the trade-close rv does: Spearman 0.93959 to 0.98353, rows with both above 0; with the zeros 0.93681 to 0.98353)"
    - "whether the last 5 minutes (S04), the last hour (S05) or BTC's last 30 minutes (S10) moved faster or slower per second than the longer window: above 1 faster, below 1 slower, 1 the same pace"
  never:
    - "S04, S05 or S10 as rv5 / rv60, rv60 / rv24h or rv30 / rv6h: they are per second, the plain quotient times the root of 12, 24 and 12 (J15864, J15865 c4name); the plain quotient is .plain_off"
    - "that S01 ranks coin-minutes as a 1-minute trade rv would: Spearman 0.81439 (8 Mar 2026), 0.78852 (24 Sep 2025); 300 one-second returns against 5 one-minute ones (J15864, J15865 c4split)"
    - "S04 as the pace ratio a 1-minute trade rv would give: Spearman 0.65744 and 0.52938 against the kline pace ratio (the same step: our per-minute .step60_off 0.93919, 0.97316)"
    - "that a coin did not trade when its S01 or S02 is 0: the mid can stand still while trades close at the bid and the ask in turn (8 Mar 2026: S01 0 with the kline rv above 0 at 986 coin-minutes, S02 at 90, J15864)"
    - "a copy (.quotes_off, .plain_off) as a metric of its own: it is the year's cross-check of the same metric; read the twelve metrics"
    - "that a per-minute rv or pace ratio of 0 (S01.step60_off, S02.step60_off, S04.step60_off, S05.step60_off) means no trading: the mid stood still at the minute ends while the trade closes moved, at 1,417 (S01.step60_off), 1,333 (S04.step60_off) and 100 (S02.step60_off, S05.step60_off: CRV, the 61 minute ends of the hour) coin-minutes of 8 Mar 2026 (J15864 c4split; CRV by BED's J15902)"


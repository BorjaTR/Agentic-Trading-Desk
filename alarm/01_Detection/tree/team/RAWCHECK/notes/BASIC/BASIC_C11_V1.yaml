  - {what: "every roster coin at every minute end of 2 days against the same formulas on Binance 1m klines (the day's klines and the prior day's 1,440, the one ending 00:00 of D-1 from D-2's file)", where: "Binance 1m klines, <SCRATCH_DISK>/realcheck/outside/binance/klines_1m", status: "VERIFIED (J15895, J15896 c11day: all 1,440 prior klines for 52 and 51 coins)"}
  - {what: "the names: S01, S02 never negative; S05 its rule; S08 against 'outside now'", where: "our values", status: "VERIFIED (J15895, J15896 c11name)"}

tools:
  - {what: "recomputed from our C13", run: "python3 -B -m rawcheck.basic_c11 --days <D,..> --at <HHMM,..> --out <dir>", where: "team/RAWCHECK/code (basic_c11.py ba92c46e38a6712d)"}
  - {what: "against the klines; the names", run: "python3 -B -m rawcheck.meaning_minute c11day <D> | c11name <D> | c11schema <D>", where: "team/RAWCHECK/code (meaning_minute.py fe27fa1c60137712 edition 4, tests cf7599c3 17 of 17)"}


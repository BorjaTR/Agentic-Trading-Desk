settings:
  - {id: D2.S02, name: "size-weighted mid's distance from the mid, bps", renamed_from: "micro_dev_bps", layer: basic, side: none, window: "the row in force at e (seen within 30 s)", clock: minute end, scope: coin, contracts: USDT,
     aggregate: "(wmid - mid) / mid x 10,000 = half the spread in bps x (qb - qa) / (qb + qa)", aliases: "EF.ef_micro_dev (the old name)",
     derived_from: "D2 S01 (the size-weighted mid) and the top's mid; equal to half the coin's spread times the top's size imbalance",
     means: "how far the size-weighted mid sits from the mid, in bps: + when more of the coin rests at the best bid (qb above qa); at most half the spread",
     computation: {status: RELIABLE, proof: "BOOK_STAMPS_V1 658b774f: 221,805 of 221,805 MATCH (every coin-minute of 3 days against the book base, 15 a day from the Tardis rows; J15905 to J15908)"},
     meaning: {status: DEFINED_WITH_OPEN, proof: "J15947, J15948 d2: |S02| within half the spread at 74,880 and 73,440 of 74,880 and 73,440; S02 / (spread / 2) against S03 corr 0.999999, |gap| p99 3.07e-03 and 5.52e-03 (the largest on BTC, where a 0.0147 bps spread leaves S02 a 4-decimal step of 0.0136 in the imbalance); the lean: to S02's side 62.81% and 62.35%; RENAMED (Stoikov S1: not the micro-price)"},

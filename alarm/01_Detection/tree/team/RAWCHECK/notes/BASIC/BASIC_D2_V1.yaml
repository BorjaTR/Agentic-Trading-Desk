# BASIC_D2_V1.yaml: the card of D2 top_of_book's basic settings S02, S03, S04 and the coverage S04.coverage (BED, 2026-10-18; BR5 book part,
# the owner in BED's chat 14:3xZ: 'then you can take these cards ... part of EDGE1 packages'; EDGE1 14:33:59Z: yes). D2 S01 (raw) stays in
# MEANING_D2D3_V2 (renamed there: size-weighted mid); S05 spread_z is our rule (not here). Made the way BASIC_C8_V3 was (METRIC_REVIEW_METHOD_V1
# section 5; the rename rule; conclude). ONE SOURCE OF TRUTH; rawcheck/meaning_register.py edition 5 checks it. The year's copies
# S02.quotes_off, S03.quotes_off, S04.quotes_off are no rows of their own (the owner's copies rule, BASIC_C1_V5): one reading rule with their
# J15849 shares and one never line.
# Edit 2 (BED, 18 Oct 2026, before landing; EDGE1 15:38:05Z): the copies' never line names their p99 gaps (the moments the two streams'
# tops differ, J15849 TWINS); nothing else changed.
# Edit 1 (BED, 18 Oct 2026, before landing): EDGE2's REVIEW BR5 book (hb/EDGE2.txt 15:33:58Z): (1) S02's means: 'more of the coin rests at
# the best bid (qb above qa)', not 'more coins' (a roster coin elsewhere). Nothing else changed.

group: D2
name: top of the book, basic (the weighted mid's distance, the top's dollar imbalance, the median coin's spread)
summary: >-
  From the bookTicker row in force at e (the last row stamped and received by e, seen within 30 s): S02 = the size-weighted mid (D2 S01)
  less the mid, over the mid, in basis points (4 decimals); S03 = the dollars at the best bid less the dollars at the best ask over their
  sum (6 decimals); S04 = the spread (ask - bid) / mid in basis points of the median roster coin (4 decimals), with S04.coverage the coins
  counted. Every value exact, rounded once.
read_as: >-
  S02 is the top's size imbalance times half the spread, nothing more: S02 / (half the coin's spread) equals the size imbalance, against
  S03 corr 0.999999 on both days, and |S02| never passes half the spread (74,880 and 73,440 coin-minutes, J15947, J15948). Its old name
  micro_dev says Stoikov's micro-price: RENAMED, as D2 S01 was (MEANING_D2D3_V2). S03 is the TOP level only: against D3's 5-level imbalance
  Spearman 0.55676 and 0.60937, against the 25 levels 0.20759 and 0.22658: its old name ob_imb (order-book imbalance) is RENAMED. The card's
  claim that the top leans (more on the bid, the next move up) holds as a lean, not a forecast: the next change of the mid goes to S03's side
  at 62.80% and 62.34% of coin-minutes, 74.14% and 73.24% when |S03| is 0.8 or more, 52.20% and 51.65% below 0.2 (J15947, J15948, the mid
  from BED's book base MID_1S). S04 is mostly the price step: 98.94% and 97.03% of coin spreads are one step (the smallest spread of the
  coin's day), and S04 is 1.0000 and 1.0172 times the median coin's step at the median minute (J15947, J15948 spread). Recomputed it equals
  ours at every value checked (BOOK_STAMPS_V1).

conclude:
  may:
    - "which side has more dollars resting at the best bid and ask now (S03), and that the next move of the mid went to that side at 62.80% (8 Mar 2026) and 62.34% (24 Sep 2025) of coin-minutes, 74.14% and 73.24% at |S03| 0.8 or more (J15947, J15948 lean)"
    - "how far the size-weighted mid sits from the mid (S02), in bps: half the coin's spread times the top's size imbalance (J15947, J15948 d2)"
    - "the median coin's spread now (S04), in bps, against the same day's minutes: it stays at the median coin's price step most of the day (1.0000 and 1.0172 times it at the median minute, J15947, J15948 spread) and rises when coins widen (max 4.7511 and 2.0578 bps)"
  never:
    - "a forecast of the next price from S02 or S03: the next mid change goes the other way at 37.20% and 37.66% of coin-minutes (J15947, J15948)"
    - "S02 as a micro-price signal: it is S03's size imbalance times half the spread (corr 0.999999), so across coins it mostly measures the spread (D2.CB2 is the micro-price's distance)"
    - "S03 as the order book's imbalance: it is the best bid and ask only; the 25 levels rank otherwise (Spearman 0.20759, 0.22658 against D3 S02, J15947, J15948)"
    - "S04 as market liquidity on its own: 98.94% and 97.03% of the coin spreads are one price step (J15947, J15948 spread), so S04 moves with the median coin's step and its price"
    - "a copy (S02.quotes_off, S03.quotes_off, S04.quotes_off) as a metric of its own: it is the year's cross-check of the same state on the depth stream; read S02, S03, S04. Where a copy differs, the two streams' tops differ at that moment: gap p99 0.4229 to 0.4855 bps (S02), 0.5201 to 0.7902 share points (S03), 0.0769 to 0.1090 bps (S04) (J15849 TWINS; a copy by EDGE1's rule 15:38:05Z: the same state from a coarser stream)"

where:
  card: testbed/value_audit/code/L0_y52f12/value_audit/registers/CARD_D2_V3.md 80f0a6d271bf5610 (rules 1 to 17; edge cases E1 to E44)
  settings_register: testbed/value_audit/code/L0_y52f12/value_audit/registers/SETTINGS_D2_V1.tsv 64d5823a95e5e801
  built_on_register: "team/RAWCHECK/notes/MEANING/MEANING_D2D3_V2.yaml f33f6ba098035767 (the book_ticker top and D2 S01: raw, RELIABLE by RAW_STAMPS_V1, LIMITS: the two Binance channels disagree on sizes in some seconds)"
  layer_list: "team/RAWCHECK/notes/RAWCHECK/LAYER_REGISTER_V21.tsv f989d276e0eb0e20 (D2 S02, S03, S04 basic, NOT_CHECKED before this card)"
  producer: "testbed/value_audit/code prod_D2_v2.py c497655d54510ff0 (CARD_D2_V3 edition 3), driver work_CLK/drivers/drive_l0b_D2_v2_day.py eb03cb25d0e0e0cc"
  year_output: <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/D2.parquet
  year_output_columns: "name (12 names: S01 to S05, the quotes copies of S01 to S05, S04.coverage, S05.coverage; J15947 schema), coin (every roster coin for S01 to S03; MARKET for S04, S05), as_of_us (the 1,440 minute ends), value_kind (0 = EMPTY; 1, 4 a value: kind 4 also in value_txt), value_f64, value_txt, known_at_us, stale, empty_reason, flags"
  read_it_with: "team/RAWCHECK/code/rawcheck/basic_book.py year_frame(D, 'D2', names) or ours.at(D, 'D2', settings, coins, moments)"

source:
  vendor: "Tardis.dev, binance-futures (Binance USDT-margined perpetuals)"
  exchange_stream: "bookTicker (the best bid and ask, pushed on any change); the copies: quotes, the top Tardis rebuilds from the depth stream"
  files: "<ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/book_ticker_<SYM>_<YYYY-MM-DD>.csv.gz of D (and D-1 when e - 30 s is before 00:00)"
  columns: "exchange, symbol, timestamp, local_timestamp, ask_amount, ask_price, bid_price, bid_amount"
  fields:
    in_force: "the last row in file order stamped at or before e and received by e; seen when a row is stamped in [e - 30 s, e] and received by e, else BOOK_HOLE; a bad row in force: BAD_INPUT [proof: CARD_D2_V3 rules 2 to 6, E2 to E6, E13 to E15; basic_book tests D2 E2, E4 to E6, E13 to E15]"
    S02: "(wmid - mid) / mid x 10,000, wmid = (Pa qb + Pb qa) / (qb + qa), mid = (Pa + Pb) / 2; by algebra = (half the spread in bps) x (qb - qa) / (qb + qa) [proof: rule 8, E27 to E29; J15947, J15948 d2]"
    S03: "(Pb qb - Pa qa) / (Pb qb + Pa qa), the dollars at each level's own price [proof: rule 9, O3 A, E27, E30; basic_book tests]"
    S04: "the median over the roster coins with a value of (Pa - Pb) / mid x 10,000 (the mean of the two middle ones for an even count); S04.coverage the coins counted [proof: rule 11, E15, E31 to E34; basic_book tests D2 E15, E31 to E33]"
  latency: "book_ticker rows arrive 2.2 to 3.5 ms after their stamp at the median, p99 5.4 to 161.7 ms; the row in force at a minute end is 30 to 178 ms old at the median (MEANING_D2D3_V2, job 15783)"
  silence: "a coin silent over 30 s: BOOK_HOLE; none on 8 Mar 2026 and 24 Sep 2025 (J15947, J15948 schema: 0 empty)"

reading_rules:
  - "S02 and S03 read the best bid and ask ONLY (level 0 of Binance's bookTicker); D3 S02, S03 read 25 and 5 levels of the depth-stream book"
  - "S02 = half the coin's spread x the top's size imbalance: at a 1-step spread it is a fraction of the step (half the spread at the median coin-minute 0.8899 bps on 8 Mar 2026, 0.4100 on 24 Sep 2025, J15947, J15948)"
  - "S04 is the median COIN's spread, not a dollar-weighted market spread; on a 1-step book it is that coin's step over its price"
  - "the year also writes S02.quotes_off, S03.quotes_off, S04.quotes_off (the same rules on Tardis's quotes stream, the top of Binance's depth stream). ACCEPTED as the year's cross-check (the owner 18 Oct 2026, BASIC_C1_V5): equal to the main at 83.26%, 81.82%, 93.82% of values on 8 Mar 2026 and 78.85%, 76.11%, 80.90% on 24 Sep 2025, corr 0.9862 to 0.9960 (S02), 0.9689 to 0.9816 (S03), 0.8596 to 0.9427 (S04), gap p99 0.4229 to 0.4855 bps (S02), 0.5201 to 0.7902 (S03), 0.0769 to 0.1090 bps (S04) (J15849 TWINS); not separate metrics"
  - "S04.coverage is a count (the coins in the median), not a copy"

values:
  units: "S02, S04: basis points of the mid; S03: a share from -1 to +1"
  zero: "S02, S03 0: equal sizes (S02) or equal dollars (S03) at the best bid and ask; S04 never 0 (a spread is at least one step)"
  empty: "NO_ROSTER, NO_FILE, BOOK_HOLE, BAD_INPUT, ALL_COINS_EMPTY; none on 8 Mar 2026 and 24 Sep 2025 (J15947, J15948 schema)"
  stale: "true exactly when empty BOOK_HOLE (a market value: every coin BOOK_HOLE)"
  flags: "BAD_INPUT:<coin> on S04 when a coin is left out by a bad row"

interpret:
  do:
    - "read S03 as the queue at the top leaning: the larger |S03|, the more often the next mid change goes its way (52.20%, 59.51%, 65.58%, 74.14% for |S03| below 0.2, 0.2 to 0.5, 0.5 to 0.8, 0.8 or more on 8 Mar 2026, J15947)"
    - "read S04 against its own day: a rise above the median coin's step is the median coin's book widening (8 Mar 2026 from 1.6987 to 4.7511 bps, J15947 spread)"
  dont:
    - "add S02 to S03 as two signals: S02 is S03's sizes times half the spread"
    - "compare S04 across days without the median coin's step: the step was 1.7584 bps (8 Mar 2026) and 0.8054 bps (24 Sep 2025) at the median minute (J15947, J15948)"

biases:
  - {what: "one level of the book", direction: "either way", size: "S03 against D3's 5 levels Spearman 0.55676, 0.60937 (the same sign 70.27%, 71.54%), against the 25 levels 0.20759, 0.22658", proof: "J15947, J15948 d2"}
  - {what: "the price step", direction: "S04 floored at the median coin's step", size: "one-step spreads 98.94% and 97.03% of coin-minutes; S04 over the median step 1.0000 and 1.0172 at the median minute, p90 1.0476 and 1.1004", proof: "J15947, J15948 spread (the step inferred as the coin's smallest positive spread of the day)"}
  - {what: "Binance's two top-of-book channels", direction: "either way", size: "the depth-stream copy equal at 76.11% to 93.82% of values", proof: "J15849 TWINS; MEANING_D2D3_V2"}

external_checks:
  - {what: "S02, S03, S04 at every coin-minute of 8 Mar 2026, 24 Sep 2025, 4 Nov 2025 against BED's book base (int_recompute_book B3, exact) and at 5 minute ends x BTC, AVAX, ENA (S04 from every coin) from the Tardis rows by basic_book's own text-exact reader", where: "Tardis book_ticker (recompute, our source)", status: "VERIFIED: BOOK_STAMPS_V1 658b774f: S02 221,805, S03 221,805, S04 4,335 of the same MATCH (J15905 to J15908)"}
  - {what: "the card's 'lean': the sign of S03 (S02) against the next change of the mid within 60 s", where: "BED's book base MID_1S (the mid every second; the future of the same feed, not the input at e)", status: "MEASURED: to S03's side at 62.80% and 62.34% of the coin-minutes with a move; 74.14% and 73.24% at |S03| 0.8 or more (J15947, J15948)"}
  - {what: "the names: S02 against half the spread times the size imbalance; S03 against the book's 5 and 25 levels", where: "BED's book base spread (exact), the year's D3", status: "S02 = half spread x size imbalance (corr 0.999999, |S02| within half the spread at 100%): RENAMED; S03 the top only: RENAMED (J15947, J15948)"}
  - {what: "the spread in price steps", where: "BED's book base spread and mid", status: "MEASURED: one step at 98.94% and 97.03% of coin-minutes (XMR on 24 Sep at 49%) (J15947, J15948 spread)"}
  - {what: "an outside top of book", where: "none held (Binance publishes no bookTicker history we hold, MEANING_D2D3_V2)", status: "NOT_AVAILABLE: the depth-stream copy only (J15849)"}

tools:
  - {what: "S02, S03, S04 against the book base at every coin-minute and the Tardis rows at named minute ends", run: "python3 -B -m rawcheck.basic_book base --days <D> --out <dir>; python3 -B -m rawcheck.basic_book tardis --days <D> --coins <C,..> --at <HHMM,..> --out <dir>", where: "team/RAWCHECK/code (basic_book.py ed1 6160e36b31871abd, tests 12d16de820854eaf: 47 of 47 with 10 mutants)"}
  - {what: "the names and the lean (d2), the spread in steps (spread), the coverage (cover)", run: "python3 -B -m rawcheck.meaning_bookbasic d2 <D> | spread <D> | cover <D>", where: "team/RAWCHECK/code (meaning_bookbasic.py ed1 576eb0a93b123ff9 for J15947, J15948; ed3 a1b2b25e07ad972a adds cover; tests a741c4980ea5cb58: 6 of 6, 7 mutants)"}


  status: 'VERIFIED: gap at most 1.8 bp, same sign 100% (J15801, J15802)'
- what: market medians S22 to S24
  where: the median of the roster coins' kline returns
  status: 'VERIFIED: gap median 0.5 to 0.6 bp, max 7.3 bp, same sign 99.9 to 100% (J15800)'
- what: CRV's 44 bp gap
  where: our trade candle and mid (C13) against the kline close, 22:20 to 22:26 on 8 Mar 2026
  status: 'EXPLAINED: the kline close is a trade at bid or ask, 21.7 bp each side of a still mid (J15801 look)'
- what: every one of the 31 twins against its main, every row of 2 days
  where: the year rows (meaning_twins 74d02bc2)
  status: 'MEASURED: J15849 (TWINS_<D>.tsv): quotes twins equal 92 to 99%, corr 0.99 or more; strict twins equal 100% (coverage full); coverage the full roster'
- what: 26 twins and 20 mains recomputed from the year's own C13 mids (bookTicker and quotes)
  where: our C13 rows (meaning_twins_c1 50f8b07b)
  status: 'VERIFIED: J15855: 100% within 6 decimals both days; S01, S02, S08, S09, S14 .quotes_off not recomputed (start mid not at a minute end)'

  where: team/LAB/code
- what: 'short returns: empties, zeros, row ages; zeros against tick size'
  run: python3 -B -m rawcheck.meaning_returns short <D> | tick <D>
  where: team/LAB/code
- what: 'one coin around one minute: trade candle, mid, kline close'
  run: python3 -B -m rawcheck.meaning_returns look <D> <COIN> <HHMM>
  where: team/LAB/code
- what: module versions of this edition

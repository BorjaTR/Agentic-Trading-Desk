conclude:
  may:
  - 'how far the coin''s mid moved over the window (S03 to S14 agree with Binance candles: median gap 0.01 to 0.21 bp, same sign 99.6 to 100%)'
  - BTC's own move over the window, whatever the coin (S15 to S21)
  - how the typical coin moved (S22 to S24, the median)
  - that a C1 setting with a minute-end window is exactly the return of our C13 mids (J15855, every coin-minute of 2 days)
  never:
  - 'a 0 short return (5 s to 30 s) as ''nothing traded'': the top of the book stood still; trades can print inside an unchanged top'
  - 'short returns compared across coins without their tick: a wide-tick coin is 0 most of the time (CRV 99%)'
  - 'that S08 and S09 are slopes, that S15 says BTC leads the coin, or that S22 to S24 are a trend: they are returns (renamed)'
  - 'that a candle''s last-trade return equals ours: the gap is the last trade bouncing between bid and ask (p90 2 to 6 bp, up to 44 bp on CRV)'
  - a return from an EMPTY value, or 0
  - 'a copy (.quotes_off, .strict_off) as a metric of its own: it is the year''s cross-check of the same metric; read the 25 metrics and the 3 coin counts'

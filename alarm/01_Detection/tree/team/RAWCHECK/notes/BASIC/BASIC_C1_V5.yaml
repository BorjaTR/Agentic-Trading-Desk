# BASIC_C1_V5.yaml: the card of the basic group C1 price returns, EDITION 5, CLOSED (EDGE1, 2026-10-18, with the owner 15:5x Berlin: "So it computes
# what it should and means what it should. Period. Closed.") = BASIC_C1_V4 (cf8ea425f4816f2c, kept) with the 28 copies (.quotes_off, .strict_off) read as
# the year's accepted cross-check (the owner: "those are copies to check that they match ... differ sometimes ... we should just accept it").
group: C1
name: price returns (basic, built on the book mid)
summary: 'How far a price moved over a window W ending at e, in percent (S08, S09 in basis points, S25 as a fraction): (mid(e) / mid(e - W) - 1), the mid being Binance''s own top of
  book (best bid + best ask) / 2. Per coin (S01 to S14, S25), for BTC whatever the coin (S15 to S21) and for the market as the median coin (S22 to S24); windows 5 s to 24 h, and since
  00:00 UTC (S07, S21).'
read_as: 'The coin''s price change over the window, measured on the mid, not on the last trade. It tells the same story as Binance''s own candles: 0.01 to 0.3 bp apart at the median,
  the same sign in 99.6 to 100% of coin-minutes. Where they differ (up to 44 bp) the mid is the steadier number: on a coin whose price step is wide (CRV: tick 0.001 at a price of 0.23
  = 43 bp) the last trade jumps between bid and ask while the mid stands still. A short return (5 s, 10 s) of exactly 0 means the top of the book did not move: 19 to 99% of the time
  depending on the coin''s tick.'
where:
  card: testbed/value_audit/registers/CARD_C1_V11.md (16 rules; the year's copy in code/L0_y52f12/value_audit/registers)
  settings_register: testbed/value_audit/registers/SETTINGS_C1_V3.tsv (25 settings)
  built_on_register: team/RAWCHECK/notes/MEANING/MEANING_C13_V4.yaml (C13 S05 the bookTicker mid and S05.quotes_off the quotes mid, raw, RELIABLE)
  layer_list: team/LAB/notes/RAWCHECK/BASIC_LIST_V2.md (C1, 25 basic settings)
  producer: testbed/value_audit/code/prod_C1_v2.py (edition 7 rules) through prod_reader_book_ticker_v2.py
  year_output: <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/C1.parquet
  year_output_columns: name (S01 to S25 and twins), coin (or MARKET for S22 to S24; BTC rows for S15 to S21), as_of_us (e), value_kind (0 = EMPTY, NaN in value_f64), value_f64, known_at_us
    (the later arrival of the two book rows), stale, empty_reason, flags
  read_it_with: team/LAB/code/rawcheck/ours.py at(D, 'C1', settings, coins, moments)
source:
  vendor: 'none new: built on our raw C13 S05 (the mid of Binance''s bookTicker through Tardis), MEANING_C13_V3'
  exchange_stream: book_ticker (Binance's own top of book, every change of the best bid or ask), quotes beside switched off
  files: <ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/book_ticker_<SYM>_<YYYY-MM-DD>.csv.gz (D, and D-1 for windows starting before 00:00)
  columns: the reader's best bid price and amount, best ask price and amount, timestamp, local_timestamp
  fields:
    mid: '(best bid + best ask) / 2 of the book row standing at the moment: the last good row stamped at or before it and received by it [proof: CARD_C1_V11 rules 1, 2; MEANING_C13_V3
      S05]'
    known: 'a mid is known when its row was stamped at most 30 s before the moment; otherwise BOOK_HOLE, never carried across a feed hole [proof: CARD_C1_V11 rule 4]'
    return: '(mid(e) / mid(e - W) - 1) x 100 percent, x 10,000 bp (S08, S09), x 1 fraction (S25); exact, rounded once [proof: CARD_C1_V11 rules 6, 8, 16]'
    day_window: 'S07 and S21 start at 00:00:00 UTC of e''s day; S14 at e - 86,400 s [proof: CARD_C1_V11 rule 3]'
    market: 'S22 to S24: the median of the roster coins'' exact returns, coverage beside [proof: CARD_C1_V11 rule 9]'
  latency: known_at = the later arrival of the two book rows; the newest row is 0.09 to 0.17 s old at the median, p99 2.0 to 2.7 s, at a minute end (J15800, J15801)
  silence: a book row older than 30 s at s or e makes the value empty BOOK_HOLE (rule 4); none on 24 Sep 2025 or 8 Mar 2026 for S01, S02, S08, S09 (J15800, J15801)
reading_rules:
- the mid at a moment = the book row standing then, at most 30 s old (rules 1, 2, 4)
- return over W ending at e = mid(e) / mid(e - W) - 1; both mids known, else empty with the first reason of NO_FILE, BOOK_HOLE (rules 5, 6, 7)
- 'fire-second settings (S01 to S07, S15, S22 to S25): at a fire the window ends at the fire second; minute-end settings give the last full minute (rule 12)'
- 'market: median of the roster coins with a value, never a mean (rule 9)'
- 'S22.coverage, S23.coverage, S24.coverage count the roster coins the middle coin of S22, S23, S24 is picked from. The year also writes 28 copies of the same metrics as its own cross-check:
  25 .quotes_off (the same change from a second price feed, Tardis quotes) and 3 .strict_off (S22 to S24 only when every roster coin has a value). ACCEPTED as a cross-check (the owner
  18 Oct 2026): equal to the metric at 92 to 98% of rows, otherwise a small gap from the two feeds disagreeing (J15849; BTC 8 Mar 07:08: the second feed 10 usd higher a minute before,
  -0.0157% against -0.0007%, J15878); not separate metrics. The year writes no .fire_second_off or .engine_off twin.'
values:
  units: percent (S01 to S07, S10 to S24), basis points (S08, S09), fraction (S25)
  zero: 'the top of the book stood still over the window (5 s: 19 to 99% of the time per coin, by tick size)'
  empty: NO_ROSTER, NO_FILE, BOOK_HOLE, ALL_COINS_EMPTY (market); value_kind 0 with NaN in value_f64. Never read empty as 0
  stale: 1 with BOOK_HOLE
  flags: the reader's (DUPLICATE_ROW, BAD_INPUT)
interpret:
  do:
  - read the sign as direction and the size as the move of the mid over the window
  - compare across coins with the market median (S22 to S24) or BTC's (S15 to S21)
  - on a wide-tick coin read a short return in whole ticks (CRV moves in 43 bp steps of the price, half of that for the mid)
  dont:
  - read a short return of 0 as 'nothing happened in trading'; trades can print inside an unchanged top
  - compare a coin's 5 s or 10 s return across coins without its tick (rank correlation 0.835 between zero share and step size)
  - expect it to equal a candle return from the last trade; the gap is the trade bouncing between bid and ask (p90 2 to 6 bp, up to 44 bp on CRV)
biases:
- what: mid against last trade
  direction: either way
  size: median 0.01 to 0.3 bp; p90 2.3 to 6.9 bp; p99 5 to 43 bp (CRV); BTC at most 1.8 bp
  proof: J15800 (8 Mar 2026), J15801 (24 Sep 2025), every coin-minute
- what: tick size on short windows
  direction: toward exact 0
  size: 'S01 exactly 0: 37.6% (24 Sep 2025), 59.4% (8 Mar 2026); per coin 1% (ASTER) to 99% (CRV)'
  proof: J15800, J15801 short and tick

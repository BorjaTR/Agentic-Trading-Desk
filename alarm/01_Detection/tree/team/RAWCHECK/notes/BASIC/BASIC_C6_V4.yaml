# Layer of every setting here: basic (a return, ratio, position or time on BTC's whole-second mids; a ratio of two C7 dials). S03, S04
# (robust z), S08 (persistence in a tenth), S09 to S12 (floors) are our rules, their twins with them: not in this card.

group: C6
name: market motion, BTC over 6 hours and the market's heat (basic, built on the book mid and C7)
summary: >-
  Four numbers about BTC's mid over the 6 hours ending at a minute end e, from whole-second samples of the mid of the top of book: S01
  the 30 minute log return in units of the 6 hour realised volatility scaled to 30 minutes; S02 S01 now less S01 30 minutes before; S05
  where the mid sits inside its 6 hour high-low range (0 at the low, 1 at the high); S06 the minutes since the last whole second at the 6
  hour low, and its twin S06.first_off from the first one. S07 (heat) is the market's 15 minute dial over its 2 hour dial (C7 S04 over
  C7 S07): the typical coin's last 15 minute mid range against its 2 hour one.
read_as: >-
  How far BTC has run and where it sits in its 6 hour range. S05 and S06 equal the same rules on Binance's 1 minute klines but where a
  trade printed below (or above) every whole-second mid (8 Mar 04:48: a trade low 81 USD under the mids' low); S01 tracks the same z on
  minute closes (corr 0.996 and 0.998) but is larger: BTC's 1 second mid moves run on (the 6 h volatility read from 1 s mids is 0.74 to
  0.86 of the one read from 1 minute closes). Two names said something else and are renamed: S01 is no velocity (a move per time) but a
  return over a volatility, S02 is the change of that z, not an acceleration. S07 heat follows the same ratio of the median Binance kline
  ranges (corr 0.996 and 0.995), a few percent lower on mids; a random walk gives about 0.35, the median minute 0.31 (8 Mar) and 0.35.

conclude:
  may:
    - "how far BTC moved over 30 minutes measured in its own 6 hour volatility (S01), and whether that grew (S02)"
    - "where BTC's mid sits in its 6 hour range (S05) and how long ago it stood at its low (S06, S06.first_off)"
    - "whether the market's last 15 minutes were wide against its last 2 hours (S07): near 1 the last 15 minutes spanned the 2 hour range, about 0.35 is what a random walk gives"
  never:
    - "BTC's speed in points per minute from S01: it is a z; the same 30 minute move gives a larger S01 on a calm day"
    - "that BTC is stretched because S01 passes a floor set on minute data: S01 runs 1.16 to 1.34 times a minute-sampled z (J15833 c6name)"
    - "that BTC traded at its 6 h low or high from S05 = 0 or 1, nor that no trade went beyond: the extremes are whole-second mids; a trade printed 81 USD under them on 8 Mar 2026 04:48 (J15833 why6)"
    - "that the market traded over a range that wide from S07: it is a ratio of two mid dials, each below the trade range (C7's never)"
    - "S07 as a level of 0 to 1 when the dials count different coins: it can pass 1 (CARD_C6_V5 N7: 2.5, the 2 h dial over ETH alone)"
    - "a copy (.quotes_off) as a metric of its own: it is the year's cross-check of the same metric on a second price feed; read the six metrics"
    - "anything from S03, S04, S08 to S12 or their twins (our rules: not in this card)"


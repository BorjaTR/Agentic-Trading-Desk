  read_it_with: team/RAWCHECK/code/rawcheck/ours.py at(D, 'C6', settings, ['BTC'], moments)

source:
  vendor: "Binance USD-M futures through Tardis"
  exchange_stream: "book_ticker (best bid and ask), BTCUSDT; the quotes stream (Tardis quotes, the top rebuilt from the depth stream) beside: written as .quotes_off copies, the year's cross-check"
  files: <ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/book_ticker_BTCUSDT_<YYYY-MM-DD>.csv.gz (D and D-1)
  columns: "the top in force at each whole second e - W s to e (C4 rules 1 to 5): its mid = (bid + ask) / 2, exact; W 21,600 s (S01, S05, S06), 23,400 s (S02)"
  fields:
    samples: "every whole second of the window must have a known top, else empty TOP_HOLE (a missing file NO_FILE first) [proof: CARD_C6_V5 rule 1; basic_c6 tests T8, T9]"
    s01: "ln(mid(e) / mid(e - 1,800 s)) / sqrt(Q x 1,800 / 21,600), Q the math.fsum of the 21,600 squared 1 s log returns ending at e; Q 0: NO_MOVE [proof: CARD_C6_V5 rules 2, 3; C6_STAMPS_V1 15 of 15]"
    s02: "S01 at e less S01 at e - 1,800 s [proof: CARD_C6_V5 rule 4; C6_STAMPS_V1 15 of 15]"
    s05: "(mid(e) - low) / (high - low) over the 21,601 samples, exact; high = low: NO_MOVE [proof: CARD_C6_V5 rule 7; C6_STAMPS_V1 15 of 15]"
    s06: "(e - tau*) / 60 s, tau* the last sample at the low; first_off the first [proof: CARD_C6_V5 rules 8, 17; C6_STAMPS_V1 15 of 15 each]"
    s07: "C7 S04 (dial_15m) over C7 S07 (dial_2h) of the same minute end, the exact quotient of the two written decimals, 6 decimals; d2h 0: NO_MOVE; either empty: empty with its reason [proof: CARD_C6_V5 rule 10; C6_STAMPS_V1 15 of 15]"
  latency: "known_at = the latest arrival among the rows in force at the samples (CARD_C6_V5 rule 14), at most e; the 30 s known rule of C4 (the card's words: known_at not checked here, open)"

reading_rules:
  - "the year also writes 8 copies of S01 to S08 on a second price feed (.quotes_off, Tardis quotes); 5 belong to this card's settings (S01, S02, S05, S06, S07). ACCEPTED as a cross-check (the owner 18 Oct 2026, BASIC_C1_V5): S01, S02 (z values) never equal to 6 decimals but corr 0.99998 to 0.99999, gap p99 0.025 to 0.050; S05 equal at 73.06% (8 Mar 2026) and 73.75% (24 Sep 2025), S06 at 99.51% and 95.97% (once 77.8 minutes apart on 8 Mar: the quotes put the 6 h low at another second), S07 at 50.49% and 85.97% (gap p99 0.009 and 0.007); corr 0.99983 to 1.0 (J15849 TWINS, q_15849, a9bc9402, 0ea4c5c8); not separate metrics"
  - "every value is read at a minute end e (at a fire, the window ending at the fire, CARD_C6_V5 rule 13)"
  - "the samples are whole seconds: a dip or spike that lasts under a second between two samples is not seen"
  - "S01, S02 are doubles rounded once to 6 decimals; S05, S06 exact, 6 decimals"
  - "empty is never 0: NO_MOVE (Q 0 or a flat window), TOP_HOLE, NO_FILE"

values:
  units: "S01, S02: a z-like ratio (return over volatility, no unit), S01 typically within -2 to 2 (|S01| median 0.65 to 0.72, max 5.493 on 8 Mar 2026 and 5.291 on 24 Sep 2025, J15833 c6name); S05: 0 to 1; S06: minutes, 0 to 360; S07: a ratio, 0 to 1 when the two dials count the same coins (median 0.31 and 0.35, max 0.83 on these days); it can pass 1 when they count different coins (CARD_C6_V5 N7: 2.5)"
  zero: "S01 0 = no move over 30 minutes; S05 0 = at the 6 h low, 1 at the high; S06 0 = the mid is at its 6 h low at e"
  empty: "NO_MOVE, TOP_HOLE, NO_FILE; value_kind 0 with NaN in value_f64; none empty on 8 Mar 2026 or 24 Sep 2025 (job 15812 schema)"
  stale: "true when empty TOP_HOLE (the card's words, CARD_C6_V5 part 2; not checked here: none empty on these days)"
  flags: "BAD_ROW:BTC when a bad row was skipped in the window (CARD_C6_V5 rule 15; not checked here)"

interpret:
  do:
    - "read S01 as how many 30 minute volatilities BTC has moved in the last 30 minutes (plus up, minus down)"
    - "read S02 above 0 as S01 rising against 30 minutes before"
    - "read S05 near 0 as BTC at the bottom of its 6 hour range, near 1 at the top"
    - "read S06 as how long ago BTC's mid last stood at its 6 hour low; S06.first_off how long ago it first reached it"
    - "read S07 above about 0.5 as a market whose last 15 minutes were wide against its 2 hours (p90 0.54 both days), under 0.2 as a quiet last 15 minutes"
  dont:
    - "read S01 by its old name (velocity): it is a z, not points per minute; within a day it follows the plain 30 min return (corr 0.977 and 0.985) but its scale moves with the 6 h volatility"
    - "compare S01 with a z built on minute closes: S01 is 1 / 0.86 (8 Mar) to 1 / 0.74 (24 Sep) times larger (job 15833 c6name)"
    - "read S05 or S06 against a trade high or low: a trade can print beyond every whole-second mid (8 Mar 04:48, 18:19)"

biases:
  - {what: "BTC's 1 second mid returns run on (positively correlated), so the 6 h volatility from 1 s mids is smaller than from 1 minute closes", direction: "S01, S02 larger in size than the same z on minute closes", size: "kline z over ours, where |ours| > 0.5: median 0.860 (8 Mar), 0.744 (24 Sep), p10 to p90 0.69 to 0.92; 8 Mar 22:05 ours -5.49, klines -3.89", proof: "job 15833 c6, c6name; why6 8 Mar 22:05"}
  - {what: "the 6 h low and high are of whole-second mids; a trade can print below the lowest mid (a sweep through the bid inside a second)", direction: "S05 lower, S06 at a different moment than on klines", size: "S05 within 0.021 of the kline value on 77.6% (8 Mar) and 99.0% (24 Sep) of minutes; S06 in the kline bracket on 83.8% and 95.1%; 8 Mar 04:48: trade low 66,720.8 at 02:52, whole-second mid low 66,801.65 at 02:51:12, sub-second mid low 66,755.4 (HILO), so ours 0.0254, klines 0.1322", proof: "job 15833 c6, why6 8 Mar 04:48, 18:19, 22:05, 24 Sep 03:51"}


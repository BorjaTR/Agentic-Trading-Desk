# ONE SOURCE OF TRUTH; rawcheck/meaning_register.py (edition 5 6223b1ad) checks it and writes .md, .flat.jsonl, .agent.jsonl.
# Layer: basic (the largest of A1's own 30 s sums over a window: a maximum of a proven raw value).

group: A1
name: liq_dollars, the largest 30 s long burst of the last 600 s (basic, built on A1 raw)
summary: >-
  Per coin, every 30 s: the largest long liquidation sum of 30 s (longs forced out, forced selling, USDT and USDC contracts) that could be
  known at any moment of the 600 s ending at e. A row counts in the 30 s sum at a moment t when it is stamped in (t - 30 s, t] and was
  received by t; S07 is the largest such sum over every t in [e - 600 s, e], in whole dollars. It is empty unless the coin was seen at
  every moment of the 630 s ending at e. Beside: S07.grid_off, the same rule read at 200 moments e, e - 3 s, ..., e - 597 s.
  The year also writes S07.seen_at_e_off (the same sum, empty only when the coin is not seen at e): its accepted cross-check, a copy.
read_as: >-
  The biggest burst of forced selling this coin had in the last ten minutes, AT LEAST (A1 is a floor: Binance sends the last liquidation
  of each coin each second; the files never hold two rows of one file-second on 8 Mar 2026, and two in 9 file-seconds of 12,878 on 24 Sep
  2025, J15872, J15873). Recomputed from the Tardis rows it equals ours at every compared 30 s of 7 coins a day on both days (A1S07_STAMPS_V1; 78 steps of
  24 Sep not compared, THIN_FEED, the thin state not recomputed: DASH 68, RENDER 10, J15860). It
  is never below the 30 s now (A1 S03) and equals it at 5.3% and 4.9% of the steps where it is above 0: the burst is usually older than
  the last 30 s. Its window reaches further back than its name: the 30 s sum known at e - 600 s holds rows stamped up to 630 s before e
  (DOGE 8 Mar 12:26:30: S07 80,842 is a burst stamped 12:16:01.8, 628 s before e). The 3 s grid twin misses those first 3 s and the sums
  between samples: equal at 95.60% and 95.79% of the steps with S07 above 0.

conclude:
  may:
    - "the largest 30 s burst of long liquidations published for this coin in the last ten minutes, at least this many dollars (a floor)"
    - "whether the burst is now (S07 = A1 S03) or older (S07 above S03), on the coins seen through the 630 s"
    - "how big it was against this coin's own history (A1's reading rule: its percentage over the coin's own 14 days)"
  never:
    - "the total liquidated in that burst on Binance: one print per coin per second (MEANING_A1_V4's never)"
    - "that the burst happened in the last 600 s: the sum known at e - 600 s holds rows stamped up to 630 s before e (DOGE 8 Mar 2026 12:26:30, J15875 a1look)"
    - "that no coin was liquidated when S07 is empty: empty = the coin was not seen through the 630 s (a trade gap over 60 s or a thin minute)"
    - "a copy (S07.seen_at_e_off) as a metric of its own: it is the year's cross-check of the same sum, read through a trade gap; read S07"
    - "anything from S07.grid_off without its gap: it can miss a burst that counts only between its 3 s samples or in [e - 600 s, e - 597 s)"

where:
  card: testbed/value_audit/registers/CARD_A1_V5.md 7d0fff501e319c2a (rules 1 to 5, 9, 13, 17; edge cases E41 to E43, E52, E79, E80)
  settings_register: testbed/value_audit/registers/SETTINGS_A1_V4.tsv 5814b51211138ae5
  built_on_register: "team/RAWCHECK/notes/MEANING/MEANING_A1_V4.yaml 4484098a83845fb6 (A1 raw: LIMITS, a floor; closed with the owner, LAYER_REGISTER_V7)"
  layer_list: "team/RAWCHECK/notes/RAWCHECK/LAYER_REGISTER_V14.tsv 4170fe2d27aa7e31 (A1 S07 basic, NOT_CHECKED before this card)"
  producer: "testbed/value_audit/code prod_A1_v3.py 98349a4fa1c99f12 (CARD_A1_V5 part 5, edition 5), with prod_reader_liquidations_v6.py and prod_reader_trades_v1.py"
  year_output: <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/A1.parquet
  year_output_columns: "name (S07, S07.grid_off, S07.seen_at_e_off among A1's 21 names; J15840 schema), coin (every roster coin), as_of_us (every 30 s: 2,880 a coin-day), value_kind (0 = EMPTY, NaN in value_f64), value_f64 (whole dollars), known_at_us, stale, empty_reason, flags"
  read_it_with: "team/RAWCHECK/code/rawcheck/basic_a1s07.py year(D, coins) or ours.at(D, 'A1', settings, coins, moments)"

source:
  vendor: "Tardis.dev, binance-futures (Binance USDT-margined perpetuals), through our raw A1"
  exchange_stream: "forceOrder (the liquidation order snapshot: the last liquidation of each symbol each second); trades only for the seen state"
  files: "<ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/liquidations_<COIN>USDT_<YYYY-MM-DD>.csv.gz and liquidations_<COIN>USDC_ (D-1 and D); trades_<COIN>USDT_<YYYY-MM-DD>.csv.gz (D-1 and D) for rule 5"
  columns: "exchange, symbol, timestamp, local_timestamp, id, side, price, amount (liquidations); timestamp, local_timestamp (trades)"
  fields:
    row: "one liquidation order, filled; Binance sends at most one a coin a second (MEANING_A1_V4), the files hold one row a file-second at most on 8 Mar 2026 (9,001 rows) and two in 9 of 12,878 file-seconds on 24 Sep 2025 (J15872, J15873 floor); dollars = the order's limit price x the filled amount, exact from the file's text [proof: MEANING_A1_V4 fields row, price, amount; basic_a1s07 parse_liq, tests T1, T12]"
    burst: "S07 = the largest 30 s sum (rows stamped in (t - 30 s, t], received by t, side sell) over every t in [e - 600 s, e], rounded once to the whole dollar half up; a row counts while max(stamp, arrival) <= t < stamp + 30 s [proof: CARD_A1_V5 rule 9, E41 to E43, E79, E80; basic_a1s07 best30, tests T2 to T5, T13; A1S07_STAMPS_V1]"
    seen: "S07 empty unless every moment of [e - 630 s, e] had a USDT trade in its last 60 s received by then (TRADES_HOLE) and no thin minute (THIN_FEED); the copy .seen_at_e_off empty only when not seen at e [proof: CARD_A1_V5 rules 5, 9, E52; basic_a1s07 cover, tests T6, T7; the empties in A1S07_STAMPS_V1: 84 TRADES_HOLE MATCH on 8 Mar (LIT 42, ICP 21, XMR 21, J15859 rows), 993 TRADES_HOLE MATCH (DASH 949, RENDER 22, XMR 22) and 78 THIN_FEED NOT_COMPARABLE (DASH 68, RENDER 10) on 24 Sep (J15860 rows), the 1,071 empties of that day]"
    grid: "S07.grid_off: the same rule at t = e, e - 3 s, ..., e - 597 s (200 samples) [proof: CARD_A1_V5 rule 9, E42; basic_a1s07 tests T3, T13; A1S07_STAMPS_V1]"
  latency: "OPEN (MEANING_A1_V4 latency): SOURCE_SPEC F4 measured a print arriving 1.01 s after its stamp at the median, p99 2.8 s, max 5.1 s (BTC's year), while job 15775 saw 6 to 20 ms on the 6 largest of 8 Mar 2026; not measured on one whole day. A late row counts only from its arrival, and never when it arrives after its 30 s (E43)"

reading_rules:
  - "the year also writes S07.seen_at_e_off as its own cross-check (the same sum, empty only when the coin is not seen at e). ACCEPTED as a cross-check (the owner 18 Oct 2026, BASIC_C1_V5): equal to S07 wherever S07 has a value (149,676 and 145,809 coin-steps, J15849 TWINS equal 1.0; A1S07_STAMPS_V1 40,129 MATCH, 191 NOT_COMPARABLE THIN_FEED), a value where S07 is empty at 84 (8 Mar 2026) and 849 (24 Sep 2025) coin-steps; not a separate metric"
  - "S07 and its twins are written every 30 s (rule 17: 2,880 a coin-day); at a fire the window ends at the fire second"
  - "whole dollars, long side only (longs forced out); USDT and USDC contracts together"
  - "0 = the coin was seen through the 630 s and no long row counted in any 30 s sum; empty is never 0"

values:
  units: "US dollars, whole"
  zero: "no long row counted: S07 0 at 80.05% (8 Mar 2026) and 77.20% (24 Sep 2025) of the coin-steps with a value (J15872, J15873 a1s07)"
  empty: "TRADES_HOLE, THIN_FEED (and NO_FILE, BAD_INPUT, NO_ROSTER): 84 coin-steps on 8 Mar (LIT 42, ICP 21, XMR 21), 1,071 on 24 Sep (J15858 pick, J15840 schema); .seen_at_e_off empty at 0 and 222"
  stale: "true when empty TRADES_HOLE or THIN_FEED, or the whole liquidation stream silent over 960 s (CARD_A1_V5 rule 16)"
  flags: "USDC_MISSING, DUPLICATE_ROW, NO_RATE_BASE, BAD_INPUT (CARD_A1_V5 rule 10)"

interpret:
  do:
    - "read S07 against A1 S03 (the 30 s now): equal = the burst is now; S07 far above S03 = an older burst, one flush to fade or a run (CARD_A1_V5 'fade or ride')"
    - "read S07's size against the coin's own history: the largest on 8 Mar was BTC's 3,401,386 dollars, on 24 Sep ETH's 803,803 (J15858 pick)"
  dont:
    - "read S07.grid_off as S07: it is below S07 at 4.40% (8 Mar) and 4.21% (24 Sep) of the steps with S07 above 0, down to a few percent of it (DOGE 8 Mar 12:26:30: 1,948 against 80,842)"
    - "read an empty S07 as calm"

biases:
  - {what: "A1 is a floor: Binance sends the last liquidation of each coin each second", direction: "S07 at or below the true burst", size: "not measurable here (no full liquidation record); one row a file-second at most on 8 Mar (9,001 rows), two in 9 of 12,878 file-seconds on 24 Sep", proof: "MEANING_A1_V4 read_as; J15872, J15873 a1s07 floor"}
  - {what: "the 600 s window of moments reaches rows stamped up to 630 s before e", direction: "S07 holds a burst older than 600 s for up to 30 s after it leaves the name's window", size: "DOGE 8 Mar 12:26:30 80,842 (stamped 628 s before e); ADA 24 Sep 03:38:30 174,705 (its largest row stamped 627 s before e)", proof: "J15875, J15876 a1look"}
  - {what: "the 3 s grid twin samples 200 moments", direction: "S07.grid_off at or below S07, never above", size: "equal at 95.60% and 95.79% of the steps with S07 above 0; where it differs its median is 0.971 and 0.968 of S07, its minimum 0", proof: "J15872, J15873 a1s07"}

external_checks:

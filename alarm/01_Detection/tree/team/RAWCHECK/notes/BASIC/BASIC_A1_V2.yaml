  - {what: "what the name and the rule say: S07 at or above A1 S03 at every step; S07 = S03; the grid twin against S07; the seen twin where S07 is empty", where: "our A1 rows, every coin, both days", status: "VERIFIED: S07 >= S03 at 100% of 149,676 and 145,809 coin-steps (J15872, J15873 a1s07)"}
  - {what: "the floor: rows per file and whole second in the liquidation files of every roster coin", where: "Tardis liquidations", status: "VERIFIED: 1 at most on 8 Mar; 2 in 9 file-seconds on 24 Sep (J15872, J15873)"}
  - {what: "the gaps at one coin-step", where: "Tardis liquidations", status: "EXPLAINED: J15875 a1look DOGE 8 Mar 12:26:30, J15876 a1look ADA 24 Sep 03:38:30 (the largest sum at e - 600 s exactly, outside the grid)"}
  - {what: "an outside record of liquidations", where: "Coinalyze daily liquidation totals per coin (MEANING_A1_V4 external_checks; Binance keeps no forceOrder history)", status: "DAILY ONLY (EDGE2 jobs 15739, 15740: 179 days, median gap 1.5% and 1.9%, ours larger on crash days): a day's total cannot test a 30 s burst or its 600 s window"}


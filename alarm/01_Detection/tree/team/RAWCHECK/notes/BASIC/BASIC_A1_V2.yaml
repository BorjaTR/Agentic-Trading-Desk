# (V1:) BASIC_A1_V1.yaml: the card of A1's one basic setting, S07 (the largest 30 s long liquidation sum of the last 600 s), and its twins
# (BED, 2026-10-18, BR4 = WP4 of BASIC_REVIEW_WORKPACKAGES_V3 075b96c8). S07 left the raw card MEANING_A1_V4 (63ff333d, its header: 'S07

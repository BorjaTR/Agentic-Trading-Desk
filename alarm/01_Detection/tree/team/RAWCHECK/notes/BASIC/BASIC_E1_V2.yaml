  layer: basic
  side: none
  window: at e
  clock: minute end
  scope: market
  contracts: USDT
  aggregate: lower weighted median of (rate - 0.0001), rate = funding_rate x 8 / E1 S04, weight open_interest x index_price, exact, signed
  aliases: MV_FUNDING_BASE.agg
  means: 'where the market''s open-interest-weighted funding estimate sits against Binance''s default 0.01% per 8 h: plus = above (longs expected to pay more than the interest rate),
    minus = below'
  name: market funding estimate less the default rate, signed (OI-weighted lower median, per 8 h)
  computation:
    status: RELIABLE
    proof: 'J15898, J15899 (basic_deriv 9420f568) and J15923, J15924 (edition 2 d47ad0be) e1s05: recomputed from the Tardis derivative_ticker rows of all 52 (8 Mar 2026) and 51 (24 Sep
      2025) coins, the interval from the year''s E1 S04: exact at 1,439 of 1,440 minute ends (00:00 needs D-1)'
  meaning:
    status: DEFINED_WITH_OPEN
    proof: 'J15900 e1m: one minute before the 08:00 and 16:00 settles -0.0000024, +0.0000003 (8 Mar) and 0.0000000, +0.0000003 (24 Sep) from the same weighted rule on the rates Binance
      paid (weights from its metrics open interest value); an hour before +0.0000217, +0.0000184 and +0.0000077, +0.0000093 (14 to 21% of the paid value); S05 itself -0.00013717, -0.00012835,
      -0.00003733, -0.00005084 one minute before: signed, below 0 at all 4'
  open: 'built on live estimates (E1 S01): it changes until the settle; checked at 4 settles (00:00 needs D-1); e1m has no planted test; the recompute''s tests do not plant rule 6 BAD_INPUT

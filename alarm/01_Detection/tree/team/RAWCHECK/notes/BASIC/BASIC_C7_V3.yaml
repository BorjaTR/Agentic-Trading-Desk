  - {what: "the gap's parts: the spread and the whole-second sampling, per coin and moment", where: "Tardis book_ticker beside the klines", status: "MEASURED and NAMED: J15866, J15867 spread (kline - tick = 1.000 to 1.018 spreads on 8 Mar, 0.001 to 1.020 on 24 Sep, median of coin-minutes); J15868, J15869 mlook (whole-spread steps per coin); J15869 why (9 coin-minutes, every side named)"}

tools:
  - {what: "every roster coin's dial recomputed from the Tardis rows and compared exactly with the year (value, known_at, flags, stale)", run: "python3 -B -m rawcheck.basic_c7 --days <D> --at <HHMM,..> --out <dir>", where: "team/RAWCHECK/code (basic_c7.py 979bd5fb42f63b10, tests af4ec479f90af8a1; runner job)"}
  - {what: "one coin by hand: each window's high and low sample with its file line", run: "python3 -B -m rawcheck.basic_c7 coin <D> <COIN> <HHMM>", where: team/RAWCHECK/code}
  - {what: "the dials against the median kline range at every minute end; the name test (median vs mean, base, closes)", run: "python3 -B -m rawcheck.meaning_ranges day <D> | name <D>", where: "team/RAWCHECK/code (meaning_ranges.py 74f75c8f87434926 edition 8, tests f9d9b6b8d8631856 33 of 33, ran THE PROOF RUN; editions 1 a427064974e5b037 to 3 d534db15528d2f17 ran 15821 to 15830 with the same numbers)"}
  - {what: "the gap's parts per coin and moment (sampled, tick, kline, spread)", run: "python3 -B -m rawcheck.meaning_ranges spread <D> <HHMM,..>", where: team/RAWCHECK/code}
  - {what: "one market minute coin by coin; one coin-minute's mid tops beside the kline high and low", run: "python3 -B -m rawcheck.meaning_ranges mlook <D> <S0x> <HHMM> | why <D> <COIN> <HHMM> <W>", where: team/RAWCHECK/code}


group: C7
name: market dial (basic, built on the book mid)
summary: >-
  For each coin of the week's roster, the high-low range of its book mid ((best bid + best ask) / 2, Tardis book_ticker) at the whole-second
  samples e - W, e - W + 1 s, ..., e, in percent of the low; the dial is the median of those ranges over the coins with every sample known
  (even count: the mean of the two middle ones), rounded once to 6 decimals. W = 60 s, 5, 10, 15, 30 min, 1 h, 2 h (S01 to S07); one value
  per minute end for the MARKET. S08 (the 2 h dial as a 30-day percentile) is empty NO_HISTORY at every minute. The year also writes the
  same seven on Tardis quotes (the top rebuilt from the depth stream), .quotes_off: copies, its accepted cross-check, not metrics of their own.
read_as: >-
  How wide the typical coin's quoted mid moved over the window, in percent. It tracks the market's trade range closely (Spearman 0.985 to
  0.998 against the median Binance kline range at every minute end of 8 Mar 2026 and 24 Sep 2025, J15864, J15865) but it is smaller: the median
  ratio dial / kline range is 0.785 (60 s) to 0.959 (2 h) on 8 Mar and 0.917 to 0.976 on 24 Sep, and the dial is below the kline value in 95
  to 100% of minutes. The gap has two measured parts (J15866, J15867): a trade happens at the bid or the ask, so a trade range spans the
  spread a mid range does not (on 8 Mar the kline range is one spread wider than the range of every mid that stood: 1.000 to 1.018 spreads,
  median of coin-minutes); and the dial samples the mid once a second, so it misses moves inside a second (tick - sampled, median 0 to
  0.012 pct points). On 24 Sep at 1 to 15 min the spread part is about 0 (see open of S01, S02). The 60 s and 5 min dials are RENAMED to say
  'mid range at whole-second samples' (ratio below 0.9 on 8 Mar, the pass line of 12:47Z); the trade range their old names promised is in
  could_build (C7.CB1). Every value is equal to a recompute from the Tardis rows (420 of 420, J15814 to J15816).

conclude:
  may:
    - "how calm or wild the market's typical coin was over W, compared with other minutes and days: the dials rank minutes as the median trade range does (Spearman 0.98487 to 0.99811, J15864, J15865)"
    - "how far the median coin's QUOTED MID moved over W, in percent of its low (S01 to S07)"
    - "for S06 and S07, roughly the median coin's trade range: the dial is 0.9504 to 0.9756 of it at the median minute (J15864, J15865)"
  never:
    - "that the median coin TRADED over a range that wide or that narrow: the trade range is larger, by whole spreads (0.7849 for the 60 s dial on 8 Mar 2026, J15864, J15865; J15869 why)"
    - "that one coin moved: a dial is the MEDIAN coin; one coin's spike moves it only if it moves the middle"
    - "that a dial of 0, or a coin's range of 0, means no trading: a still mid with trades bouncing between bid and ask reads 0 (8 of 52 coins at 8 Mar 2026 05:00, J15869 mlook)"
    - "that nothing happened inside a second: whole-second samples miss tops that stand under a second, even when they traded (ETC 8 Mar 2026 05:00, J15869 why)"
    - "a reader's trade-range floor (0.3, 0.6, 1.2 pct) on a dial as if the units were the same: the dial is below the trade range in 95.42 to 100% of minutes (J15864, J15865)"
    - "anything from S08 (empty NO_HISTORY at every minute)"
    - "a copy (.quotes_off) as a metric of its own: it is the year's cross-check of the same dial on a second feed; read the seven dials"

where:
  card: testbed/value_audit/code/L0_y52f12/value_audit/registers/CARD_C7_V4.md d4ec3f8fd2318abe (rules 1 to 12; producer prod_C7_v1.py f30d00345f21806a)
  settings_register: testbed/value_audit/code/L0_y52f12/value_audit/registers/SETTINGS_C7_V1.tsv e1cda23230b7fb45 (8 settings)
  built_on_register: "team/RAWCHECK/notes/MEANING/MEANING_C13_V4.yaml fe5df65ba7680fc8 (C13 S05 book mid: raw, LIMITS; closed with the owner, LAYER_REGISTER_V7)"
  layer_list: "team/LAB/notes/RAWCHECK/BASIC_LIST_V2.md (C7 S01 to S07 basic); LAYER_REGISTER_V14 4170fe2d27aa7e31 (S08 REBUILD)"
  producer: "testbed/value_audit/code/L0_y52f12/value_audit/code/prod_C7_v1.py f30d00345f21806a = PRODUCER_EDITIONS row 9221 (driver drivers/work_A1E/speed/clk/drive_l0b_C7_v1f1_day.py 7c57d0e845abe752; the top in force through prod_C4_v1.top, the reader prod_reader_book_ticker_v2.py 188dc357dba91bd1; env VOLAT_FOR=<SCRATCH>/work_ARCH/roots/root_year52r/volat-agent/forensics: the roster root)"
  year_output: <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/C7.parquet
  year_output_columns: "name (S01 to S07, S01.quotes_off to S07.quotes_off, S08: 15 names, J15813 schema), coin (MARKET only), as_of_us (e), value_kind (0 = EMPTY, NaN in value_f64), value_f64, value_txt, known_at_us, stale, empty_reason ('' with a value), flags"
  read_it_with: "team/RAWCHECK/code/rawcheck/basic_c7.py ours(D, moments) (the 7 dials at the moments) or meaning_ranges.ours(D) (every minute end)"

source:
  vendor: "Tardis.dev, Binance USD-M futures, through our raw C13 S05 (the book mid, MEANING_C13_V4)"
  exchange_stream: "bookTicker (Binance's best bid and ask channel), as Tardis records it: book_ticker; C7 reads the Tardis rows itself (the top in force at each whole second), not C13's minute values"
  files: "<ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/book_ticker_<SYM>_<YYYY-MM-DD>.csv.gz of D, and of D-1 for a window that starts in D-1 (D-2 only to fill a sample neither has); the week's roster <SCRATCH>/work_ARCH/roots/root_year52r/volat-agent/forensics/knowledge/roster/ROSTER_<monday>.csv"
  columns: "exchange, symbol, timestamp (Binance's E), local_timestamp (arrival at Tardis), ask_amount, ask_price, bid_price, bid_amount"
  fields:
    top_in_force: "at a sample tau: among the good rows of D-1's then D's file in file order, the one with the largest file position whose max(timestamp, local_timestamp) <= tau; known when tau - its timestamp <= 30 s [proof: CARD_C7_V4 rule 1 = CARD_C4 rules 1 to 5; prod_C4_v1._apply; basic_c7 979bd5fb in_force, tests E80, E90, E91]"
    mid: "(bid_price + ask_price) / 2, exact [proof: prod_C4_v1.top M:r2_mid_exact; MEANING_C13_V4 C13.S05]"
    coin_range: "(high - low) / low x 100 over the mids of the W + 1 samples; a coin is out NO_FILE (a needed day file missing, checked first) or TOP_HOLE (a sample not known) [proof: CARD_C7_V4 rules 1, 2; prod_C7_v1.coin_ranges; tests E4, E26, E38, E62, E63, E67, E93, E94]"
    dial: "the median of the coins' ranges (even count: the mean of the two middle ones), exact, rounded once to 6 decimals half away from 0; no coin in: the common reason, else ALL_COINS_EMPTY [proof: CARD_C7_V4 rules 3, 4; prod_C7_v1.market; tests E60, E61, E66, E83]"
    known_at: "the latest arrival among the rows in force at the samples of the coins counted; e for an empty value [proof: CARD_C7_V4 rule 7; tests E2, E3, E47; stamps 105 of 105 known_at rows (C7_STAMPS_V1)]"
    flags: "BAD_ROW:<coin> for a counted coin with a bad row stamped in [e - W, e] and received by e [proof: CARD_C7_V4 rule 8; tests E16, E40, E95, E96; stamps 105 of 105 flags rows]"
  latency: "known_at at most e (rows received by e only); a coin's top must be at most 30 s old at every sample; the year writes one value per minute end (00:00 to 23:59); at a fire the last full minute (CARD_C7_V4 rule 6)"
  silence: "a coin whose top is unknown at a sample (none, or older than 30 s) is out TOP_HOLE; when every coin is out TOP_HOLE the dial is empty and stale; 8 Mar 2026 and 24 Sep 2025: 0 empty dials (J15813 schema)"

reading_rules:
  - "a dial is the MEDIAN coin's range: one coin's spike moves it only if it moves the middle (median vs mean of the kline ranges: ratio 0.64 to 0.90, J15864, J15865 name)"
  - "the range is of the book MID sampled at whole seconds, not of trades: it is below the trade (kline) range in 95 to 100% of minutes (J15864, J15865 day)"
  - "percent of the LOW (CARD_C7_V4 O2): against the percent of the close the median ratio moves by under 0.01 (J15864, J15865 name)"
  - "a coin out (NO_FILE, TOP_HOLE) is left out of the median, never counted as 0 (CARD_C7_V4 O6; test E4, mutant B4)"
  - "at a fire every dial gives the last full minute (CARD_C7_V4 rule 6)"
  - "the year also writes 7 copies of the same dials as its own cross-check: .quotes_off, the same rules on Tardis quotes (the top rebuilt from the depth stream, CARD_C7_V4 rule 11). ACCEPTED as a cross-check (the owner 18 Oct 2026, BASIC_C1_V5): equal to the dial at 60.56 to 81.53% of minute ends on 8 Mar 2026 and 86.39 to 93.26% on 24 Sep 2025, corr 0.99986 to 0.99999, gap p99 0.004278 to 0.022447 pct points, otherwise the two feeds disagreeing (J15849 TWINS); a copy is no metric of its own: read the seven dials"

values:
  units: "percent of the coin's low over the window (0.3 = the middle coin's mid moved 0.3% from its low to its high)"
  zero: "0 = the middle coin's mid did not move at any whole second of the window: a value, not empty"
  empty: "NO_ROSTER, NO_FILE, TOP_HOLE, ALL_COINS_EMPTY (S01 to S07); NO_HISTORY (S08, every minute); value_kind 0 with NaN in value_f64. Never read empty as 0"
  stale: "1 when the value is empty because every coin's top went silent (TOP_HOLE)"
  flags: "BAD_ROW:<coin> for each counted coin with a bad row in the window (0 flagged values on 8 Mar 2026 and 24 Sep 2025, J15813 schema)"

interpret:
  do:
    - "read a dial as the typical coin's quoted mid range over W, in percent: the market's calm or wild now at seven horizons"
    - "compare dials across minutes and days: they rank minutes as the trade range does (Spearman 0.985 to 0.998, J15864, J15865)"
    - "read S07 (2 h) and S06 (1 h) as close to the trade range: ratio 0.95 to 0.98 at the median"
  dont:
    - "read S01 or S02 as the trade high-low range (their old names): on 8 Mar the 60 s dial is 0.785 of the median kline range at the median minute (p10 0.565), the 5 min 0.877 (C7.CB1)"
    - "set a floor in trade-range units (the readers' 0.3, 0.6, 1.2 pct) against a dial without the ratio: a dial sits below the trade range in 95 to 100% of minutes"
    - "read the dial as a mean: against the MEAN of the kline ranges the ratio falls to 0.639 to 0.898 (8 Mar) and 0.719 to 0.794 (24 Sep), against the median 0.785 to 0.976 (J15864, J15865 name)"
    - "read empty as 0"

biases:
  - {what: "the mid does not cross the spread; trades do (at the bid or the ask)", direction: "the dial too small against the trade range", size: "8 Mar 2026: kline range - tick mid range = 1.000 (60 s) to 1.018 (2 h) spreads at the median coin-minute; the median spread 0.0179 to 0.0187 pct; 24 Sep 2025: 0.001 (60 s), 0.501 (5 min), 0.985 to 1.020 (10 min to 2 h) spreads, median spread 0.0083 pct", proof: "J15866, J15867 spread (5 and 3 moments, every roster coin)"}
  - {what: "whole-second samples miss a mid that stood less than a second between two samples", direction: "the dial too small against the range of every mid that stood", size: "tick - sampled median 0 at 60 s to 30 min (8 Mar), 0.0121 pct points at 2 h; 24 Sep 0 to 0.0069; tick >= sampled in 100% of coin-minutes", proof: "J15866, J15867 spread; planted K7"}
  - {what: "where the window's extremes traded: the trade range is the mid range plus half a spread at each end, by side", direction: "either way, in whole spreads", size: "per coin-minute kline - tick in spreads: 24 Sep 03:00 S01: -1 for 7 coins, 0 for 26, +1 for 16; 8 Mar 05:00 S01: -1 for 3, 0 for 16, +1 for 27, +2 for 2, +3 for BTC (J15868, J15869); 8 Mar 05:00: 8 of 52 coins had a still mid (their range 0) while their trades spanned one spread (J15869 mlook)", proof: "J15869 why: +1 FIL, TRX (24 Sep 03:00), CRV (8 Mar 05:00): the top traded at the ask, the bottom at the bid; 0 PEPE (24 Sep), ETC (8 Mar): both at the ask; -1 ENA, OP (24 Sep), UNI (8 Mar): the top sold at the bid, the bottom bought at the ask; BTC (8 Mar): the bottom swept past the bid"}


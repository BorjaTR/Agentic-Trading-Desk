# BASIC_C8_V3.yaml: the card of the basic group C8 candle anatomy, EDITION 3 (= edition 2 0331c7b2e39f69c5 + conclude, the owner 15:0x Berlin). Edition 2 header follows:
# EDITION 2 (EDGE1, 2026-10-18; edition 1 BASIC_C8_V1.yaml 93d139ce180ddfa5 kept).
# EDITION 2 = the owner's rename rule (14:1x Berlin): "from now on we need to rename the settings whenever they differ from what they actually
# do and write the 'could build' as the previous name intended". S01, S02, S04, S05 renamed (old names kept in renamed_from and aliases);
# the wick share and body share their old names promised are in could_build. Checked by meaning_register edition 3. Numbers unchanged (J15808).
# Edition 1 header: the owner 13:5x Berlin: "let's do one example
# together. Take one basic computation group and let's see if you can do the job"). Made the way BASIC_C1_V1 was (METRIC_REVIEW_METHOD_V1
# section 5). ONE SOURCE OF TRUTH; rawcheck/meaning_register.py checks it and writes .flat.jsonl (one line per setting, grep the id) and .md.
# Layer of every setting: basic (plain arithmetic on proven raw values, BASIC_LIST_V2).
# STAMPS = C8_STAMPS_V1 (job 15767): 3 days (24 Sep 2025, 4 Nov 2025, 8 Mar 2026) x 5 minute ends (01:00, 04:00, 12:10, 16:00, 22:06) x every
# roster coin: S01 to S03 770 of 770 each, S04 to S06 15 of 15 each. J15808 = meaning_candle edition 3 on 8 Mar 2026 and 24 Sep 2025.
# COULD BUILD: what the old names intended. Built only when an analysis asks for it; each proven on 1 to 3 days first (the owner's plan step 3).
group: C8
name: candle anatomy (basic, built on the trade candle)
summary: 'Three numbers about one coin''s candle of the 60 s ending at a minute end e, from our C13 trade candle (close = last trade, high, low): S01 = (close - low) / (high - low),
  S02 = (close - previous minute''s close) / (high - low), S03 = 100 x (high - low) / close; and for the market the median of each over the roster coins with a value (S04 to S06), with
  the count of coins read beside (.coverage).'
read_as: 'Two new things per coin and as a market median: where the minute closed in its range (S01 close position, S04) and how wide the minute was (S03 range pct, S06), both equal
  to Binance''s own 1-minute candles on more than 99% of coin-minutes (J15808). S02 (S05 its median) is the move from the previous minute''s close in units of this minute''s range: by
  its formula the 1-minute return divided by S03, so it adds little of its own; it can pass 1 or -1 (2% of coin-minutes, up to 8 on a tiny range). S01 and S02 were named wick share and
  body share; they are neither (corr -0.02 and 0.89 to 0.96 with the real ones): renamed in edition 2; the real ones are in could_build. No copy inside C8; a copy check against the other
  groups is not done yet. The year output still writes S01 to S06 with the old metric names (aliases).'
where:
  card: testbed/value_audit/code/L0_y52f12/value_audit/registers/CARD_C8_V4.md (rules 1 to 17; producer prod_C8_v5.py 5980ca1bc6cfc6a3)
  settings_register: testbed/value_audit/code/L0_y52f12/value_audit/registers/SETTINGS_C8_V1.tsv (6 settings)
  built_on_register: 'team/LAB/notes/MEANING/MEANING_C13_V3.yaml (C13 S01 close, S02 high, S03 low, S04 no trade: raw, RELIABLE, DEFINED_WITH_OPEN = LIMITS)'
  layer_list: team/LAB/notes/RAWCHECK/BASIC_LIST_V2.md (C8 S01 to S06, 6 basic settings)
  producer: testbed/value_audit/code/prod_C8_v5.py (CARD_C8_V4), reading C13's built parts of D and D-1
  year_output: <DATA_ROOT>/l0bin_y52/day=<YYYYMMDD>/C8.parquet
  year_output_columns: 'name (S01 to S06, S04.coverage, S05.coverage, S06.coverage: 9 names, job 15803), coin (or MARKET for S04 to S06 and the coverages), as_of_us (e), value_kind (0
    = EMPTY, NaN in value_f64), value_f64, known_at_us, stale, empty_reason, flags'
  read_it_with: team/LAB/code/rawcheck/ours.py at(D, 'C8', settings, coins, moments)
source:
  vendor: 'none new: built on our raw C13 S01 to S04 (Binance trades through Tardis), MEANING_C13_V3'
  exchange_stream: trades (Binance's trade channel through Tardis), through C13's candle; C8 reads no file of its own
  files: <ARCHIVE_DISK2>/volat_archive/pulled_20260910_eramap/tardis/binance-futures/trades_<SYM>_<YYYY-MM-DD>.csv.gz (through C13; D, and D-1 for the previous close of 00:00)
  columns: C13's close, high, low and no trade of the 60 s ending at e and of the 60 s ending at e - 60 s (the previous close)
  fields:
    candle: 'close = the last trade stamped in (e - 60 s, e] and received by e; high, low = the largest and smallest such price [proof: CARD_C8_V4 section 3 Source; MEANING_C13_V3 S01
      to S03]'
    previous_close: 'C13''s close at e - 60 s; for 00:00 the 23:59 close of D-1 [proof: CARD_C8_V4 rule 2]'
    s01: '(close - low) / (high - low), exact, rounded once to 12 decimals [proof: CARD_C8_V4 rules 3, 6; recompute J15767]'
    s02: '(close - previous close) / (high - low) [proof: CARD_C8_V4 rules 4, 6; recompute J15767]'
    s03: '100 x (high - low) / close; 0 when high = low [proof: CARD_C8_V4 rules 5, 6, O2; recompute J15767]'
    market: 'S04 to S06 = the median of the coin values over the roster coins with a value (even count: the mean of the two middle ones); .coverage = that count [proof: CARD_C8_V4 rule
      10; J15808 cover: 1,440 of 1,440 minutes both days]'
  latency: known_at = the latest known_at of the C13 rows read; at most the minute end itself (C13 counts only trades received by e); max_staleness 60 s (CARD_C8_V4 section 2)
  silence: 'a coin with no trade of its own in the minute is empty NO_TRADE; a feed gone quiet or thin is C13''s TRADES_HOLE or THIN_FEED (stale); 24 Sep 2025: 16 TRADES_HOLE, 89 THIN_FEED
    coin-minutes; 8 Mar 2026: none (J15808 empty)'
reading_rules:
- 'the candle of e is C13''s candle of the 60 s ending at e: trades stamped in (e - 60 s, e] and received by e (no look-ahead); Binance''s own kline is [e - 60 s, e) at any arrival'
- S01, S02 empty NO_RANGE when high = low (one price); S03 is then 0; all three empty NO_TRADE when the minute has no trade of its own; S02 empty NO_PREV_CLOSE when C13 has no close
  at e - 60 s (rule 7)
- a market value is the median over the roster coins with a value, never a mean; .coverage says how many (rule 10)
- at a fire every setting gives the last full minute (rule 13)
values:
  units: 'S01, S02, S04, S05: a share of the minute''s range (S01 from 0 to 1; S02 any sign, can pass 1 or -1); S03, S06: percent of the close'
  zero: S01 0 = closed on its low; S02 0 = closed where the previous minute closed; S03 0 = one price all minute
  empty: NO_ROSTER, NO_FILE, TRADES_HOLE, THIN_FEED, BAD_INPUT (from C13), NO_TRADE, NO_RANGE, NO_PREV_CLOSE, ALL_COINS_EMPTY (market); value_kind 0 with NaN in value_f64. Never read
    empty as 0
  stale: 1 when the value is empty because a feed went quiet or thin (C13's TRADES_HOLE or THIN_FEED)
  flags: C13's (DUPLICATE_ROW, NO_RATE_BASE), and BAD_INPUT:<coin> on a market value
interpret:
  do:
  - 'read S01 (close position) as the close''s place in the minute''s range: near 1 the minute closed on its high, near 0 on its low'
  - 'read S01 high with S02 below 0 as a fall bought back inside the minute: the candle''s lower wick is then 0.86 to 0.90 of the range at the median (J15808 name)'
  - read S02's sign as 'closed up or down from the previous minute's close' (same sign as the real body in 99.75 to 99.87% of coin-minutes)
  - read S03 and S06 as the width of the minute in percent
  dont:
  - 'read S01 by its old name (wick share): it agrees with the real wick share on 20 to 28% of coin-minutes, correlation -0.02 (C8.CB1)'
  - 'read S02 by its old name (body share): when the open is not the previous close (47 to 52% of minutes) they differ; S02 was 8 at XMR 24 Sep 2025 22:23 (range 0.01) (C8.CB2)'
  - 'compare S02''s size across coins: a tiny range makes it jump'
  - 'read empty as 0 (NO_RANGE: S01, S02 empty while S03 is 0)'
biases:
- what: trades stamped in the minute's last milliseconds and received after e are left out (no look-ahead); Binance's kline keeps them
  direction: either way (the close, high or low of ours can differ)
  size: S01 differs from Binance's candle on 0.23% (8 Mar 2026) and 0.36% (24 Sep 2025) of coin-minutes; S03 on 0.26% and 0.37%; 11 of the 12 coin-minutes looked at were these late rows,
    the 12th the next bias
  proof: 'J15808 day and why (ARB 05:11, TRX 09:34, CRV 20:29, NEAR 23:27, HYPE 13:53, SOL 06:09, SEI 11:02; HYPE 04:34, FET 20:11, BTC 21:06, BTC 23:15: late rows 0.2 to 5.9 ms after
    e)'
- what: trades missing from the Tardis file
  direction: the range too small
  size: 'one case found: PUMP 8 Mar 2026 11:56, 70 of Binance''s 110 trades (one gap of 40 ids), range 0.0525 pct points instead of 0.1050'
  proof: J15808 why PUMP 1156 and meaning_c13 ids
- what: a previous close changed by a late row moves S02 one minute later
  direction: either way
  size: ARB 8 Mar 05:12, BTC 24 Sep 21:07 (gap 1.0)
  proof: J15808 look ARB 0513, why BTC 2106

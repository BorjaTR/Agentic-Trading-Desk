  where: Binance 1m klines (data.binance.vision), held at <SCRATCH_DISK>/realcheck/outside/binance/klines_1m
  status: 'VERIFIED: J15808 day (exactly equal 99.28 to 99.77%, corr 0.9996 to 1.0000)'
- what: S04 to S06, the median of the roster coins' kline values
  where: the same klines
  status: 'VERIFIED: J15808 market (exactly equal 92.4 to 99.4%, max gap 0.083 share, 0.0073 pct points); every gap looked at named coin by coin (mlook)'
- what: 'the names: S01 against the textbook wick share, S02 against the textbook body share (close - open) / range'
  where: the kline open, high, low, close
  status: 'DIFFERED, RENAMED in edition 2: J15808 name (S01 corr -0.015 and -0.025; S02 corr 0.893 and 0.961, beyond 1 or -1 in 1.91% and 2.30%)'
- what: the largest gaps, one minute of one coin each
  where: Tardis trades of that minute under ours, any-arrival and the kline's window

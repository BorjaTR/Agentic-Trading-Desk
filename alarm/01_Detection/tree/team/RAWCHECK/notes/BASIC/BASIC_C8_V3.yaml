could_build:
- id: C8.CB1
  intended: 'wick share: the part of the minute''s range outside the body, per coin and as a market median'
  was_name_of: C8.S01, C8.S04
  formula: '((high - max(open, close)) + (min(open, close) - low)) / (high - low); the lower and upper wicks apart as options; market: the median over the roster coins with a value'
  needs: 'the minute''s open (the first trade stamped in (e - 60 s, e] and received by e): C13 has no open today (C13 gives close, high, low, no trade); a new C13 setting or a C8 producer
    edition'
  adds: 'NEW information: corr with S01 -0.015 (8 Mar) and -0.025 (24 Sep); lower wick corr 0.45 and 0.38, upper wick -0.46 and -0.41 (J15808 name, on Binance klines)'
  status: NOT_BUILT
- id: C8.CB2
  intended: 'body share: the minute''s open-to-close move over its range, per coin and as a market median'
  was_name_of: C8.S02, C8.S05
  formula: '(close - open) / (high - low), always between -1 and 1; market: the median over the roster coins with a value'
  needs: the minute's open, as C8.CB1
  adds: 'LITTLE: corr with S02 0.893 (8 Mar) and 0.961 (24 Sep), same sign 99.87 and 99.75%; it differs from S02 only when the open is not the previous close: 47 to 52% of minutes; |open
    - previous close| p90 5.66 bp (8 Mar) and 2.29 bp (24 Sep) over all minutes (J15808 name)'
  status: NOT_BUILT
conclude:
  may:
  - where the minute closed in its high-low range (S01 per coin, S04 the market's median) and how wide the minute was (S03, S06), as Binance's own candles show it
  - 'the sign of S02: the minute closed up or down from the previous minute''s close'
  never:
  - 'anything about wicks or candle bodies from S01, S02, S04, S05: they were renamed (close position, close move over range); a real wick share and body share are not built (C8.CB1,
    C8.CB2)'
  - 'S02''s size compared across coins or minutes without the range: a tiny range makes it jump (8 at XMR 24 Sep 2025 22:23)'
  - an EMPTY S01 or S02 (one price all minute, NO_RANGE) as 0; S03 is then 0
  - 'the minute''s open: C13 gives no open'

# V8_V1.yaml: VOLX Garman-Klass range volatility (METRIC_AUDIT, 18 Oct 2026; BUILD_DEFINITION_WORKPACKAGES_V2 edit 2 ac90daf8 section 5 rule
# 2; ADDON_ARCHITECTURE_V4 edit 3 0591d181). S12 by PRODUCER_VOLX_V1.yaml. The bars, window and floors are V7's. Examples: verify_volx_examples_v1.py V7.
# Edition 2: TREE's review (REVIEW_VOLX_TREE_V1 404b9dcd): F1 (the first year day: FEW_BARS through 00:53, valued from 00:54), F2
# (one NO_HISTORY rule), F3 (roll_points: a flat hour after a spike is exactly 0; U5, M6); U1's stepped prices (V8 F1), N1 (the reason for 0 or more), A1 to A3.
# Edition 3: EDGE1's lead review (REVIEW_LEAD_EDGE1_V1 8dd9867d section 3, X1 to X11): X7 Binance, X11 (V7's nits apply through V7's rows).
# Edition 4: the roster file is the year root's (B's coins; J16034 log f7a76cb05e789815: every Monday 8 Sep 2025 to 9 Mar 2026
# there; the repo's knowledge/roster/ starts at ROSTER_20251006); no other change.
kind: build_metric
id: V8
producer: VOLX
item: 'Garman-Klass range volatility'
tier: BUILD
name: the coin's Garman-Klass volatility over the last 60 one-minute Binance USDT-M trade candles (each candle's open = the previous minute's close), in percent over the hour, not annualised
status:
  drafter: METRIC_AUDIT
  reviewer: TREE
  edition: 4
  signed: false
means: >-
  V7's hour of one-minute ranges, with each minute's open-to-close move taken out of its range (Garman and Klass): closer to the
  true variance than the range alone when prices drift within the minute. In percent over the hour.
example: >-
  V7's toy hour (30 bars A, 30 bars B): per-bar variances 0.00041137056388801255 and 4.9999999999998925e-05, S12 = 100 x sqrt(60 x
  their mean) = 11.76482763011866 percent over the hour.
formula: >-
  V7's bar (O = C13 S01 at m - 60 s, H = max(C13 S02 at m, O), L = min(C13 S03 at m, O), C = C13 S01 at m; valued when the four
  inputs are). With u' = ln(H / O), d' = ln(L / O), c' = ln(C / O): g(m) = 0.5 (u' - d')^2 - (2 ln 2 - 1) c'^2 (the simple form of
  Garman and Klass; 0 or more, since d' <= min(0, c') and u' >= max(0, c') (the range holds O and C), so c'^2 <= (u' - d')^2, and
  0.5 > 2 ln 2 - 1). At u: the 60 bars m = u - 59 min to u, n valued; with n
  >= 54 S12 = 100 x sqrt(60 x mean of the valued g(m)), flag SHORT_WINDOW when n < 60; n < 54 empty FEW_BARS. float64, not rounded,
  not annualised.
source:
  kind: paper
  ref: >-
    Garman and Klass 1980, J. Business 53(1) 67-78 (the simple form 0.5 (u - d)^2 - (2 ln 2 - 1) c^2); RESEARCH_TOOLS_V1 aad3cc38 row
    V4 and section 5.4 (bar A 4.11371e-4, bar B 5e-5; no GK in TA-Lib; the others GPL or AGPL: BUILD).
inputs:
  - kind: year
    ref: C13 S01 (close), S02 (high), S03 (low)
    card: MEANING_C13_V4 fe5df65ba7680fc8 (CARD_C13_V4 69ff088d rules 4 to 6)
    verdict: LIMITS
    rule_in_force: B's rows at the minute ends as written (trade prices of the 60 s ending at m, received by m)
    stale_rule: an empty row (any reason) makes its bar not valued; never filled
    days: "D and D-1 (B holds D-1, as V7; no CARRY)"
overlaps:
  - setting: VOLX S11
    kind: other_metric
    why: V7's Parkinson on the same bars; S12 adds the open-to-close term. The meaning check compares them.
per_coin: >-
  As V7: C13's high and low are TRADE prices (CARD_C13_V4 rule 4) with the bid-ask bounce, so S12 overstates on wide-spread and
  coarse-step coins; the close is a trade price too (the c' term carries the bounce of the last trade). A no-trade minute gives 0.
time: As V7 (D-1 from B for the windows ending up to 00:59; the first year day FEW_BARS through 00:53, valued from 00:54).
output:
  group_file: X1/day=<D>/VOLX.parquet
  names:
    - name: S12
      label: garman_klass_vol_60m_pct
      units: percent over the 60 minutes (not annualised)
      value_kind: float
      decimals: none
      means: 100 x sqrt(60 x the mean Garman-Klass variance of the valued one-minute trade candles of the last hour)
  cadence: minute end (1,440 rows per coin per day, u = 00:00 to 23:59 of D)
  as_of_rule: as_of = u, the minute end
  known_at_rule: known_at = the latest known_at among the C13 rows read (at or before u); an empty row known_at = u; so known_at <= as_of on every row
  empty_reasons:
    - reason: FEW_BARS
      when: fewer than 54 of the 60 bars valued
    - reason: NO_HISTORY
      when: "D-1's file of B is missing and the window reaches D-1 (u up to 00:59 of a day after 10 Sep 2025); on 10 Sep 2025, the first year day, those windows are FEW_BARS"
    - reason: NO_ROSTER
      when: no roster file for D's week (the year root's ROSTER_<monday>.csv, the one command's --year-rosters, J16034 log f7a76cb0; every coin, the coin axis is D's roster)
  empty_order: the first that applies, in this order, NO_ROSTER, NO_HISTORY, FEW_BARS
  stale_rule: never stale
  max_staleness_s: 60
  window_days: 1
  no_history: "as V7: on 10 Sep 2025 FEW_BARS through 00:53 (the 00:00 bar has no open), valued from 00:54"
  fit_rule: none
  fifths: none
  flags:
    - flag: SHORT_WINDOW
      when: 54 to 59 of the 60 bars valued
edge_cases:
  - case: E1 the toy window
    input: "V7's 30 bars A and 30 bars B"
    answer: 'g(A) 0.00041137056388801255, g(B) 4.9999999999998925e-05; S12 11.76482763011866'
  - case: E2 a short window
    input: '30 bars A, 25 bars B, 5 not valued'
    answer: 'S12 12.176482661249631, flag SHORT_WINDOW'
  - case: E3 too short
    input: '53 bars valued'
    answer: S12 empty FEW_BARS
  - case: E4 a flat hour
    input: 'every bar O = H = L = C'
    answer: 'S12 = 0'
  - case: E5 the gap-down bar (V7 E5) in a flat hour
    input: 'O 100, high 99.1, low 99, close 99; 59 flat bars'
    answer: 'g = 1.148532139139672e-05 (the trades alone would give -3.8509666795767574e-05, below 0); S12 0.33890000577451634'
  - case: E6 all bars A
    input: '60 bars A'
    answer: 'S12 15.710580458175553'
unit_tests:
  - test: U1 (E1, E2, E3, E6)
    planted: "V7's U1 rows (each bar stepped from the previous close, as V7's U1 says: the expected numbers need it)"
    expect: 'S12 11.76482763011866; 12.176482661249631 SHORT_WINDOW; FEW_BARS; 15.710580458175553 within 1e-9 relative'
  - test: U2 (E4, E5)
    planted: "V7's U2 rows"
    expect: 'S12 0; 0.33890000577451634'
  - test: U3 the stamps and the day start
    planted: "V7's U3 rows"
    expect: "as V7's U3 and U4"
  - test: U5 a flat hour after a spike hour
    planted: '60 bars A then 60 flat bars (O = H = L = C) for one coin'
    expect: 'S12 exactly 0 at the end of the flat hour (sliding sums; a running sum leaves about 2.2e-7)'
mutants:
  - mutant: M1 the range not extended to the open (the trades' high and low alone, O the previous close)
    caught_by: 'U2 (E5''s bar gives -3.8509666795767574e-05 and S12 is the root of a negative: not a number)'
  - mutant: M2 the c' term dropped (Parkinson x 2 ln 2)
    caught_by: 'U1 (E6 gives 16.431676725154983)'
  - mutant: M3 the valued sum not scaled to 60
    caught_by: 'U1 (E2 gives 11.65809457700544)'
  - mutant: M4 log10 in place of ln
    caught_by: 'U1 (E1 gives 5.109399720303444)'
  - mutant: M6 running sums (a cumulative sum differenced, or bottleneck move_sum)
    caught_by: 'U5 (a tiny value, about 2.2e-07 for S11 in TREE''s cloud measure, not 0)'
real_check:
  points:
    - point: 2026-03-08, BTCUSDT, 1000PEPEUSDT and a thin coin (as V7), u = 00:10, 12:00, 23:59
      why: the window from D-1, a plain hour, the day's end
    - point: 2025-09-24, DASHUSDT, u = 10:41
      why: FEW_BARS (C13 empty at 33 of 60 minutes)
  pass: >-
    The tester recomputes S12, its flag and reason from this card's words on B's C13 rows (rawcheck/check_volx.py, never the
    producer's code): floats within 1e-9 relative, words equal. In VOLX's one small read-only runner job.
meaning_check:
  pass_lines:
    - "S12 >= 0 at every valued coin-minute of 8 Mar 2026 (the bar's range holds its open)"
    - "the bounce, as V7: the median of (S12 / 100)^2 over the clock hour's mid variance (the sum of V2's 12 S03) within 0.5 to 2.0 for BTC and ETH on 8 Mar 2026; a coin over 2.0 named with its price step"
  report_only:
    - S12 over S11 per coin (how much the open-to-close term takes out)
conclude:
  may:
    - how wide the coin's one-minute trade ranges were over the last hour net of their open-to-close moves, as a volatility in percent over the hour
  never:
    - "Hyperliquid's ranges (Binance trade candles, X7)"
    - "a mid volatility: C13's high, low and close are trade prices with the bid-ask bounce (ADDON_ARCHITECTURE_V4 section 11)"
    - S12 across coins without their price step
    - an annualised volatility
    - "a candle open of the exchange: the open is the previous minute's close"
readers: none yet (planned with V7, V9 against V2)
implementation:
  how: "V7's grids; the per-bar g as array operations; roll_points for the 60-minute sum and count (shared with V7, V9; sliding windows, never running sums). PHASES: none (B only)."
  kernel: addon_grid_v2.roll_points
  memory_mb: 50
  seconds_share: 0.2
data_checks: none

readers: none yet
implementation:
  how: >-
    Per coin, vectorised over the day, with F14 (the same bar sums and mids): DV and r per bar on each of the 12 phase grids; the
    ratio |r| / DV where DV > 0 and the count by a mask (never a division by 0); the ratio grid holds 0 where DV = 0 beside a 0/1 count grid, NaN only for an empty mid (roll_points' sum has min_count = n by default: one NaN bar would empty the window); roll_points' rolling sums of the ratios and of the
    counted bars over 60 bars on each phase grid; the 12 phase grids interleaved into the 17,280 points; D-1's part from the CARRY in
    phase B for u = 00:00:05 to 01:00:00. Dense [coin x 17,280] grids for the writer (ADDON_ARCHITECTURE_V4 section 2). No loop over
    rows or points in Python (a loop over the 12 phases).
  kernel: 'addon_grid_v2.roll_points (85c8ece1 line 186, how sum, n = 60: the ratios and the counted bars) on the 12 phase grids'
  memory_mb: 600
  seconds_share: 1
data_checks:
  - what: the CARRY of the first year day (are 9 Sep 2025's trades and book_ticker files held?)
    who: BED (a read-only runner job, with F14's)
  - what: "answered (edition 6): B1 rule 9's seen state at every moment of the window (prod_B1_v3 alive_all), its look-back into D-1 in the CARRY (D-1's live spans, bad rows, counts and thin end: the PHASES), its words TRADES_HOLE, THIN_FEED, BAD_INPUT"
    who: BED, checked by METRIC_AUDIT2 at review

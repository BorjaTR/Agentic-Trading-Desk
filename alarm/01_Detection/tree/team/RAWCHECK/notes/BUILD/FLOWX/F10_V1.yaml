readers: none yet
implementation:
  how: >-
    In F1's pass over the sorted aggTrades and their arrivals: each aggTrade adds +1 at the first 5 s point u >= max(T, arrival) and -1 at
    the first point u >= T + 60 s (searchsorted on the 17,280 points; nothing when the first is not before the second), both by bincount,
    then one cumulative sum, int64; D-1's part from the CARRY added at 00:00:05 to 00:00:55. known_at by a sliding maximum of the
    arrivals over the same intervals (the latest arrival among the rows whose interval holds u), not by a cumulative sum. Vectorised over the day and all coins, no
    loop over rows or points in Python.
  kernel: 'new: window_stamped (EDGE1''s planned name, REVIEW_LEAD_EDGE1_V1 line 69; a row''s first point = the first 5 s point at or after max(T, arrival), its last = the last point before T + W; a difference array over the points and one cumulative sum); addon_grid_v2.per_window (85c8ece1 line 169) windows on arrival alone, so it is not this rule, only its cross-check where every arrival equals T'
  memory_mb: 400
  seconds_share: 1
data_checks:
  - what: F1's data checks on the readers (D4 held days, trade id agreement) and on the 00:00:00 row (D's aggTrades at T = 00:00:00.000, E11); the floor's is not F10's
    who: as F1 (the sources seat, BED, EDGE1)

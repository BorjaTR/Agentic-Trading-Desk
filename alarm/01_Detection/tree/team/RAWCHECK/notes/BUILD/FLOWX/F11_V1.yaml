    - 'On BTCUSDT of the checked days, F11 at 23:55:00 has the sign of the sum of B1 S01 - B1 S02 over the minute ends of D to 23:55 (the same rows less the late ones); a different sign means the late rows carry the day (reported with the count of late rows)'
  report_only:

implementation:
  how: >-
    Per coin, vectorised over the day: good rows, signed dollars as exact integers (price and quantity in their own steps); each row's
    first counted point = the first 5 s point >= max(T, arr); np.bincount of the signed dollars into the 17,280 points, np.cumsum, one
    float64 conversion; known_at by np.maximum.at per point then np.maximum.accumulate; GAPS by the cumulative count of unseen points;
    the 00:00:00 row from the CARRY. Dense [coin x 17,280] grids for the writer's column contract (ADDON_ARCHITECTURE_V4 section 2). No loop
    over rows or points in Python. The trades pack is read once per day for F11, F12, F13, F16.
  kernel: 'new: entry_cumsum (each row added at the first 5 s point at or after max(T, arrival) and kept to the day''s end: one cumulative sum; no exit, so not addon_grid_v2.per_window)'
  memory_mb: 300
  seconds_share: 0.5

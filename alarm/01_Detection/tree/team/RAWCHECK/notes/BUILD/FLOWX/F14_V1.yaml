  pass: >-
    The tester recomputes F14, its empty reasons, flags, stale and known_at at every point from this card's words with Fraction on the
    readers' rows (never the producer's code): floats within 1e-9 relative of the Fraction recompute (V2 4.5), words equal; screamer

conclude:
  may:
    - the values are Binance USDT-M's (Binance futures trades and book_ticker; RULING 3, REVIEW_LEAD_EDGE1_V1 X7)
    - how many bps this coin's mid moved per $M of net taker dollars over the last hour's 60 bars (a fitted slope with an intercept)
    - a coin against itself across hours and days
  never:
    - Hyperliquid's flow, price impact or cost (another venue, where the owner trades; these are Binance's values)
    - a cost in dollars of a given order
    - a causal impact (a regression of 60 points)
    - 'an impact per order: the flow is the net of taker trades (fills), not of orders (RULING 3, the name says what the value is)'
readers: none yet
implementation:
  how: >-
    Per coin, vectorised over the day: good trade rows with signed dollars as exact integers; for each of the 12 phases, each row's bar
    by its T on that phase's 60 s grid and the bar sums by np.bincount; the rows with T <= u < arr removed from their bar at u by the
    arrival mask (a small block per point); the mids at every 5 s point by in_force on the book_ticker pack (searchsorted on max(t, arr), CARD_C13_V4 rule 9, the rows with t < 0 or arr < 0 dropped first as prod_C13_v3 line 142; the
    30 s cap on the stamp, a bad row never stands: in_force with bad_ends False), so 1,441 mids per phase grid; y per bar; run_beta's running sums of x, y, xy, xx over 60 bars on
    each phase grid (the 1e-9 check of V2 4.5 against the Fraction recompute decides; centered sums per window are the fallback); the
    12 phase grids interleaved into the 17,280 points; D-1's part from the CARRY in phase B for u = 00:00:05 to 01:00:00. Dense
    [coin x 17,280] grids for the writer (ADDON_ARCHITECTURE_V4 section 2). No loop over rows or points in Python (a loop over the 12
    phases). Shared with F15; the trades pack is read once per day with F11, F12, F13, F16.
  kernel: 'addon_grid_v2.run_beta (85c8ece1 line 291: rolling slope with an intercept by running sums of x, y, xy, xx, n = 60) on the 12 phase grids of 60 s bars'
  memory_mb: 600
  seconds_share: 2
data_checks:
  - what: the CARRY of the first year day (are 9 Sep 2025's trades and book_ticker files held?)
    who: BED (a read-only runner job)
  - what: "answered (edition 6): B1 rule 9's seen state at every moment of the window (prod_B1_v3 alive_all), its look-back into D-1 in the CARRY (D-1's live spans, bad rows, counts and thin end: the PHASES), its words TRADES_HOLE, THIN_FEED, BAD_INPUT"
    who: BED, checked by METRIC_AUDIT2 at review

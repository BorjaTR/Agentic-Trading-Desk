kind: build_metric
id: F14
producer: FLOWX
item: 'Kyle lambda, intraday'
tier: BUILD
name: >-
  Binance Kyle's lambda, intraday: the slope with intercept of the mid's move in bps on the net taker dollars in $M, over the 60 bars of
  60 s ending at u
status:
  drafter: BED
  reviewer: METRIC_AUDIT2
  edition: 6
  signed: false
means: >-
  How many bps the mid moved per million dollars of net taker buying, fitted over the last hour as 60 bars of one minute ending at u
  (a line with an intercept), written every 5 s: high means a small net flow moved the price a lot.
example: >-
  A toy of 5 bars (the card uses 60): net taker flow 1, 2, -1, 0, 3 $M and mid moves 1, 3, -1, 0, 4 bps give the slope 13/10 =
  1.300000000 bps per $M and the intercept 1/10 = 0.1000000000; a line forced through 0 would give 20/15 = 4/3 = 1.333333333 (the
  defect the tests catch). The plant P of U2 (bar flows 2, -1, 0, 3, 1 $M and mids 10,003, 10,002, 10,002, 10,004, 10,000 from
  10,000, twelve times) gives 450155009/500250030 = 0.8998600340 bps per $M at 12:00:00, and at 12:00:05, with one more buy and one
  more book row, -23631652330844/27066011198149 = -0.8731117473 (E11).
formula: >-
  For one coin and the 5 s point u (00:00:00, 00:00:05, ..., 23:59:55 of D): the 60 bars of 60 s ending at u, bar k = (u - 60k s,
  u - 60(k-1) s], k = 1 to 60. x_k = (buy dollars - sell dollars of the trades reader's good rows (bad false; a repeated row counted each time, flagged DUPLICATE_ROW: B1 rule 17, Y6; a row with no stamp in no bar and no BAD_INPUT: Y5) with T in bar
  k and arr <= u, received by u) / 10^6, the taker side from the reader's side, dollars = the reader's units (the row's dollars px x am at 10^-(pp + qp), exact; Y3); the sums exact on integers (the
  price and the quantity in their own steps), turned into float64 once. The mid m(t) = (bid + ask) / 2 of the book_ticker state in force at t by CARD_C13_V4 rules 9, 11, 12 (lines 108 to 111): the last good row in file order stamped at or before t and received by t; a bad row never stands, the good row before it does (flag SKIPPED_BAD_ROW); BOOK_HOLE when no row stands or the row in force was stamped more than 30 s before t (an age of exactly 30 s stands); a row with no stamp is bad (the reader's why 2 STAMP): it never stands and raises no flag (the year's prod_C13_v3 50cb8805 line 142 keeps only rows with t >= 0 and arr >= 0 for the row in force and the skip flag) (prod_reader_book_ticker_v2; addon_grid_v2.in_force with bad_ends False: C13 S05's rule, METRIC_AUDIT2 FB). y_k = 10^4
  (m(u - 60(k-1) s) / m(u - 60k s) - 1), the mid's move over bar k in bps (61 mids, at u - 3600 s to u). lambda = sum_k (x_k - mean
  x)(y_k - mean y) / sum_k (x_k - mean x)^2, the least squares slope WITH an intercept, means over the 60 bars; exact, no rounding
  (float64, decimals none). Empty, the first that applies in this order: (1) NO_FILE, a needed file missing or only .part (X1, on any day: D's trades or book_ticker file at every row of D; D-1's trades file when the window reaches D-1, u = 00:00:00 to 01:00:00; D-1's book_ticker file when a mid of the 61 needs it, no good row of D standing at that time: CARD_C13_V4 rules 9, 11); an EMPTY or header-only file is there with no rows (no trade: TRADES_HOLE, not NO_FILE, CARD_B3_V4 line 116; the mid BOOK_HOLE); (2) none since edition 3; (3) the first in time
  of: the coin not seen by B1 rule 9 at some moment of [u - 3600 s, u] (seen at every moment through the window, CARD_B1_V7 line 161,
  CARD_B3_V4 line 117, prod_B1_v3 alive_all: a trade in [e - 60 s, e] received by e at every moment e, no thin minute from the one
  before the window's start to the last full one before u, no bad trade row stamped in the window and received by u; reader v6's alive
  and thin; its reason TRADES_HOLE, THIN_FEED or BAD_INPUT) and an empty mid at one of the 61 times (BOOK_HOLE); at one time the seen reason comes first;
  (4) sum_k (x_k - mean x)^2 = 0, decided on the exact integer bar sums, never on run_beta's float running sums (all 60 x equal, e.g. all 0): ZERO_FLOW_VAR. A seen bar with no trade is a measured x = 0 and is
  counted. Negative values are valid results.
  THE 00:00 POINTS (REVIEW_LEAD_EDGE1_V1 X3): when D's file is missing and D-1's is there, phase B writes the 00:00:00 row NO_FILE too (the year reads D's file there); the 00:00:00 point is completed in phase B after D's rows at exactly 00:00:00.000000 are added.
source:
  kind: paper
  ref: >-
    Kyle 1985 (Econometrica 53(6)): lambda, the price move per unit of net order flow; RESEARCH_TOOLS_V1 6.5 (BUILD, no tool on our
    rows); screamer RollingKyleLambda (cov / var with an intercept) as the oracle in the real check. Named differences: ours is
    intraday, the mid's move in bps on the net taker dollars in $M of 60 bars of 60 s ending at each 5 s point (BRIEF_FLOWX_V4_DELTA
    item 4); Easley et al. 2024's ratio form is another definition, not this one.
inputs:
  - kind: reader
    ref: prod_reader_trades_v1
    exists: true
    stream: Tardis binance-futures trades (the year's trades stream)
    fields: t (T), arr, side, px, units, bad, dup, line (prod_reader_trades_v1 926b7ff5 lines 11 to 13, as the hand work cites); prod_reader_trades_v2, when it lands, gives the same rows (tested equal to v1 packs)
    rule_in_force: every good row (bad false; repeats counted, Y6) with T in (u - 3600 s, u] and arr <= u, in its bar by T; the coin's seen state by B1 rule 9 on the same rows at every moment of [u - 3600 s, u] (reader v6's alive and thin)
    stale_rule: none per row (a trade is an event); stale comes from the seen state (B1 rule 22, output.stale_rule)
    days: >-
      D. PHASES (ADDON_ARCHITECTURE_V4 edit 3 section 4; Y1): phase A of D, days in parallel and without the CARRY, makes only the point-local records of D's raw: per phase grid the exact buy and sell dollar sums of D's bars by arrival, D's mids at its 5 s points from D's book rows (the points where no row of D stands marked for phase B), D's minute trade counts, live spans and bad trade rows (reader v6). Phase B, day after day with the CARRY of D-1, makes every value: the seen state at every moment of each window (alive from D-1's live spans; thin from D-1's counts and thin(D-1, 0)'s end), the mids that need D-1's book state, the 60-bar values for u = 00:00:05 to 01:00:00 with D-1's part, the 00:00:00 point (NO_FILE when D's file is missing, X3). No value is final in phase A. THE CARRY (X1/carry/FLOWX/<D-1>.npz): the exact buy and sell dollar sums by arrival of D-1's trades for the 60 s bars of each of the 12 phases in D-1's last 3,600 s (the part of a bar straddling 00:00 included); D-1's mids at its 5 s points of its last 3,600 s with their rows' arr and the book state in force at 24:00 (the mid at 00:00:00 of D and D's first 30 s); D-1's 1,440 minute trade counts and thin(D-1, 0)'s end (on, good); D-1's live spans and bad trade rows of its last 3,600 s; whether D-1's trades and book_ticker files exist (X1). The first year day reads 9 Sep 2025's raw once for the first CARRY (R2); if it is not held, every row that needs it is empty NO_FILE (E10).
  - kind: reader
    ref: prod_reader_book_ticker_v2
    exists: true
    stream: book_ticker (binance-futures, book_ticker_<SYMBOL>_<YYYY-MM-DD>.csv.gz, as the K1 format example cites)
    fields: t, arr, bid_px, ask_px (int64, price x 10^pp), bad, why, dup; meta pp, status, content_sha16 (as the K1 format example cites)
    rule_in_force: "CARD_C13_V4 rules 9, 11, 12 (lines 108 to 111): the last good row in file order stamped at or before t and received by t; a bad row never stands (the good row before it does, flagged SKIPPED_BAD_ROW); a row with no stamp is bad (the reader's why 2 STAMP): it never stands and raises no flag (the year's prod_C13_v3 50cb8805 line 142 keeps only rows with t >= 0 and arr >= 0 for the row in force and the skip flag)"
    stale_rule: "the 30 s cap on the stamp's age (CARD_C13_V4 rule 11): older gives an empty mid, BOOK_HOLE"
    days: >-
      D; D-1's part (its mids of its last 3,600 s with their rows' arr, the state in force at 24:00, whether its book file exists) in the CARRY above (the PHASES)
  - kind: reader
    ref: prod_reader_liquidations_v6
    exists: true
    stream: "the trades files' two stamp columns, as B1 reads them for its seen state (CARD_B1_V7 line 150: alive and thin through prod_reader_liquidations_v6.py; prod_B1_v3 efc2bc52 line 117): the minute counts (a trade counted in its minute when received by the minute's end) and the live spans (a trade stamped t, received a, makes the coin alive at every moment from max(t, a) to t + 60 s), 8566228f lines 98 to 116"
    rule_in_force: "B1 rule 9's alive (a trade in [e - 60 s, e] received by e) and thin (R8: the base the median of D-1's 1,440 minute counts; a minute under 1 percent turns it on; while on, 5 minutes in a row at 20 percent or more end it; D's start is thin(D-1, 0)'s end, B1 rule 19)"
    stale_rule: "B1 rule 22 (TRADES_HOLE, THIN_FEED: stale 1); D-1's trades file missing or a base of 0: thin off, flagged NO_RATE_BASE (B1 rule 19; CARD_B3_V4 rule 8, E51)"
    days: "D-2, D-1 and D (D's base is D-1's counts; D's start is thin(D-1, 0)'s end, whose base is D-2's counts). Measured on 8 Mar 2026 (J16034, log f7a76cb05e789815): BTC 3.24 s, DOGE 1.03 s, CRV 0.10 s a pack. It parses each trades file a second time beside the trades reader (ADDON_ARCHITECTURE_V4 9.3 rule 1): FOR EDGE1, a seen-state kernel on the shared trades pack, tested equal to v6"
overlaps:
  - setting: C13 S05
    kind: copy
    why: >-
      The year's mid at the minute end (MEANING_C13_V4, LIMITS; the row in force, 30 s at most, the hand work): at a minute end t, m(t)
      is the same state from the same rule, a cross-check (meaning_check line 2); this card's first edition read it.
  - setting: B1 S01, B1 S02
    kind: other_metric
    why: >-
      The year's taker buy and sell dollars of each minute (SETTINGS_B1_V2: (e - 60 s, e] received by e, whole dollars): at a minute end
      u, bar k's x is their net at u - 60(k-1) s / 10^6, except the rows received after their minute end but by u (the year leaves them
      out, the bar counts them) and the year's whole-dollar rounding.
per_coin: >-
  Every roster coin of D (the year root's ROSTER_<monday>.csv of D's week, the one command's --year-rosters: knowledge/roster/ starts at
  ROSTER_20251006, J16034; Y8, X11). Thin coins: many bars with flow 0 (valued, a measured 0), silences
  in the book (BOOK_HOLE) and points not seen (B1 rule 9), so a thin coin is often empty or ZERO_FLOW_VAR (every x 0). 1000-coins:
  the reader's units are still dollars and the move is in bps, so the 1000 prefix changes nothing. A wide-step coin's one-step mid move is many
  bps, so y takes few values.
time: >-
  Every 5 s point has its own 60 bars: the 12 phases of u within the minute are 12 grids of 60 s bars. The 00:00 start: the 00:00:00
  row is D-1's 24:00:00 row from the CARRY; u = 00:00:05 to 01:00:00 read D-1's part (bar sums and mids) from the CARRY, assembled in
  phase B. The first year day (10 Sep 2025) reads 9 Sep 2025's raw once if held, else u = 00:00:00 to 01:00:00 are empty NO_FILE (X1). Crash days (10 Oct 2025 evening): large flows and moves, still one slope over 60 points. Funding settles
  (00:00, 08:00, 16:00 UTC) and quarter hours are ordinary points for the formula.
output:
  group_file: X1/day=<D>/FLOWX.parquet
  names:
    - name: S14
      label: bn_kyle_lambda_bps_per_musd_60m
      units: bps of the mid per $M of net taker dollars
      value_kind: float
      decimals: none
      means: the slope with intercept of the mid's move (bps) on the net taker dollars ($M) over the 60 bars of 60 s ending at the 5 s point u
  grid: 5s
  cadence: 'every 5 s (minute ends included): 17,280 points per coin per day, u = 00:00:00, 00:00:05, ..., 23:59:55 of D'
  as_of_rule: as_of = u, the 5 s point
  known_at_rule: >-
    known_at = the latest arr of the rows used (the trades counted, each arr <= u, and the book rows of the 61 mids, each arr <= its
    time <= u); an empty row has known_at = as_of = u. So known_at <= as_of on every row, empty rows too.
  empty_reasons:
    - reason: NO_FILE
      when: "a needed file is missing (formula step 1, on any day): D's trades or book_ticker file at every row of D; D-1's trades file at u = 00:00:00 to 01:00:00; D-1's book_ticker file at a u whose 61 mid times include one with no good row of D standing (CARD_C13_V4 rules 9, 11); an EMPTY or header-only file is there (TRADES_HOLE or BOOK_HOLE, not NO_FILE); X1, no flag on an empty row"
    - reason: TRADES_HOLE
      when: the first in time is a moment of the window where the coin is not seen by B1 rule 9 with this reason
    - reason: THIN_FEED
      when: the first in time is a moment of the window where the coin is not seen by B1 rule 9 with this reason
    - reason: BAD_INPUT
      when: the first in time is a moment of the window where the coin is not seen by B1 rule 9 with this reason (a bad row)
    - reason: BOOK_HOLE
      when: the first in time is one of the 61 mid times with no book_ticker state in force (no good row stamped and received by t, or the row in force stamped more than 30 s before t; an EMPTY book file gives it all day)
    - reason: ZERO_FLOW_VAR
      when: nothing above applies and sum_k (x_k - mean x)^2 = 0 (all 60 x equal, e.g. all 0)
  stale_rule: stale = 1 on a row empty TRADES_HOLE or THIN_FEED (B1 rule 22, a time-window name) or BOOK_HOLE (CARD_C13_V4 rule 11 line 110 and line 78, the book state is stale); else 0
  max_staleness_s: 30
  window_days: 0
  no_history: >-
    the 60 bars reach at most D-1's last hour, through the CARRY (no whole day before D); on the first year day without 9 Sep 2025's
    raw the rows u = 00:00:00 to 01:00:00 are empty NO_FILE (X1; no flag on an empty row); no learn days after it
  fit_rule: none
  fifths: none
  flags:
    - flag: SKIPPED_BAD_ROW
      when: on a valued row, a bad book row stamped and received by one of the 61 mid times came after the row in force (CARD_C13_V4 rule 12)
    - flag: NO_RATE_BASE
      when: "on a valued row when the thin base or start is missing (D-1's trades file missing, or the median of D-1's minute counts 0): the coin is read as not thin (B1 rule 19; CARD_B3_V4 rule 8, E51)"
    - flag: DUPLICATE_ROW
      when: "on a valued row that counts a repeated row (an agg id or a trade id seen before in its file): it counts each time (B1 rule 17, A1 rule 10)"
edge_cases:
  - case: E1 the hand work's toy of 5 points (the slope kernel alone)
    input: 'x = 1, 2, -1, 0, 3 ($M); y = 1, 3, -1, 0, 4 (bps)'
    answer: 'mean x 1, mean y 7/5; sum (x - mean)(y - mean) 13, sum (x - mean)^2 10: slope 13/10 = 1.300000000, intercept 1/10 = 0.1000000000; through 0: 20/15 = 4/3 = 1.333333333'
  - case: E2 the plant P at the minute end 12:00:00 (every row good, the coin seen throughout)
    input: >-
      u = 12:00:00 of D. Book rows (pp 2) every 15 s at :14, :29, :44, :59: the rows 10:59:59 to 11:00:44 at bid 9,999.50 and ask
      10,000.50 (mid 10,000.00); the rows from hh:mm-1:59 to hh:mm:44 at the mid M(hh:mm) +- 0.50, M for 11:01 to 12:00 the block
      10,003.00, 10,002.00, 10,002.00, 10,004.00, 10,000.00 twelve times. Trades: for the bar ending hh:mm (11:01 to 12:00) its buy
      dollars at T hh:mm-1:03.000 and its sell dollars at hh:mm-1:04.000, arr = T + 10 ms, the block (2,000,000, 0), (0, 1,000,000),
      (no trade), (3,500,000, 500,000), (1,500,000, 500,000) twelve times
    answer: >-
      x block 2, -1, 0, 3, 1; y block 3, -10000/10003 = -0.9997000900, 0, 10000/5001 = 1.999600080, -10000/2501 = -3.998400640;
      F14 = 450155009/500250030 = 0.8998600340 (intercept -225047491/250175030 = -0.8995601639, not written); known_at 11:59:59.000
      (the book row of m(12:00:00); the last trade arrived 11:59:04.010); stale 0
  - case: E3 all x equal
    input: 'P with its trades replaced by one buy of 250,000 in every bar (at hh:mm-1:03.000), x = 0.25 at all 60; again with no trade at all'
    answer: 'empty ZERO_FLOW_VAR both; known_at = u; stale 0'
  - case: E4 an unseen point and a skipped bad book row
    input: 'P with the coin planted not seen (TRADES_HOLE) at the 5 s point 11:20:00 and a bad book row (CROSSED) at arr 11:49:59.500 (m(11:50:00) from the good row before it, flagged SKIPPED_BAD_ROW: CARD_C13_V4 rule 12)'
    answer: 'empty TRADES_HOLE (the first in time); stale 1; known_at = u'
  - case: E5 an unseen point and a book hole at one time
    input: 'P with the coin planted not seen (THIN_FEED) at 11:30:00 and P''s book rows stamped 11:29:29, 11:29:44, 11:29:59 left out (the row in force at 11:30:00 stamped 11:29:14, 46 s old: BOOK_HOLE)'
    answer: 'empty THIN_FEED (at one time the seen reason comes first); stale 1; known_at = u'
  - case: E6 a bad book row alone, and the 30 s cap on the stamp
    input: 'P with only the bad book row stamped and received 11:49:59.500 (after P''s good row of 11:49:59); again P with the last book row before 12:00:00 stamped and received 11:59:30.000 (age 30 s) and then stamped and received 11:59:29.999 (age 30.001 s), its mid M(12:00)'
    answer: 'the bad row: the good row of 11:49:59 stands (CARD_C13_V4 rule 12), F14 = 0.8998600340, flag SKIPPED_BAD_ROW; age 30 s: in force, F14 = 0.8998600340; age 30.001 s: empty BOOK_HOLE, stale 1'
  - case: E7 a negative lambda
    input: P with every trade's taker side swapped (buy for sell), the mids unchanged
    answer: 'F14 = -450155009/500250030 = -0.8998600340, valued (a negative slope is a result, never empty)'
  - case: E8 a seen bar with no trade
    input: P's third bar of each block (no trade)
    answer: 'x = 0, counted in the 60 (a measured 0): part of E2''s 0.8998600340'
  - case: E9 the 00:00 start with the CARRY
    input: 'P placed with its first mid at 23:00:00 of D-1 and its bars ending 23:01 to 24:00 of D-1; again placed with its first mid at 23:30:00 of D-1 and its bars ending 23:31 of D-1 to 00:30 of D'
    answer: 'F14(00:00:00 of D) = D-1''s 24:00:00 row = 0.8998600340; F14(00:30:00 of D) = 0.8998600340 (D-1''s 30 bars and mids from the CARRY, assembled in phase B)'
  - case: E10 the first year day without the CARRY
    input: 'D = 10 Sep 2025, 9 Sep 2025 not held; P placed with its first mid at 01:00:00 (book rows from 00:59:59) and its bars ending 01:01 to 02:00, the coin planted seen'
    answer: 'u = 00:00:00 to 01:59:55: empty NO_FILE (to 01:00:00 the window reaches D-1''s trades file; from 01:00:05 a mid of the 61 needs D-1''s book_ticker file, no good row of D standing before 00:59:59: CARD_C13_V4 rules 9, 11; not held, no flag), known_at = u, stale 0; u = 02:00:00: F14 = 0.8998600340'
  - case: E11 a 5 s point that is not a minute end (12:00:05, which rows enter and leave)
    input: 'P plus a buy of 1,000,000 at T 12:00:02.000 (arr 12:00:02.010) and a book row at arr 12:00:01.000, bid 10,005.50, ask 10,006.50; u = 12:00:05'
    answer: >-
      bars (12:00:05 - 60k s, 12:00:05 - 60(k-1) s]: the trades of the bar ending 11:01 (T 11:00:03, 11:00:04) leave; every other bar's
      trades sit one bar later against the mids (bar k >= 2 holds P's bar k - 1); bar 1 holds the new buy, x = 1; the mids at
      11:00:05 to 11:59:05 are P's M(11:00) to M(11:59) (rows hh:mm-1:59, age 6 s) and m(12:00:05) = 10,006.00, so y_1 = 5000/2501 =
      1.999200320 and y_k = P's y_k for k >= 2: F14 = -23631652330844/27066011198149 = -0.8731117473; known_at 12:00:02.010; stale 0
  - case: E12 known_at is the latest arrival used
    input: P with the book row of m(12:00:00) at arr 11:59:59.800 in place of 11:59:59.000
    answer: 'known_at = 11:59:59.800 (<= as_of 12:00:00); F14 = 0.8998600340'
  - case: E13 the age is the stamp's, not the arrival's (CARD_C13_V4 rule 11)
    input: 'P with the last book row before 12:00:00 stamped 11:59:29.999 and received 11:59:30.005, its mid M(12:00)'
    answer: 'by the stamp 30.001 s old: m(12:00:00) empty BOOK_HOLE, F14 empty BOOK_HOLE, stale 1, known_at = u (by the arrival, 29.995 s, it would stand)'
  - case: E14 a book row with no stamp, mid-day (X2)
    input: 'P with a book row with no stamp (t = arr = -1; bid 10,004.50, ask 10,005.50, mid 10,005.00) next in the file after P''s row of 11:58:59 (REVIEW_LEAD_EDGE1_V1 X2, prod_reader_book_ticker_v2 lines 18, 135)'
    answer: 'the row is bad (why 2 STAMP) and never stands (CARD_C13_V4 rule 12; the year''s prod_C13_v3 line 142 keeps only rows with t >= 0 and arr >= 0, so P''s row of 11:58:59 stands: m(11:59:00) = 10,004.00 as in E2, F14 = 450155009/500250030 = 0.8998600340, no flag, known_at as E2 (read as good it would give 1375472527/1500750090 = 0.9165233680)'
  - case: E15 seen at every moment, not at the 5 s points only
    input: "P with the coin's seen state from background trades (a buy and a sell of the same size every second, received at once, net 0 dollars; D-1's minute counts 60 each) except none in (11:21:05.500, 11:22:06.500) (P's own trades at hh:mm-1:03 and hh:mm-1:04 lie outside it: the bar ending 11:23 has no trade, the last P trade before is the sell at 11:21:04.000)"
    answer: 'F14(12:00:00) empty TRADES_HOLE, stale 1, known_at = u (the moments in (11:22:05.000, 11:22:07.000) have no trade in the 60 s before them: the last is the background trade of 11:21:05.000, the next 11:22:07.000; every 5 s point is seen, so a check at the 5 s points only would give 0.8998600340)'
  - case: E16 a 1000-coin
    input: "P on 1000PEPEUSDT (p per 1,000 coins, am in thousands: the reader's units still dollars; the mid's move in bps)"
    answer: 'F14 = 0.8998600340 as E2 (the 1000 prefix changes nothing)'
  - case: E17 a trade row with no stamp (Y5, X2)
    input: "P plus a trade row with timestamp and local_timestamp empty (t = arr = -1, bad), a buy of 5,000,000"
    answer: 'in no bar and no BAD_INPUT: F14 = 0.8998600340 as E2, no flag'

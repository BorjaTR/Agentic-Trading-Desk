      On 2026-03-08 and 2025-09-24: F14 of the thin coin above BTC's at more than half of the 5 s points where both are valued (the
      hand work: a price impact must fall with depth, 'at most minutes'); if not, reported and the name reviewed.
    - >-
      At every minute end t of 2026-03-08 where both are valued: m(t) equals the year's C13 S05 at t exactly (C13 S05 is the exact mid: CARD_C13_V4 rule 10 line

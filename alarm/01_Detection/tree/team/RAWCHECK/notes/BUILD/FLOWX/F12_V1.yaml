  - mutant: M1 include_open_bucket (the open bucket counted as the newest of the n)
    caught_by: 'U1 (with the open buy 30: (60 + 20 + 30)/300 = 11/30 = 0.3666666667 against 8/15 = 0.5333333333)'
  - mutant: M2 no_split (a straddling trade kept whole in the bucket it starts)
    caught_by: 'U3 (the buy 250 whole in bucket 51: (1,500 - 40 + 250)/5,000 = 171/500 = 0.3420000000 at 00:00:05 against 81/250 = 0.3240000000); U2 (one bucket of 130, B 60 S 70: no value against 3/10)'
  - mutant: M3 v_from_D (V from D's own volume, a look-ahead known only at 24:00 of D)
    caught_by: 'U3 (V = 250/50 = 5: every bucket one side only, S12 = 1 at 00:00:00 and 00:00:05 against 3/10 and 81/250)'
  - mutant: M4 bvc_side (the paper's bulk classification by the price change in place of the taker side)
    caught_by: 'U1 planted with every trade at one price: a zero price change gives Z(0) = 1/2, every bucket half and half, S12 = 0 (or no number when the spread of the price changes is 0) against 8/15 = 0.5333333333'
  - mutant: M5 minute_grid (only the minute ends computed, held for 60 s)

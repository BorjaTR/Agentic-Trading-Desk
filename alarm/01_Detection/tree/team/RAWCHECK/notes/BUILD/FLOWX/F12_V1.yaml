  - mutant: M6 dup_dropped (a repeated row poured once)
    caught_by: 'U6 E12 (81/250 against 9/25)'
  - mutant: M7 own_scales (D-1's and D's v each on its file's scale)
    caught_by: 'U6 E17 (a value other than 81/250 at 00:00:05)'
  - mutant: M8 stampless_bad (a trade row with no stamp gives BAD_INPUT)

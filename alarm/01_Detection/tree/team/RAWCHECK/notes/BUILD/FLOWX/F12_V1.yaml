real_check:
  points:
    - point: 2026-03-08, BTCUSDT and one thin coin (the tester names it), the points 00:00:00, 12:00:00 and 23:59:55
      why: the year's checked day; the 00:00:00 row from the CARRY of 7 Mar 2026; trades are the year's stream (held)
    - point: 2026-03-08, BTCUSDT, 12:00:05 to 12:01:00 every 5 s
      why: 5 s points that are not minute ends (a bucket closing between minute ends)
    - point: 2025-09-24, the same two coins, the points 00:00:00, 12:00:00 and 23:59:55
      why: the year's other checked day and the CARRY of 23 Sep 2025; the raw check names the 12 minutes of 22 to 24 Sep 2025 where the ARCHIVE_DISK2 copy lacks taker rows the year's B1 has (J15991)
    - point: 2025-10-10, BTCUSDT and the thin coin, the 10 minute ends with the largest A1 liquidation dollars that evening (the tester picks them from A1 before the job), each with its 11 points after it
      why: the crash, one-sided buckets
    - point: 2025-10-11, BTCUSDT and the thin coin, the points 00:00:00, 06:00:00, 12:00:00 and 18:00:00
      why: the crash day's next day has a large V_D (fewer buckets close, stale more often)
  pass: >-
    The tester recomputes S12, V_D, the 50 carried imbalances, the empty reasons, flags, stale and known_at at every point from this card's
    words, with Fraction on the trades reader's rows (never the producer's code): floats equal within 1e-9 relative of the Fraction
    recompute, words equal. screamer 3.6.0 VPIN runs on the same rows as the oracle (the tool against ours). One small runner job.
meaning_check:
  pass_lines:
    - 'At the real-check points: screamer 3.6.0 VPIN on the same rows (our wrapper: bucket_volume 1 on v / V_D, the true taker sides) equals S12 within 1e-9 relative.'
    - 'On the checked days, the Spearman correlation of S12 with B2 S01 over the valued minute ends is under 0.9 (proposed level, EDGE1 or the owner sets it); FORMULA_B2_V1 found 0.03 and 0.06 on klines (J15955); above it, the paper''s VPIN and B2 S01 read one quantity'
  report_only:
    - 'FORMULA_B2_V1 B2.CB1: S12 against B2 S01 (another quantity: Spearman 0.03 and 0.06 on klines, J15955)'
    - 'B2.CB2: the 0.60 level (no coin at 0.60 on the paper''s VPIN, J15955)'
    - 'the kill test of RESEARCH_TOOLS_V1 6.3 (the test_condition): the partial correlation of S12 with the next hour''s realised variance given the trailing realised variance and volume'
conclude:
  may:
    - the values are Binance USDT-M's (Binance futures trades and aggTrades; RULING 3, REVIEW_LEAD_EDGE1_V1 X7)
    - how one-sided the coin's taker volume was over its last 50 buckets of D-1's volume / 50, as received by u
    - the coin against itself across days (the ratio is within the coin)
  never:
    - Hyperliquid's flow, price impact or cost (another venue, where the owner trades; these are Binance's values)
    - a probability of informed trading in itself (it is a one-sidedness share)
    - B2 S01 or B2 S02 (fills-scale buckets; S12 is a day-scale bucket)
    - 'orders: the buckets pour trades (fills) on their taker side, not orders (RULING 3: the name says what the value is)'
    - the paper's own number on the same coin (another V and another side rule; the named differences)
    - a signal for a chain before its test_condition is met (BUILD_TEST)
readers: none yet (BUILD_TEST, read by no chain until the test_condition is met)
implementation:
  how: >-
    Per coin, in phase B (it needs V_D from the CARRY): D's good rows stable-sorted on (T, line); the pour of the rows received by 23:59:55
    of D vectorised (the cumulative volume after the CARRY, the bucket index = floor(cumulative / V_D), the straddling rows split at the
    bucket edges, buy and sell per bucket by np.bincount, exact in integers when the units are whole: each v x 50 against a bucket of D-1's
    total volume); per bucket its closing row and the running max of arrival up to it; at the 17,280 points the closed buckets of the
    stable prefix (the rows before the first row with T <= u not yet received) by np.searchsorted, and the few received rows after it
    poured on top, vectorised over the points that have such a tail; the last-50 sum by cumulative sums over the bucket axis (the CARRY's
    50 first). S12 = that sum over D-1's volume, one division. No loop over rows or points in Python (numba is not installed:
    ADDON_ARCHITECTURE_V4 9.3 rule 7). The trades pack is read once per day for F11, F12, F13, F16.
  kernel: 'new: vpin_pour (the vectorised pour; the last 50 closed buckets by a cumulative sum over the buckets, not addon_grid_v2.roll_points: buckets are not points)'
  memory_mb: 400
  seconds_share: 2
data_checks:
  - what: >-
      known_at: the brief says the arrival of the trade that closed the last full bucket; when a row placed before it (earlier T) arrived
      after it, this card takes the latest arrival of the rows poured up to it (E6: 00:01:00.040, not 00:00:01.020), else two rows with
      different values would share one known_at
    who: EDGE1, with METRIC_AUDIT2
  - what: the CARRY of the first year day (are 9 Sep 2025's trades held?)
    who: BED (a read-only runner job)
  - what: "answered (edition 6, Y3): the units are whole numbers, the row's dollars at 10^-(pp + qp) (prod_reader_trades_v1 926b7ff5 lines 7 to 10, 82); v = units / px is am exactly, at 10^-qp, so the pour runs in int64 on the common scale of D-1 and D"
    who: BED (read prod_reader_trades_v1 926b7ff5)
  - what: >-
      the raw check per day (ADDON_ARCHITECTURE_V4 section 6, V3 section 6 standing): the re-read trades against the year's C13 and B1;
      what the year read at the 12 minutes of 22 to 24 Sep 2025 (J15991; METRIC_AUDIT J15943, J15945) is found before any trades producer
      runs on 2025 days
    who: open (the architecture names no seat)

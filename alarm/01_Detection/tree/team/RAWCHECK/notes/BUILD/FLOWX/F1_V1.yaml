  may:
    - the values are Binance USDT-M's (Binance futures trades and aggTrades; RULING 3, REVIEW_LEAD_EDGE1_V1 X7)
    - the net taker dollars of this coin's aggTrades at or above its own floor F_coin(D) in (u - 300 s, u], as received by u, every 5 s
    - the coin against itself across the points of one day (one floor per day)
  never:
    - Hyperliquid's flow, price impact or cost (another venue, where the owner trades; these are Binance's values)
    - 'an order count or order dollars: an aggTrade is the trades of 100 ms at one price and one taking side, an ORDER PROXY (RULING 3); one order sweeping k price levels is k aggTrades, some of them perhaps under the floor'
    - the year's B1 S04 (another floor, the one 25,000, another row, the minute grid)
    - a ranking of coins by whale dollars without their floors (each coin has its own floor)
    - a change in flow from a step at 00:00:00 alone (the floor is refit at 00:00 of D)
readers: none yet
implementation:
  how: >-
    Per coin-day, vectorised, no loop over rows or points in Python: D's aggTrades in T order (stable on agg id); each aggTrade's arrival
    from the trades reader v2 by trade id (the max local_timestamp over first_trade_id..last_trade_id on the id-sorted trades); dollars in
    integers (int64, price and quantity in their steps); the whale mask dollars >= F_coin(D), exact; each row adds +v at the first 5 s
    point u >= max(T, arrival) and -v at the first point u >= T + 300 s (searchsorted on the 17,280 points; nothing when the first is not
    before the second), both by bincount, then one cumulative sum (the arrival mask built in), exact in int64, float64 once at the end;
    D-1's part from the CARRY added at 00:00:05 to 00:04:55. F_coin(D) needs the daily p99s of D-30 to D-1, each from its own day's phase
    A (data check 3). All coins in one process; the aggTrades pack read once per day and shared by the FLOWX cards that read aggTrades.
  kernel: 'new: window_stamped (EDGE1''s planned name, REVIEW_LEAD_EDGE1_V1 line 69; a row''s first point = the first 5 s point at or after max(T, arrival), its last = the last point before T + W; a difference array over the points and one cumulative sum); addon_grid_v2.per_window (85c8ece1 line 169) windows on arrival alone, so it is not this rule, only its cross-check where every arrival equals T'
  memory_mb: 600
  seconds_share: 2
data_checks:
  - what: >-
      D4: the days of aggTrades held (HANDOVER_EDGE1_V103 901368a5: to 1 Aug 2026; BUILD_LIST_V4 03c7ed28 line 42: 113 coin-days held),
      and whether any day before 10 Sep 2025 is held (it sets the first floor day)
    who: the sources seat (REVIEW_AR2 line 114)
  - what: >-
      trade id agreement of aggTrades with our trades on 2 days, and whether every trade of an aggTrade carries its T (the day's raw
      check per minute is exact only then)
    who: BED (a read-only runner job)
  - what: >-
      answered by edition 6's PHASES (the whale mask, the join and the seen state in phase B; D's aggTrades at T = 00:00:00.000
      received by 00:00:00.000 added in D's phase B, E16); open for EDGE1 only: D's p99 as a phase A output feeding X1/fit/FLOWX of the
      days after
    who: EDGE1

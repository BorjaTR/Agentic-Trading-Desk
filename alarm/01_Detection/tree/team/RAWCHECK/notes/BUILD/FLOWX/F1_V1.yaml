      why: >-
        the year's other checked day (if held, D4, else the first held day the tester names); before the first floor day when aggTrades
        start 10 Sep 2025, so every row NO_HISTORY with known_at = as_of; near the 12 minutes of 22 to 24 Sep 2025 where the ARCHIVE_DISK2
        copy lacks taker rows the year's B1 has (J15991; ADDON_ARCHITECTURE_V4 section 6, V3 section 6 standing)

kind: build_metric
id: F1
producer: FLOWX
item: 'whale taker orders net (B1 S04 rebuilt per order, floor per coin)'
tier: REBUILD
rebuilds: "B1 S04 (whale net flow (25k fills), V32): the year's rows with one floor 25,000; here aggTrades with a floor per coin"
name: Binance whale aggTrade net dollars, 5 minutes (B1 S04 rebuilt on aggTrades with a floor per coin)
status:
  drafter: BED
  reviewer: METRIC_AUDIT2
  edition: 6
  signed: false
means: >-
  The net taker dollars of the coin's aggTrades at or above the coin's own floor in the last 300 s, as received by u, written every 5 s:
  + = big aggressive buying, - = big aggressive selling. An aggTrade is an ORDER PROXY (trades of 100 ms at one price and one side), not an order.
example: >-
  Floor 25,000 (planted), u = 12:00:00. A buy of 100 x 300 = 30,000 at 11:55:50 (whale, in); a buy of 100 x 200 = 20,000 at 11:56:40
  (retail); a sell of 101 x 400 = 40,400 at 11:58:20 (whale); a buy of 125 x 200 = 25,000.00 at 11:59:10 (at the floor: whale); a sell of
  50,000 at exactly 11:55:00 (out: the window is open at its start); a buy of 100,000 at 11:59:59 received at 12:00:00.002 (out: not
  received by u); a sell of 50 x 100 = 5,000 at 11:59:50 (retail). F1 = 30,000 - 40,400 + 25,000 = 14,600 (F2 = 20,000 - 5,000 = 15,000;
  F1 + F2 = 29,600, the net of every aggTrade counted). Five seconds later, at 12:00:05, the 100,000 has been received: F1 = 114,600.
formula: >-
  For one coin and the 5 s point u (00:00:00, 00:00:05, ..., 23:59:55 of D), the window is (u - 300 s, u] on the aggTrade's exchange time
  T (transact_time, ms). An aggTrade a is counted when T(a) is in the window and a was received by u: arrival(a) <= u, where arrival(a) =
  the latest local_timestamp of its trades first_trade_id..last_trade_id in the trades reader v2 (O-FLOWX-1 (a), THE rule: EDGE1
  17:49:00Z; exchange time with known_at = u is refused). So a counts at every 5 s point u with max(T, arrival) <= u < T + 300 s.
  dollars(a) = p x q, exact, in integer units of dollars (price and quantity in their own steps; USD-M linear; a 1000-prefixed symbol has
  p per 1,000 coins and q in thousands, so p x q is still dollars). side(a) = -1 when is_buyer_maker is true (the taker sold), +1 when
  false (the taker bought). F1(u) = the sum of side(a) x dollars(a) over the counted aggTrades with dollars(a) >= F_coin(D), exact in
  those integer units, written once as float64 (no rounding: the hand work's whole dollar of B1 rule 2 is dropped). The floor F_coin(D)
  (O-FLOWX-2 B): the median of the coin's 30 daily 99th percentiles of aggTrade dollars of the days D-30 to D-1 (of 30 values: the mean
  of the 15th and 16th smallest); each day's p99 by numpy's 'linear' rule over every aggTrade stamped (T) in that day AND received by its
  24:00 (so the floor used from 00:00:00 of D is known by then): x sorted ascending, h = (n - 1) x 0.99, p99 = x_(floor h) + (h - floor h)
  x (x_(floor h + 1) - x_(floor h)), 0-based, exact. The 30 p99s are those of FLOWX's own fit tables, which exist from the first
  built day (10 Sep 2025, pass 0) on: until 30 of them exist the floor, and so F1 to F9, are NO_HISTORY (about 10 Oct 2025); no day
  before the first built day is read for it (the owner's ruling 21:45 Berlin, 19 Oct 2026). The floor test is taken on the exact
  dollars, never on a float64. 
  The coin is seen by B1 rule 9 (CARD_B1_V7 rule 9, O-B1-1 B: a window over 60 s needs the coin seen at every moment of [the window's start, u]: its trades file of every day the span reaches, a trade in [e - 60 s, e] received by e at every moment e of the span, no thin minute in it (the thin states of the minutes from the one before the span's start to the last full one before u: prod_B1_v3 line 135), no bad trade row stamped in the window and received by u); the alive and thin inputs from reader v6 (inputs). A trade row with no stamp (the reader's t = arr = -1, bad) is passed over: in no window, no BAD_INPUT, no arrival (Y5; the year: prod_B1_v3 efc2bc52 lines 104, 134 to 140); an aggTrade whose trade ids are only such rows has none of its ids present (AGG_NOT_IN_TRADES). A repeated row (an agg id or a trade id seen before in its file) counts each time, flagged DUPLICATE_ROW (B1 rule 17). A seen coin with no counted aggTrade at or above the floor gives a measured 0, never empty. The 00:00:00 row of D is D-1's 24:00:00 row (THE CARRY, inputs.days), with F_coin(D), the floor in
  force from 00:00:00 of D. The rule is the year's B1 S04 (CARD_B1_V7 rules 1 to 4) with the row an aggTrade and the floor per coin.
  THE 00:00 POINTS (REVIEW_LEAD_EDGE1_V1 X3): when D's file is missing and D-1's is there, phase B writes the 00:00:00 row NO_FILE too (the year reads D's file there); the 00:00:00 point is completed in phase B after D's rows at exactly 00:00:00.000000 are added; it uses D's own floor F_coin(D), from D's fit table (X3c).
source:
  kind: ours
  ref: >-
    The year's B1 S04 rule (CARD_B1_V7 rules 1 to 4), rebuilt with the row an aggTrade and a floor per coin (FLOWX_WORK_V0 F1);
    RESEARCH_TOOLS_V1 6.1 (BUILD, no tool). The aggTrade row: 'Market trades that fill in 100ms with the same price and the same taking
    side' (the Binance REST doc, RESEARCH_TOOLS_V1 6, T1). The floor: O-FLOWX-2 B (BRIEF_FLOWX_DRAFTERS decision 9) with each day's p99 on
    the aggTrades received by that day's 24:00 (BRIEF_FLOWX_V4_DELTA item 7). The 5 s grid: ADDON_ARCHITECTURE_V4 section 4 (BUILD_ITEMS_V4).
inputs:
  - kind: reader
    ref: prod_reader_agg_trades_v1
    exists: false
    stream: Binance USD-M aggTrades (data.binance.vision archive)
    fields: agg id, price p, quantity q, first_trade_id, last_trade_id, transact_time T (ms), is_buyer_maker m (FLOWX_WORK_V0 common)
    data_check: >-
      D4: which days are held (HANDOVER_EDGE1_V103 901368a5 says the ARCHIVE_DISK2 holds aggtrades to 1 Aug 2026; BUILD_LIST_V4 03c7ed28 line
      42 says 113 coin-days held); the header row and column order; it refuses JUL_UNSEEN and every day from 1 Aug 2026
    rule_in_force: every aggTrade with T in (u - 300 s, u] and arrival <= u, at the 5 s point u (the arrival from the trades reader v2)
    stale_rule: none of its own; stale comes from the seen state (B1 rule 22, output.stale_rule)
    days: >-
      D; the days D-30 to D-1 for the floor (each day's p99 per coin through the fit table X1/fit/FLOWX/<D>.parquet: O-FLOWX-2 B, ADDON_ARCHITECTURE_V4 edit 3 section 5). PHASES (ADDON_ARCHITECTURE_V4 edit 3 section 4; Y1): phase A of D, days in parallel and without the CARRY, makes only the point-local records of D's raw: D's aggTrades (T, side, exact dollars) with the arrivals of those whose trades are all in D's trades file, D's p99 (the aggTrades stamped and received by D's 24:00), D's minute trade counts and live spans (reader v6), and the arrivals in D's trades file of the trade ids below D's first aggTrade's first_trade_id (D-1's last aggTrades, Y4). Phase B, day after day with the CARRY of D-1, makes every value: the join of D-1's last aggTrades with their arrivals in D's trades file (the aggTrades file is cut by exchange time, the trades file by arrival: Y4; AGG_NOT_IN_TRADES is decided only here; the reverse join for an aggTrade of D whose trades arrived before 24:00, from the CARRY's trades), the seen state at every point (alive from D-1's live spans past 24:00; thin from D-1's counts and thin(D-1, 0)'s end), the window sums with D-1's part, the 00:00:00 point (D's rows at exactly 00:00:00.000000 added; NO_FILE when D's file is missing, X3). No value is final in phase A. THE CARRY (X1/carry/FLOWX/<D-1>.npz): D-1's aggTrades with T in D-1's last 300 s (each with its T, side and exact dollars, so F_coin(D) is applied to them in phase B, and its arrival where D-1's trades file holds all its trades); D-1's 1,440 minute trade counts and thin(D-1, 0)'s end (on, good); D-1's live spans reaching past 24:00; D-1's trades near 24:00 by trade id with their arrivals; whether D-1's aggTrades and trades files exist (X1: a missing D-1 file gives NO_FILE on every window that reaches it, on any day: prod_B1_v3 line 134). The first year day reads 9 Sep 2025's raw once for the first CARRY (R2); if it is not held, the rows whose window reaches 9 Sep 2025 are empty NO_FILE.
  - kind: reader
    ref: prod_reader_trades_v2
    exists: false
    stream: Tardis binance-futures trades (the year's trades stream)
    data_check: >-
      an edition of prod_reader_trades_v1 (926b7ff5) that also keeps the trade id, tested equal to v1 packs (ADDON_ARCHITECTURE_V4
      sections 6 and 10, V3 section 6 standing); it gives each aggTrade its arrival (O-FLOWX-1 (a), THE rule: EDGE1 17:49:00Z)
    rule_in_force: >-
      arrival(a) = the latest local_timestamp of the trades first_trade_id..last_trade_id of a (O-FLOWX-1 (a)), trades with no stamp
      passed over (Y5); the seen state's alive and thin come from reader v6 (the next input)
    stale_rule: B1 rule 22 (TRADES_HOLE or THIN_FEED give stale = 1)
    days: >-
      D (the arrivals of D's aggTrades by trade id); D-1's last aggTrades take their arrivals from D's trades file in D's phase B (Y4: the
      PHASES above); D-1's trades near 24:00 by id in the CARRY for an aggTrade of D whose trades arrived before 24:00
  - kind: reader
    ref: prod_reader_liquidations_v6
    exists: true
    stream: "the trades files' two stamp columns, as B1 reads them for its seen state (CARD_B1_V7 line 150: alive and thin through prod_reader_liquidations_v6.py; prod_B1_v3 efc2bc52 line 117): the minute counts (a trade counted in its minute when received by the minute's end) and the live spans (a trade stamped t, received a, makes the coin alive at every moment from max(t, a) to t + 60 s), 8566228f lines 98 to 116"
    rule_in_force: "B1 rule 9's alive (a trade in [e - 60 s, e] received by e) and thin (R8: the base the median of D-1's 1,440 minute counts; a minute under 1 percent turns it on; while on, 5 minutes in a row at 20 percent or more end it; D's start is thin(D-1, 0)'s end, B1 rule 19)"
    stale_rule: "B1 rule 22 (TRADES_HOLE, THIN_FEED: stale 1); D-1's trades file missing or a base of 0: thin off, flagged NO_RATE_BASE (B1 rule 19; CARD_B3_V4 rule 8, E51)"
    days: "D-2, D-1 and D (D's base is D-1's counts; D's start is thin(D-1, 0)'s end, whose base is D-2's counts). Measured on 8 Mar 2026 (J16034, log f7a76cb05e789815): BTC 3.24 s, DOGE 1.03 s, CRV 0.10 s a pack. It parses each trades file a second time beside the trades reader (ADDON_ARCHITECTURE_V4 9.3 rule 1): FOR EDGE1, a seen-state kernel on the shared trades pack, tested equal to v6"
overlaps:
  - setting: B1 S04
    kind: other_metric
    why: >-
      The same idea (whale taker net over 300 s) on another row and another rule: B1 S04 counts the year's own rows with the one floor
      25,000 (V32 B1 S04 limits; job 15773) rounded to the whole dollar (B1 rule 2), at minute ends; F1 counts aggTrades with a floor per
      coin, not rounded, every 5 s.
per_coin: >-
  Every roster coin of D (the year root's ROSTER_<monday>.csv of D's week, the one command's --year-rosters: knowledge/roster/ starts at ROSTER_20251006, J16034; Y8, X11), seen by B1 rule 9 on its trades. The floor per coin is the point: BTC's aggTrade
  p99 is about 220,000 and thin coins' 19,000 to 24,000, against the year's one floor 25,000 (V32 B1 S04 limits; job 15773). 1000-coins:
  p x q is still dollars. Thin coins: many points unseen (THIN_FEED). A coin entering the roster, or a coin with a day of D-30 to D-1
  without a p99 (no aggTrade stamped and received that day, or the day not held), is empty NO_HISTORY until 30 days with a p99 lie
  before D. Coins missing on Hyperliquid change nothing (a Binance value).
time: >-
  Every 5 s; funding settles and quarter hours are not special here. Between minute ends the value moves when a row is received or
  leaves the window (T = u - 300 s). The floor is refit at 00:00:00 of D, so a step there may be the floor's, not the flow's. The 00:00
  start: the 00:00:00 row is D-1's 24:00:00 row; the points 00:00:05 to 00:04:55 add D-1's part from the CARRY. Crash days (10 Oct 2025
  evening): many whale aggTrades against a floor from the 30 days before. The first year day reads 9 Sep 2025's aggTrades once if held;
  if aggTrades start on 10 Sep 2025, the first floor is on 10 Oct 2025 and every row before it is NO_HISTORY. The reader refuses
  JUL_UNSEEN and every day from 1 Aug 2026.
output:
  group_file: X1/day=<D>/FLOWX.parquet
  names:
    - name: S01
      label: bn_whale_agg_net_usd_5m
      units: USDT (taker dollars p x q; + taker buying, - taker selling)
      value_kind: float
      decimals: none
      means: the net taker dollars of the aggTrades at or above F_coin(D) with T in (u - 300 s, u], received by u, at the 5 s point u
  grid: 5s
  cadence: 'every 5 s (minute ends included): 17,280 points per coin per day, u = 00:00:00, 00:00:05, ..., 23:59:55 of D'
  as_of_rule: as_of = u, the 5 s point
  known_at_rule: >-
    known_at = max(the latest arrival of the aggTrades counted at the 5 s point u, 00:00:00 of D) (the floor F_coin(D) is known at 24:00
    of D-1: Y7, BED's proposal for EDGE1), else u (no aggTrade counted: a measured 0, or an empty row); each arrival <= u, so
    known_at <= as_of on every row, empty rows too
  empty_reasons:
    - reason: NO_FILE
      when: "the coin's aggTrades file or trades file is missing (or only .part) for a day the window or the seen span reaches, on any day (prod_B1_v3 line 134; at 00:00:00, D's file: X3); a header-only or 20-byte empty file is there with no rows (prod_reader_trades_v1 lines 72 to 73; no trade gives TRADES_HOLE, CARD_B3_V4 line 116)"
    - reason: TRADES_HOLE
      when: B1 rule 9 (CARD_B1_V7) gives TRADES_HOLE for the coin through [u - 300 s, u] (a moment of the span with no trade in the 60 s before it received by then)
    - reason: THIN_FEED
      when: B1 rule 9 gives THIN_FEED for the coin through [u - 300 s, u] (a thin minute among the minutes from the one before the span's start to the last full one before u)
    - reason: BAD_INPUT
      when: B1 rule 9 gives BAD_INPUT for the coin through (u - 300 s, u] of the 5 s point u (a bad row in the window)
    - reason: NO_HISTORY
      when: >-
        no floor F_coin(D): any of the 30 days D-30 to D-1 has no p99 for the coin. When several reasons hold, the first in this list
        (the year's B1 order first, then the card's own)
  stale_rule: stale = 1 on a row empty for TRADES_HOLE or THIN_FEED (B1 rule 22); else 0
  max_staleness_s: 300
  window_days: 30
  no_history: >-
    the first day with 30 days before it held (10 Oct 2025 if aggTrades start 10 Sep 2025, earlier if held before: D4); before it every row
    of the names that use the floor is empty NO_HISTORY
  fit_rule: >-
    parameters from days before D only: F_coin(D) from the days D-30 to D-1 (each day's aggTrades stamped and received by its 24:00),
    refit each day at 00:00 of D
  fifths: none
  flags:
    - flag: AGG_IDS_MISSING
      when: >-
        written AGG_IDS_MISSING=<n> on a row that counts an aggTrade with some of its trade ids missing in the trades reader's rows (its
        arrival is then the latest of those present: O-FLOWX-1 (a)); n = the missing trade ids of the aggTrades counted
    - flag: AGG_NOT_IN_TRADES
      when: >-
        a row whose window holds by T an aggTrade at or above the floor with none of its trade ids in the trades reader's rows while the
        coin is seen: that aggTrade has no arrival and is not counted (a raw-check case)
    - flag: NO_RATE_BASE
      when: "on a valued row when the thin base or start is missing (D-1's trades file missing, or the median of D-1's minute counts 0): the coin is read as not thin (B1 rule 19; CARD_B3_V4 rule 8, E51)"
    - flag: DUPLICATE_ROW
      when: "on a valued row that counts a repeated row (an agg id or a trade id seen before in its file): it counts each time (B1 rule 17, A1 rule 10)"
edge_cases:
  - case: E1 the hand work's seven rows
    input: 'F_coin = 25,000 planted; u = 12:00:00; the seven rows of the example'
    answer: 'F1 = 30,000 - 40,400 + 25,000 = 14,600; known_at 11:59:10.005 (the last whale counted, planted 5 ms after its T); stale 0'
  - case: E2 an aggTrade exactly at the floor
    input: 'a buy of 125 x 200 = 25,000.00 with F_coin = 25,000'
    answer: whale (dollars >= F_coin, on the exact dollars); it is in F1 and never in F2
  - case: E3 the window's two ends
    input: 'E1''s sell of 50,000 at T = 11:55:00.000 = 12:00 - 300 s, received at 11:55:00.000'
    answer: 'out of F1 at 12:00 (the window is open at its start); in F1 at 11:55 (T = u and received by u): F1(11:55) = -50,000, known_at 11:55:00.000'
  - case: E4 received after a minute end, counted at the next 5 s point
    input: 'E1''s buy of 100,000 at 11:59:59.000 received at 12:00:00.002'
    answer: 'out at 12:00:00; in from 12:00:05: F1(12:00:05) = 14,600 + 100,000 = 114,600, known_at 12:00:00.002 (nothing left the window: no row has T in (11:55:00, 11:55:05])'
  - case: E5 a 5 s point that is not a minute end, rows leaving
    input: E1's rows at 12:00:45, 12:00:50 and 12:01:00
    answer: >-
      F1(12:00:45) = 114,600; at 12:00:50 the buy of 30,000 at 11:55:50 leaves (T = u - 300 s): F1(12:00:50) = -40,400 + 25,000 +
      100,000 = 84,600; F1(12:01:00) = 84,600; known_at 12:00:00.002 at all three
  - case: E6 an aggTrade whose trades arrive on both sides of a minute end
    input: 'a buy of 100 x 300 = 30,000 at T 11:59:59.900, trades 501 to 503 with local_timestamps 11:59:59.950, 11:59:59.990, 12:00:00.010; floor 25,000'
    answer: 'arrival 12:00:00.010 (the latest): F1(12:00:00) = 0 (a measured 0, the coin seen); F1(12:00:05) = 30,000, known_at 12:00:00.010; counted to 12:04:55'
  - case: E7 some trade ids missing in our trades
    input: 'a buy of 100 x 300 at T 11:59:30.000, ids 601 to 604; our trades hold 601, 602, 604 at 11:59:30.004, 11:59:30.006, 11:59:30.005'
    answer: 'arrival 11:59:30.006; counted: F1(12:00) = 30,000, flag AGG_IDS_MISSING=1 on the rows 11:59:35 to 12:04:25 (the 5 s points with 11:59:30.006 <= u < 12:04:30)'
  - case: E8 none of its trade ids in our trades
    input: 'a sell of 100 x 400 = 40,000 at T 11:59:40.000, ids 701 to 702, neither in our trades; the coin seen'
    answer: 'not counted: F1(12:00) = 0, flag AGG_NOT_IN_TRADES on the rows 11:59:40 to 12:04:35 (the windows holding T)'
  - case: E9 a half dollar in the sum
    input: 'floor 25,000; a buy of 125 x 200 = 25,000 at 11:59:30 and a sell of 100.01 x 250 = 25,002.5 at 11:59:40'
    answer: 'F1(12:00) = -5/2 = -2.500000000 exactly (not -3: the hand work''s whole dollar half away from 0 is dropped)'
  - case: E10 the floor from 30 planted days
    input: 'day k = 1 (D-30) to 30 (D-1): 49 aggTrades of 1,000 and two of 20,000 + 1,000k and 22,000 + 1,000k (n = 51, h = 49.5), all received by 24:00'
    answer: 'each p99 = 21,000 + 1,000k, from 22,000 (D-30) to 51,000 (D-1); F_coin(D) = (36,000 + 37,000) / 2 = 36,500'
  - case: E11 a p99 that interpolates, and a day of one aggTrade
    input: 'a day of 52 aggTrades: 49 of 1,000, one each of 30,000, 40,000, 40,001 (h = 51 x 0.99 = 50.49); a day of one aggTrade of 12,345'
    answer: 'p99 = 40,000 + 0.49 x 1 = 4000049/100 = 40000.49000 (numpy percentile 99 linear agrees); the one-row day: h = 0, p99 = 12,345'
  - case: E12 an aggTrade received after its day's 24:00 is not in that day's p99
    input: 'a day of 51 aggTrades: 49 of 1,000, one of 30,000 and one of 40,000 stamped 23:59:59.998 and received 00:00:00.003 of the next day'
    answer: 'the p99 counts 50 (h = 49 x 0.99 = 48.51): 1,000 + 0.51 x 29,000 = 15,790 (with the late one counted it would be 35,000)'
  - case: E13 a day of D-30 to D-1 without a p99
    input: 'E10 with no aggTrade of the coin on D-16'
    answer: every F1 row of D empty NO_HISTORY, known_at = as_of = u, stale 0
  - case: E14 a seen coin with no whale aggTrade
    input: 'the coin seen; only E1''s retail rows (20,000 and 5,000) in the window'
    answer: 'F1 = 0 (a measured 0, never empty), known_at = u'
  - case: E15 the 00:00 start with the CARRY
    input: >-
      floor 25,000 on D-1 and D; the coin seen; D-1's last aggTrades (T, arrival, side, dollars; the arrivals 00:00:00.003 and 00:00:00.002

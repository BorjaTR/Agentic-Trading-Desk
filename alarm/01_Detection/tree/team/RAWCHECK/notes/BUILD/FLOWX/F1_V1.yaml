# (0591d18171f2d21f, edit 3; V3's rules stand unless V4 changes them), BUILD_DEFINITION_WORKPACKAGES_V2. Every worked answer recomputed
# exactly with fractions.Fraction. Checked with:
#   cd <VM_HOME>/br2/flowx/kit && python3 -B -m rawcheck.build_register notes/BUILD/FLOWX/F1_V1.yaml --check
# Edition 2 (BED, 18 Oct 2026; METRIC_AUDIT2 18:53:59Z PF1 to PF3): kernels that exist in addon_grid_v2 85c8ece1 (per_window,
# roll_points, run_beta, nearest_rank) or 'new:' with why; max_staleness_s = the bound known_at can lag; the floor through the fit
# table X1/fit/FLOWX/<D>.parquet (ADDON_ARCHITECTURE_V4 edit 3 section 5). No value changed.
# Edition 2 was signed by METRIC_AUDIT2 (REVIEW OK 19:06:13Z): edition 3 needs its OK again.
# Edition 3 (BED, 18 Oct 2026; METRIC_AUDIT2's FLOWX review 19:11:54Z and REVIEW_LEAD_EDGE1_V1 8dd9867d section 0): FX7 Binance in
# the name, label and conclude; FS stale only on TRADES_HOLE, THIN_FEED empties (B1 rule 22); FF no flag on an empty row (the first
# year day's reads into D-1 empty NO_FILE, X1); FB the mid by CARD_C13_V4 rules 9, 11, 12 (F14, F15); X2 to X4, X6, X9, X11 as they apply.
# Edition 7 (EDGE1, 19 Oct 2026; the owner's ruling 21:45 Berlin via LAB1 19:45:33Z, answering EDGE2 19:38:59Z): the floor's 30 p99s are
# FLOWX's own fit tables, which exist from the first built day: until 30 exist, F1 to F9 are NO_HISTORY (about 10 Oct 2025). No value changed.
# Edition 6 (BED, 18 Oct 2026; METRIC_AUDIT's lead review REVIEW_LEAD_METRIC_AUDIT_FLOWX_V1 a8558bffc1c9f2ac): Y1 the PHASES (no
# value final in phase A; the CARRY's counts, thin end, spans, trades by id, file status), Y2 reader v6 as the seen-state input, Y4 the

    The tester recomputes F1, its empty reasons, stale, known_at and flags at every point named from this card's words, with Fraction on
    the readers' rows (never the producer's code): floats within 1e-9 relative, words, flags and known_at equal. Plus the day's raw check:
    the aggTrades' dollars per minute = B1 S01 + S02 on the minutes where every trade id is present and no aggTrade's trades arrive on both
    sides of the minute end (B1 S01, S02 are whole dollars: equal within their rounding). One small read-only runner job.

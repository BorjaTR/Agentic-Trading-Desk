# K3_V1.yaml: COST walk-the-book cost of 50,000 USDT, every 5 s and by hour of day (TREE, 18 Oct 2026;
# BUILD_DEFINITION_WORKPACKAGES_V2 ef29966d). K2_V1's rules with N = 50,000 USDT; the content of TREE's .md draft in the template's keys.
# Edition 2: METRIC_AUDIT's review 17:46:31Z: N1 (seen by any row read), N2 (meaning line 2 at a level), N3 (NO_LEVELS out of S18,
# S19), the CARRY for 00:00 only; F1 max_staleness_s 86400 on S14 to S19 (build_register edition 3).
# Edition 3: the owner's 5 s grid (BUILD_ITEMS_V4 9d424de3, ADDON_ARCHITECTURE_V4 edit 1 05665220 section 4, WORKPACKAGES_V2 edit 2 rule 4.11):
# output.grid 5s; the values at every 5 s point; the hour tables built from the minute ends as in edition 2 and written at every
# point; the CARRY state for the points whose seen window crosses 00:00. Nothing else changed. Signed by METRIC_AUDIT's REVIEW COST EDITION 3 OK 18:11:15Z.
# Edition 4: the owner's OK of K1 with the fix, the same check for K3 (EDGE1 18:19:46Z): the kernel cited is addon_grid_v2 85c8ece1 (in_force with
# bad_ends=True for CARD_D2_V3 rule 4 and its seen output for rule 3), not edition 1; and ADDON_ARCHITECTURE_V4 edit 3 0591d181's binding lines: the
# phases (section 4 line 35) and the row at exactly 00:00:00.000000 (line 37) as a case. Values unchanged. Signed by METRIC_AUDIT's REVIEW COST EDITION 4 OK 18:36:48Z (its nit taken: the days lines cite edit 3).
# Edition 5: EDGE1's lead review (REVIEW_LEAD_EDGE1_V1 8dd9867d sections 0, 1): as K2 edition 5 (one-sided NO_LEVELS on both sides,
# CARD_D3_V4 rules 1 to 6 word for word, the exact walk), bookDepth's 3 coins, its own 00:00:00.000000 case, X6. Values unchanged.
# Edition 6: METRIC_AUDIT2's FIX CHECK COST (REVIEW_LEAD_METRIC_AUDIT2_COST_V1 f426be58): its nit, the answers of K2's shared cases at 50,000
# written and K2's missing-file case added. Values unchanged.
# Worked examples recomputed with exact fractions by team/TREE/proposals/verify_cost_examples_tree_v3.py.
kind: build_metric
id: K3
producer: COST
item: 'cost table: walk-the-book cost for 50k USDT'
tier: BUILD_FIRST
name: cost in bps of the mid of a 50,000 USDT market buy and sell walking Binance's 25 visible levels every 5 s, and its hour-of-day median, 90th percentile and exhausted share over the 14 days before D
status:
  drafter: TREE
  reviewer: METRIC_AUDIT
  edition: 6
  signed: true
  signed_by: 'METRIC_AUDIT2 2026-10-18T20:05:34Z'
means: >-
  K2 at 50,000 USDT: what a 50,000 USDT market order would pay against the mid on Binance's visible book at every 5 s point, per side
  (S12 buy, S13 sell), the hour's usual and bad-minute cost over the 14 days before D (S14 to S17) and how often the 25 levels could
  not fill it (S18, S19). The 25 levels of a thin coin often hold less than 50,000 USDT a side: then the value is EXHAUSTED, never
  extrapolated.
example: >-
  A book with asks 10 x 1,000 and 20 x 2,000 holds exactly 50,000 USDT of asks. A 50,000 USDT buy takes all 3,000 coins at an average
  of 16.666666666667, with the mid at 9.5 (bids 9 x 6,000): S12 = 7,543.859649122807 bps; it is filled because the levels hold
  exactly 50,000. One cent more and the buy is EXHAUSTED. On a BTC-like book (bids 67,000.0 x 0.40 and 66,999.9 x 0.25 hold
  43,549.975 USDT) the 50,000 sell is EXHAUSTED while the buy costs 0.041164021956 bps.
formula: >-
  K2_V1's formula word for word with N = 50,000 USDT: the rows, the row in force, seen, BAD_INPUT, the files and the order by
  CARD_D3_V4 rules 1 to 6 (a row with no stamp at the row before's stamp and arrival; NO_LEVELS on S12 and S13 when either side has no
  filled level), the walk exact on int64 dollars at 10^(pp + qp) with the partial a Fraction,
  the filled levels best first, the walk with the strict exhausted rule, VWAP = N / coins, S12 = (VWAP - M) / M x 10,000 for the buy
  and S13 = (M - VWAP) / M x 10,000 for the sell with the proceeds convention, M the same row's mid; the hour cells of the UTC hour of
  u over its 840 minute ends on D-14 to D-1 (as K2): S14, S15 (S16, S17) the median and nearest-rank 90th percentile of the valued S12 (S13), at least 600 valued;
  S18 (S19) the EXHAUSTED share of the minute ends valued or EXHAUSTED (NO_FILE, BOOK_HOLE, BAD_INPUT, NO_LEVELS left out), at least
  600 such. Exact, written as float64.
source:
  kind: doc
  ref: >-
    RESEARCH_TOOLS_V1 aad3cc38 section 7.1 (O1, the 10k and 50k sizes; the strict exhausted rule, never extrapolate); REVIEW_AR2 D2
    and ADDON_ARCHITECTURE_V3 section 11 COST row ('25 levels may not hold 50k on thin coins: a rule'); BUILD_PLAN_V2 14ccbcd5 line
    76. Oracles as K2's.
inputs:
  - kind: reader
    ref: prod_reader_book_snapshot_25_v1
    exists: true
    stream: book_snapshot_25 (binance-futures), pack book_snapshot_25_v1 (dc08ebf5); the same pass as K2
    rule_in_force: CARD_D3_V4 rules 1 and 2, as K2
    stale_rule: not seen (no row read stamped in [u - 15 s, u] and received by u; rule 3) gives BOOK_HOLE, stale 1; a bad row gives BAD_INPUT; either side with no filled level NO_LEVELS on both; files by CARD_D3_V4 rule 5, as K2
    days: "D's raw for the points 00:00:05 to 24:00:00; the 00:00:00 point from X1/carry/COST/<D-1>.npz with the 00:00:00.000000 row of D added in phase B, and 00:00:05, 00:00:10 from its state, as K2 (ADDON_ARCHITECTURE_V4 edit 3 0591d181 section 4); the first year day reads 9 Sep 2025's file once"
  - kind: addon
    ref: COST S12, S13 of D-14 to D-1 (and their EXHAUSTED rows)
    card: COST/K3_V1
    rule_in_force: the S12, S13 rows of the 14 days before D at the minute ends of hour h
    stale_rule: a missing COST day of the 14 gives NO_HISTORY
    days: D-14 to D-1
overlaps: none
per_coin: >-
  As K2. At 50,000 the walk passes the top on most coins, so K3 measures the book's slope; on BTC the 25 levels can hold 50,000 on one
  side and not the other (E3); thin coins are EXHAUSTED most of the time (to be counted: data check), so their S14 to S17 can be
  FEW_VALUES for whole hours while S18, S19 near 1 say why.
time: >-
  As K2: the hour cells, the funding settles and quarter hours ordinary minutes, a crash day lifts S15, S17, S18, S19 for 14 days;
  the 00:00:00 point is D-1's 24:00 point and 00:00:05, 00:00:10 read the CARRY's state; S14 to S19 NO_HISTORY until 24 Sep 2025.
output:
  group_file: X1/day=<D>/COST.parquet
  names:
    - name: S12
      label: walk_buy_50k_bps
      units: bps of the mid
      value_kind: float
      decimals: none
      means: cost of a 50,000 USDT market buy walking the ask levels in force
    - name: S13
      label: walk_sell_50k_bps
      units: bps of the mid
      value_kind: float
      decimals: none
      means: cost of a market sell with 50,000 USDT of proceeds walking the bid levels in force
    - name: S14
      label: walk_buy_50k_hour_median_bps
      units: bps of the mid
      value_kind: float
      decimals: none
      means: median of the valued S12 at this UTC hour over the 14 days before D
      max_staleness_s: 86400
    - name: S15
      label: walk_buy_50k_hour_p90_bps
      units: bps of the mid
      value_kind: float
      decimals: none
      means: nearest-rank 90th percentile of the same
      max_staleness_s: 86400
    - name: S16
      label: walk_sell_50k_hour_median_bps
      units: bps of the mid
      value_kind: float
      decimals: none
      means: median of the valued S13 at this UTC hour over the 14 days before D
      max_staleness_s: 86400
    - name: S17
      label: walk_sell_50k_hour_p90_bps
      units: bps of the mid
      value_kind: float
      decimals: none
      means: nearest-rank 90th percentile of the same
      max_staleness_s: 86400
    - name: S18
      label: walk_buy_50k_hour_exhausted_share
      units: share 0 to 1
      value_kind: float
      decimals: none
      means: the share of the hour cell's minute ends valued or EXHAUSTED (NO_LEVELS, BAD_INPUT, BOOK_HOLE, NO_FILE out) whose asks could not fill 50,000 USDT
      max_staleness_s: 86400
    - name: S19
      label: walk_sell_50k_hour_exhausted_share
      units: share 0 to 1
      value_kind: float
      decimals: none
      means: the same for the bids
      max_staleness_s: 86400
  grid: 5s
  cadence: every 5 s (minute ends included) (17,280 rows per coin per day, u = 00:00:00 to 23:59:55 of D)
  as_of_rule: as_of = u, the 5 s point
  known_at_rule: >-
    S12, S13: known_at = the arrival of the snapshot row in force (arr <= u); S14 to S19: known_at = 00:00 of D; an empty row:
    known_at = u. So known_at <= as_of on every row.
  empty_reasons:
    - reason: NO_FILE
      when: "S12, S13 by CARD_D3_V4 rule 5, as K2 (a needed file missing or only a .part; D's file at the 00:00:00 point too; a header-only file or an empty gzip has no rows)"
    - reason: BOOK_HOLE
      when: S12, S13 when no row read (good or bad) is stamped in [u - 15 s, u] and received by u (CARD_D3_V4 rule 3)
    - reason: BAD_INPUT
      when: S12, S13 when the row in force is bad
    - reason: NO_LEVELS
      when: S12 and S13 when either side of the row in force has no filled level (no mid)
    - reason: EXHAUSTED
      when: S12 (S13) when the filled ask (bid) levels hold less than 50,000 USDT (strict; exactly 50,000 fills)
    - reason: NO_HISTORY
      when: S14 to S19 when any of the 14 COST days before D is missing
    - reason: FEW_VALUES
      when: S14 to S17 with fewer than 600 valued of the cell's 840; S18, S19 with fewer than 600 valued or EXHAUSTED
  stale_rule: stale = 1 exactly when S12, S13 are empty BOOK_HOLE; S14 to S19 are never stale
  max_staleness_s: 15
  window_days: 14
  no_history: S14 to S19 first fill on 24 Sep 2025 (empty NO_HISTORY from 10 Sep to 23 Sep 2025); S12, S13 have no history.
  fit_rule: the hour table from COST S12, S13 of the 14 days before D only, refit once a day before 00:00 of D
  fifths: none
  flags: none
edge_cases:
  - case: E1 exactly enough
    input: 'asks 10 x 1000, 20 x 2000; bids 9 x 6000'
    answer: 'S12 7543.859649122807 (VWAP 16.666666666667, 3,000 coins)'
  - case: E2 a cent more
    input: 'the asks 10 x 1000, 20 x 1999.9995 (49,999.99 USDT)'
    answer: S12 empty EXHAUSTED
  - case: E3 BTC-like, one side short
    input: 'bids 67000.0 x 0.40, 66999.9 x 0.25; asks 67000.1 x 0.10, 67000.2 x 0.30, 67000.5 x 2'
    answer: 'S12 0.041164021956 (VWAP 67000.325799152922); S13 empty EXHAUSTED (the bids hold 43,549.975)'
  - case: E4 the deep sell
    input: 'bids 9 x 6000 (54,000 USDT); the asks of E1'
    answer: 'S13 526.315789473684 (VWAP 9, 5,555.555555555556 coins)'
  - case: E5 the research book
    input: 'asks 11 x 200, 12 x 300, 14 x 1000 (19,800 USDT); bids 9 x 500, 8 x 250, 7 x 500'
    answer: S12, S13 empty EXHAUSTED
  - case: E6 a mostly exhausted cell
    input: '840 minute ends: 0 BOOK_HOLE, 300 EXHAUSTED, 540 valued'
    answer: 'S14 to S17 empty FEW_VALUES; S18 0.357142857143 (300 / 840)'
  - case: E7 the row at exactly 00:00:00.000000
    input: "the CARRY's 24:00 state of D-1: the research book of E5 stamped 23:59:58; D's first snapshot row, the E1 book, stamped and received at 00:00:00.000000"
    answer: 'in force at the 00:00:00 point though not in D-1''s raw: S12 7543.859649122807, known_at 00:00:00 of D (D-1''s run alone: EXHAUSTED)'
  - case: E8 a one-sided book
    input: 'na = 0, the E4 bids'
    answer: S12 and S13 empty NO_LEVELS
unit_tests:
  - test: U1 (E1, E2)
    planted: 'snapshot packs with the E1 and E2 asks (qp 4 for E2)'
    expect: 'S12 7543.859649122807; EXHAUSTED'
  - test: U2 (E3, E4)
    planted: 'the E3 book with pp 1, qp 2; the E4 book'
    expect: 'S12 0.041164021956, S13 EXHAUSTED; S13 526.315789473684 within 1e-9 relative'
  - test: U3 (E5, E6)
    planted: 'the research book; COST S12, S13 rows of 14 planted days with the E6 counts'
    expect: 'EXHAUSTED both; S14 to S17 FEW_VALUES, S18 0.357142857143'
  - test: U4 (K2's E12 to E14 at 50,000)
    planted: "K2's seen, skew and share rows (the shared in-force and share code at the second notional)"
    expect: "the E12 book's 50,000 buy EXHAUSTED (19,800 USDT of asks) with the book seen; E13 BOOK_HOLE stale 1; E14's counts give S18 0.1; K2's E15 CARRY state: the 50,000 buy EXHAUSTED, the book seen; K2's shared cases at 50,000: E13b EXHAUSTED (19,800 and 11,000 USDT of asks), E17 BAD_INPUT, E18 BOOK_HOLE stale 1, E19 EXHAUSTED (10,000 USDT of bids), E20 NO_FILE at every point, 00:00:00 included (the shared rules; K2's U2, U3, U7 catch its mutants)"
  - test: U5 (E7, E8)
    planted: "the E7 CARRY and D's row at 00:00:00.000000; the E8 book"
    expect: 'S12 7543.859649122807 known_at 00:00:00 of D; NO_LEVELS on both'
  - test: U6 the meaning line made a test
    planted: 'every book of U1 to U5 valued at both notionals'
    expect: 'S12 >= S04 and S13 >= S05 (a bigger order never costs less per dollar on the same book: true by construction, a test, not a pass line)'
mutants:
  - mutant: M1 the partial average returned when exhausted
    caught_by: U2 (E3 S13 gives a value)
  - mutant: M2 exhausted when the levels hold N or less
    caught_by: U1 (E1 gives EXHAUSTED)
  - mutant: M3 N left at 10,000 (K2's notional)
    caught_by: 'U1 (E1 gives the 10,000 walk, 1,000 coins at 10: 526.315789473684)'
  - mutant: M4 FEW_VALUES counted over all 840 in place of the valued
    caught_by: U3 (E6 gives values)
  - mutant: M5 NO_LEVELS counted in the share's books
    caught_by: U4 (E14's counts give 81 / 830)
  - mutant: M6 the 00:00:00 point taken from D-1's run alone
    caught_by: U5 (E7 gives EXHAUSTED)
  - mutant: M7 a one-sided book walked with half a mid
    caught_by: U5 (E8 gives a value)
real_check:
  points:
    - point: 2026-03-08, BTCUSDT, 00:00:00, 00:00:05, 12:10:00 and 12:10:05
      why: the walk past the top; one side may be EXHAUSTED at 50,000
    - point: 2026-03-08, a coin and minute end where K3 is EXHAUSTED and K2 is not (the tester names it from K2's job rows)
      why: EXHAUSTED at 50,000 only
    - point: 2026-03-08, the thinnest coin, S14 to S19 at 12:00
      why: a cell of mostly EXHAUSTED minutes
  pass: >-
    The tester recomputes S12 to S19 from this card's words through the reader with Fraction (rawcheck/check_cost.py): floats within
    1e-9 relative, words equal; in K2's job.
meaning_check:
  pass_lines:
    - "for BTCUSDT, SOLUSDT and CRVUSDT (the coins whose bookDepth is held: BASIC_D3_V1 line 133, J15949, J15954), at 99 percent or more of the coin-minutes of 2026-03-08 where Binance's bookDepth notional within 1% is at least 50,000 USDT a side, our 25 levels fill 50,000 (not EXHAUSTED) at an S12 (S13) of 100 bps or less; the rest are listed (the 25-level cut, the bookDepth clock)"
  report_only:
    - per coin, the share of minute ends where the 25 levels hold 50,000 USDT a side
    - S18, S19 per coin and hour
conclude:
  may:
    - what a 50,000 USDT market order would have paid against the mid on Binance's visible book at the 5 s point, per side, when the 25 levels hold it
    - this coin's usual and bad-minute 50,000 USDT cost for this hour over the 14 days before D, read with the exhausted share
  never:
    - Hyperliquid's cost
    - an EXHAUSTED minute as a cheap one because S14 to S17 are computed over the valued minutes only (read S18, S19 beside them)
    - the cost past the 25 levels (never extrapolated)
readers: "none yet (planned: the test bed's fill model, X2's take-or-skip filter)"
implementation:
  how: >-
    In K2's pass: the same cumulative dollars arrays read at 50,000; no extra pack load; the hour cells from the 14 past COST files.
  kernel: 'walk_book_exact (owed by EDGE1''s kernels edition 3; v2''s walk_book is float64) at a second notional, in K2''s pass (its in_force rows; phases as K2: S12, S13 point-local, 00:00:00 to 00:00:10 phase B; S14 to S19 the table pass)'
  memory_mb: 50
  seconds_share: 1
data_checks:
  - what: per coin, the share of minute ends where the 25 levels hold 50,000 USDT a side (in K2's data-check job)
    who: TREE

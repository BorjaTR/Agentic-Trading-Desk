  "formula": "For coin c and point u: R = ALL fills rows of c (every account's own row, both sides of each trade) with block_time_us in (u - 61 s, u - 1 s]. Per row, the account's own position change decides, never the dir word (BUILD4 09:35Z: the node writes the Liquidated word on BOTH rows of a liquidation trade): p0 = start_position (signed coins before the fill), p1 = p0 + sz when side is B, p0 - sz when side is A; open_long = max(p1, 0) - max(p0, 0) when above 0; close_long = max(p0, 0) - max(p1, 0) when above 0; open_short = max(-p1, 0) - max(-p0, 0) when above 0; close_short = max(-p0, 0) - max(-p1, 0) when above 0 (a flip gives one close and one open). Rows counted: perp rows whose dir is a market-trade word (Open Long, Open Short, Close Long, Close Short, 'Long > Short', 'Short > Long', 'Liquidated Cross Long', 'Liquidated Isolated Long', 'Liquidated Cross Short', 'Liquidated Isolated Short', 'Auto-Deleveraging'); any other word (e.g. 'Net Child Vaults') is counted UNMAPPED (flag and count, never added to S07-S10, kept in the producer's raw check (c)); spot rows (Buy, Sell, 'Spot Dust Conversion') excluded (QUANT MUST 07:27Z). A row whose word disagrees with its own position change (e.g. a Liquidated Long word on a row whose long grows) is counted DIR_DISAGREE, named, and still counted by its position change. Dollars = coins x px. S07 = sum open_long $, S08 = sum open_short $, S09 = sum close_long $, S10 = sum close_short $. S11 = (S07 + S08) / (S07 + S08 + S09 + S10); EMPTY NO_TRADE when the denominator is 0.",

    <= 1e-9 + 1e-9 x abs(expected) (OX-DATA), counts equal'
meaning_check:
  pass_lines:
  - 'per coin-hour: (S07 - S09) and (S08 - S10) in coins, summed over the hour''s 60 s windows without overlap, plus the UNMAPPED rows'' own position changes,
    equal the change of the long and of the short open interest between the hourly position snapshots within the coin''s size step (the producer''s raw
    check c)'
  - on 10 Oct 2025 21:00-21:59, S11 for BTC and SOL is below its own September median in at least 70 pct of minutes (unwinding dominates a flush)
  - Every valued output obeys its stated formula, units and population; missing data is never zero.
  - No input whose modeled availability is after u changes a value at u.
  report_only:
  - S11 by hour of day and month

- test: U1 (E1)
  planted: the example rows
  expect: S07 2343, S09 5400, S10 905, S11 2343/8648
- test: U2 (E2)
  planted: the one trade as two rows
  expect: S07 180, S09 180, S11 0.5
- test: U3 (E3 and HOLE)
  planted: no rows in hour 10; HOLE hour 14
  expect: zeros and EMPTY NO_TRADE in hour 10; EMPTY HOLE in hour 14
- test: U4 (E4)

tier: BUILD
name: Hyperliquid long/short dollars opened and closed, and opening share over60s
status:
  drafter: STRATEGY
  reviewer: LAB1 + QUANT
  edition: 5
  signed: false
  signed_by: 'LAB1 2026-10-25T02:55:15Z (by diff vs signed)'
  changes: 'edition 5 (STRATEGY 2026-10-25T02:53:43Z): merged edition: OX-DATA''s proposed successor with QUANT''s ADOPTs (A6-A8, A10, market-trade words,
    tail spans, t_k = max(funding, block time), HLR-03 drop of S03 >= S04 only, HLR-04, HLR-05, HLR-08 at 1e-9 rel + 1e-12 coins, HO3 NO_PREVIOUS, HF3 S11
    never) and the REJECTs restored from our signed edition (concrete meaning lines A1, our real_check points A2, T3 from RAW A3, QUANT''s tie kept A4,
    coin map A5, v1 code A9, the HL3 backstop line); REVIEW_OXDATA_HL_V3V4_QUANT 42ae76e7, LAB1 co-sign 02:13:30Z'
means: Account-side position opening and closing valued at execution prices; opening share divides opened dollars by all opened and closed dollars. Both
  account sides may contribute. It does not measure deposits, new cash or predictive value.
example: 'SOL, u = 21:16:05, rows in (21:15:04, 21:16:04]: account A opened a long of 10 SOL at 180 (Open Long), account B closed a long of 30 SOL at 180
  (Close Long), account C flipped from short 5 to long 3 SOL at 181 (''Short > Long'', size 8: closes 5, opens 3). S07 (opened long) = 10 x 180 + 3 x 181
  = 2,343; S08 (opened short) = 0; S09 (closed long) = 5,400; S10 (closed short) = 5 x 181 = 905; S11 = 2,343 / (2,343 + 0 + 5,400 + 905) = 0.2709.'
formula: 'For coin c and point u: R = ALL fills rows of c (every account''s own row, both sides of each trade) with block_time_us in (u - 61 s, u - 1 s].
  Per row, the account''s own position change decides, never the dir word (BUILD4 09:35Z: the node writes the Liquidated word on BOTH rows of a liquidation
  trade): p0 = start_position (signed coins before the fill), p1 = p0 + sz when side is B, p0 - sz when side is A; open_long = max(p1, 0) - max(p0, 0) when
  above 0; close_long = max(p0, 0) - max(p1, 0) when above 0; open_short = max(-p1, 0) - max(-p0, 0) when above 0; close_short = max(-p0, 0) - max(-p1,
  0) when above 0 (a flip gives one close and one open). Rows counted: perp rows whose dir is a market-trade word (Open Long, Open Short, Close Long, Close
  Short, ''Long > Short'', ''Short > Long'', ''Liquidated Cross Long'', ''Liquidated Isolated Long'', ''Liquidated Cross Short'', ''Liquidated Isolated
  Short'', ''Auto-Deleveraging''); any other word (e.g. ''Net Child Vaults'') is counted UNMAPPED (flag and count, never added to S07-S10, kept in the producer''s
  raw check (c)); spot rows (Buy, Sell, ''Spot Dust Conversion'') excluded (QUANT MUST 07:27Z). A row whose word disagrees with its own position change
  (e.g. a Liquidated Long word on a row whose long grows) is counted DIR_DISAGREE, named, and still counted by its position change. Dollars = coins x px.
  S07 = sum open_long $, S08 = sum open_short $, S09 = sum close_long $, S10 = sum close_short $. S11 = (S07 + S08) / (S07 + S08 + S09 + S10); EMPTY NO_TRADE
  when the denominator is 0.'
source:
  kind: ours
  ref: PRODUCERS_HL_PLAN_V1 (LEAD), HL_DATA_LIST_V1 rows F07, F08; Hyperliquid node fills (dir, startPosition)
inputs:
- kind: reader
  ref: prod_reader_hl_node_v1
  exists: true
  stream: fills table of hl_node_read V1 (columns as in PRODUCER_HLFLOWX_V1)
  rule_in_force: every perp fill row with block time in (u - 61 s, u - 1 s]
  stale_rule: Per-output card limits; actual missing-hour and manifest-tail spans remain missing. Snapshot availability uses containing block time.
  days: D's 24 hour files; the CARRY of D-1 (its last 61 s)
  data_check: Exact source manifest/part hashes and independent raw reconstruction at the declared sampled points; not whole-history proof
  verdict: LIMITS
  waits_for: Independent release approval; source is available and bounded raw comparisons passed
  reader_call: hl_node_read.read on the reader of record (rebuild 78fa56c5 once released; OX-DATA A8)
overlaps: none
per_coin: coin map; spot coins excluded; thin coins mostly 0 and S11 EMPTY NO_TRADE
time: HOLE hours touching the window; crash days; the first minute of D from the CARRY of D-1
output:
  group_file: X1/day=<D>/HLFLOWX.parquet
  names:
  - name: S07
    label: hl_open_long_usd_60s
    units: USD
    value_kind: float
    decimals: none
    means: dollars of long positions opened in the last 60 s
    never:
    - net buying (opening a long can be a maker fill)
  - name: S08
    label: hl_open_short_usd_60s
    units: USD
    value_kind: float
    decimals: none
    means: dollars of short positions opened in the last 60 s
  - name: S09
    label: hl_close_long_usd_60s
    units: USD
    value_kind: float
    decimals: none
    means: dollars of long positions closed in the last 60 s (liquidations included)
  - name: S10
    label: hl_close_short_usd_60s
    units: USD
    value_kind: float
    decimals: none
    means: dollars of short positions closed in the last 60 s (liquidations included)
  - name: S11
    label: hl_opening_share_60s
    units: share 0 to 1
    value_kind: float
    decimals: none
    means: the share of opened dollars among all opened and closed dollars in the last 60 s
    never:
    - a share when nothing traded (EMPTY)
    - net direction
    - external capital inflow or deposits; new money entering the venue
  grid: 5s
  cadence: every 5 s on the add-on contract grid u = 00:00:00 to 23:59:55 of D (addon_contract_v1.grid; minute ends included), 17,280 points per coin per
    day; D 00:00:00 is the old D-1 24:00:00, values unchanged
  as_of_rule: as_of = u
  known_at_rule: 'known_at = u, so known_at <= as_of on every row (empty rows too): rows with block time <= u - 1 s only (MODEL_AVAILABLE_AT, 1 s delay)'
  known_at_kind: MODEL_AVAILABLE_AT
  empty_reasons:
  - reason: HOLE
    when: any hour touching the window is HOLE
  - reason: NO_TRADE
    when: S11 when nothing was opened or closed in the window
  - reason: NO_HISTORY
    when: points before 1 Sep 2025 00:01:01
  stale_rule: none (stale = 0 always)
  max_staleness_s: 60
  window_days: 0
  no_history: none
  fit_rule: none
  fifths: none
  flags:
  - flag: UNMAPPED_DIR
    when: the window holds a dir word outside the market-trade words (its count written)
  - flag: DIR_DISAGREE
    when: a row's dir word disagrees with its own position change (its count written; liquidation counterparties expected)
  quality_companion:
    codes:
    - code: X1.HLFLOWX.Q01
      kind: WORD
      meaning: Categorical JSON flags and pair_quality only
    - code: X1.HLFLOWX.Q03
      kind: WHOLE
      meaning: Unmapped direction count in the producer window; unknown coverage remains EMPTY
    - code: X1.HLFLOWX.Q04
      kind: WHOLE
      meaning: Direction disagreement count in the producer window; unknown coverage remains EMPTY
    writer: write_hl_v2.py
    scope: Diagnostic companions in the same family part and clock; never additional trading readings. Reconciliation receipts become known at the next
      snapshot, not earlier.
edge_cases:
- case: E1 the example (open, close, flip)
  input: A, B, C as in the example
  answer: S07 2343, S08 0, S09 5400, S10 905, S11 0.27091
- case: E2 the two rows of one trade
  input: a trade where the buyer opens a long and the seller closes a long, 1 SOL at 180
  answer: S07 180 and S09 180 (each account's own row counted)
- case: E4 a liquidation trade (the word on both rows), ADL and a vault row
  input: the liquidated account sells 2 SOL at 180 (start_position +2, side A, 'Liquidated Cross Long'); its counterparty buys them (start_position 0, side
    B, the same word, as the node writes it); an 'Auto-Deleveraging' row of 1 SOL at 180 (start_position -5, side B); a 'Net Child Vaults' row
  answer: S09 += 360 (the liquidated long closed), S07 += 360 (the counterparty opened a long; DIR_DISAGREE 1), S10 += 180, the vault row UNMAPPED (count
    1)
- case: E3 nothing traded
  input: no rows
  answer: S07-S10 0, S11 EMPTY NO_TRADE

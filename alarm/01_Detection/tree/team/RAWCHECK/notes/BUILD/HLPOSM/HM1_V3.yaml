  "means": "The same crowding readings as the hourly snapshot (HLPOSX), but up to date at each minute: every account's position is the snapshot's plus all its fills since.",
  "example": "SOL, u = 10:20. The 10:00 snapshot (known 10:00:01) has account X long 1,000 SOL; X sold 300 SOL at 10:05 and 200 at 10:12 (fills with block time in (10:00:00, 10:19:59]); X's rebuilt position at 10:20 = 500 SOL long. Summed over all accounts the same way: S01 = 1,950,000, S02 = 1,950,000; the top 100 by |rebuilt| hold 58 pct long: S03 = 0.58; positions over 1 million dollars at HLPX S01 = 180 net +190,000: S04 = 190,000.",
  "formula": "For snapshot selection t_k=max(funding_time_us, containing block_time_us); known time=t_k+1s. Age=u-known time;3900s inclusive. This is MODEL_AVAILABLE_AT, not an observed receipt. For coin c and minute end u: k = the snapshot in force (t_k + 1 s <= u, at most 3,900 s old), taken in block b_k BEFORE that block's fills (QUANT MUST 07:29Z, raw rebuild 20251015 14:00 -> 15:00). For each account a: pos_a(u) = szi_a(k) + sum over a's PERP fills of c with block_number >= b_k (b_k's own fills included) and block time <= u - 1 s, of (+sz for side B, -sz for side A); spot and HIP-3 rows never (coin_kind). S01 = sum(pos for pos>0); S02 = -sum(pos for pos<0); S03 = sum(pos for pos>0 among the 100 largest |pos|) / sum(|pos| among them), ties by account address ascending; S04 = sum(pos) over accounts with |pos| x p(u) >= 1,000,000, p(u) = HLPX S01 at u. Accounts with pos = 0 are dropped. Every unexplained per-account reconciliation error beyond 1e-9 relative plus1e-12 coins refuses the check; affected account fraction is diagnostic only. Positions with abs(pos)<1e-9 native coins are treated as zero; all-zero state gives NO_POSITIONS for S01-S04.",
